d:SmoothBossBattles.SkipVictoryWait_WorldTree=Te deja salir justo tras vencer a uno de los tres jefes intermedios del Árbol del Mundo, solo en solitario.
d:SmoothBossBattles.SkipVictoryWait_WorldTreeFinal=Te deja salir justo tras el jefe final del Árbol del Mundo, lo que corta el final del juego.
d:SmoothBossBattles.enabled=Activa el registro de desarrollo del autor, que viene apagado y debe seguir apagado para el juego normal.
d:TidyBaseInfo.cursorGraceTicks=Cuántas pasadas de mantenimiento sobrevive el cursor libre después de que sales del panel, para que ir hasta el menú no lo desactive.
d:TidyBaseInfo.emptyPortraitScale=Multiplicador de tamaño del círculo de relleno dibujado en una ranura de trabajador vacía.
d:TidyBaseInfo.fallback.menu_assign=El texto en inglés de la acción Asignar, que solo se usa cuando no se pueden leer los archivos de idioma del mod.
d:TidyBaseInfo.fallback.menu_palbox=El texto en inglés de la acción Enviar a la Palcaja, que solo se usa cuando no se pueden leer los archivos de idioma del mod.
d:TidyBaseInfo.fallback.menu_resummon=El texto en inglés de la acción Volver a invocar, que solo se usa cuando no se pueden leer los archivos de idioma del mod.
d:TidyBaseInfo.gridOffsetX=Posición horizontal de la cuadrícula de Pals dentro del panel de información de trabajadores de la base, en unidades de pantalla.
d:TidyBaseInfo.gridOffsetY=Baja la cuadrícula de Pals, o la sube con un valor negativo, en píxeles.
d:TidyBaseInfo.gridWidth=Ancho de la cuadrícula de Pals en unidades de pantalla, suficiente para cuatro retratos por fila con el tamaño de icono que trae de fábrica.
d:TidyBaseInfo.hoverPanelOffsetX=Desplazamiento horizontal del panel de detalle que queda debajo de la cuadrícula de Pals, en unidades de pantalla.
d:TidyBaseInfo.hoverPanelOffsetY=Espacio entre la parte de abajo de la cuadrícula de Pals y la fila de estado que aparece debajo al pasar el cursor, en píxeles.
d:TidyBaseInfo.iconPadding=Espacio que se deja entre las celdas de Pal de la cuadrícula, en unidades de pantalla, en ambos ejes.
d:TidyBaseInfo.iconSize=Lado de una celda de Pal de la cuadrícula, en unidades de pantalla, de las que caben cuatro a lo ancho de la cuadrícula predeterminada.
d:TidyBaseInfo.inspectHoldKey=Tecla que se mantiene presionada para echar un vistazo rápido, que libera el cursor del mouse sobre la cuadrícula hasta que la sueltas.
d:TidyBaseInfo.inspectKey=Tecla que activa el cursor de ratón libre sobre el panel y lo desactiva al volver a presionarla, o vacío para desactivarla.
d:TidyBaseInfo.keybindModifier=Tecla modificadora que se mantiene presionada junto con las teclas de desplazamiento e inspección; NONE permite usarlas solas.
d:TidyBaseInfo.language=El idioma en el que este mod muestra sus propias etiquetas; auto sigue el ajuste de idioma del juego.
d:TidyBaseInfo.liveReloadSeconds=Cada cuántos segundos este mod vuelve a leer su archivo en busca de tus cambios, para que uno se aplique mientras juegas; 0 detiene la vigilancia hasta el próximo inicio.
d:TidyBaseInfo.maintenanceMs=Milisegundos entre las pasadas de mantenimiento que vuelven a plegar las filas de trabajadores del juego y siguen lo que hay bajo tu cursor.
d:TidyBaseInfo.maxGridHeight=Altura máxima que puede alcanzar la cuadrícula de Pals, en píxeles, antes de desplazarse por dentro en lugar de tapar la barra rápida.
d:TidyBaseInfo.menuItemGap=Espacio entre las entradas del menú de acciones del clic derecho, en píxeles.
d:TidyBaseInfo.menuItemPadding=Espacio arriba y abajo de cada etiqueta del menú de acciones del clic derecho, en píxeles.
d:TidyBaseInfo.menuItemPaddingX=Espacio a la izquierda y a la derecha de cada etiqueta del menú de acciones del clic derecho, en píxeles.
d:TidyBaseInfo.menuItemPaddingY=Espacio arriba y abajo de cada etiqueta del menú de acciones del clic derecho, en píxeles.
d:TidyBaseInfo.menuOffsetX=Espacio entre la cuadrícula de Pals y el menú de acciones del clic derecho que se abre al lado, en píxeles.
d:TidyBaseInfo.menuOffsetY=Desplazamiento vertical del menú de acciones del clic derecho respecto de la parte de arriba de la cuadrícula de Pals, en unidades de pantalla.
d:TidyBaseInfo.menuWidth=Ancho del menú de acciones del clic derecho en píxeles, que conviene subir si una etiqueta traducida queda cortada.
d:TidyBaseInfo.openDetailsOnClick=Abre la ficha completa del Pal del propio juego cuando haces clic en él; desactivado, fija su nombre y su estado debajo de la cuadrícula.
d:TidyBaseInfo.portraitOffsetX=Desplaza cada retrato de Pal a la derecha, o a la izquierda con un valor negativo, dentro de su propia celda.
d:TidyBaseInfo.portraitOffsetY=Desplaza cada retrato de Pal hacia abajo, o hacia arriba con un valor negativo, dentro de su propia celda.
d:TidyBaseInfo.portraitScale=Multiplicador de tamaño del retrato de un Pal dentro de su celda de la cuadrícula, donde 1.0 es el tamaño con el que lo dibuja el juego.
d:TidyBaseInfo.resummonTimeoutMs=Cuánto espera Resummon a que un Pal llegue a la Palcaja antes de rendirse y dejarlo donde está sin problemas.
d:TidyBaseInfo.scrollDownKey=Tecla que se pulsa con Alt para desplazar la cuadrícula de Pals un paso hacia abajo.
d:TidyBaseInfo.scrollStepPx=Distancia que la cuadrícula de Pals se mueve en cada paso de desplazamiento con el teclado, en unidades de pantalla.
d:TidyBaseInfo.scrollUpKey=Tecla que desplaza la cuadrícula de Pals un paso hacia arriba, presionada con el modificador de arriba, o vacío para desactivarla.
d:TidyBaseInfo.showEmptySlots=Muestra una ranura de trabajador vacía como un círculo de relleno; desactivado, la cuadrícula solo muestra tus propios Pals.
d:TidyBaseInfo.suspendInputOverPanel=Suspende el cambio de arma, el apuntado, el disparo y las órdenes a los Pals mientras el cursor está sobre el panel.
d:TidyBaseInfo.tokens.deepGraphite=Color hexadecimal de la placa que está detrás del menú de acciones del clic derecho.
d:TidyBaseInfo.tokens.forgedGold=Color hexadecimal del borde de la entrada del menú de acciones sobre la que está el mouse.
d:TidyBaseInfo.tokens.hairline=Color hexadecimal de la línea delgada alrededor de la placa del menú y de cada una de sus entradas.
d:TidyBaseInfo.tokens.raised=Color hexadecimal que rellena una entrada del menú de acciones del clic derecho.
d:TidyBaseInfo.tokens.raisedHover=Color hexadecimal que rellena la entrada del menú de acciones sobre la que está el mouse.
