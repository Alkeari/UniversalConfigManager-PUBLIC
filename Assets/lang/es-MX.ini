d:PalboxSearchPlus.poll_interval_ms=Milisegundos entre revisiones del cuadro de búsqueda, 50 de forma predeterminada, donde más alto cuesta menos y reacciona más lento. (?)
d:PalboxSearchPlus.restore_order_after_search=Deja la caja del Condensador y del Mercader como estaba cuando borras la búsqueda o sales de la pantalla.
d:PalboxSearchPlus.save_parameter_reads=Lee los datos guardados de los Pals para que funcionen las búsquedas de afortunado, favorito, condensador y potencial; apagado porque hacía fallar algunas instalaciones.
d:PalboxSearchPlus.search_host_asset=El marco del campo de búsqueda propio del mod, que captura Retroceso para editar en vez de cerrar la caja.
d:PalboxSearchPlus.search_host_class=Nombre de clase interno del marco del campo de búsqueda del mod; un valor incorrecto impide que aparezca la barra. (?)
d:PalboxSearchPlus.search_host_inner=Nombre interno del cuadro de texto dentro del marco de búsqueda del mod; mejor dejarlo exactamente como está. (?)
d:PalboxSearchPlus.show_focus_toggle=Muestra el botón de enfoque automático encima de la barra de búsqueda.
d:PalboxSearchPlus.show_status_line=Muestra encima de la barra de búsqueda la línea de estado por la que informan los planificadores de crianza y condensación.
d:PalboxSearchPlus.sorted_slots_per_search=Cuántas ranuras reordena físicamente una ordenación en el Condensador y el Mercader, siendo 120 cuatro páginas.
d:PalboxSearchPlus.source=Acredita las combinaciones de crianza incluidas a PalCalc, que las extrae de los archivos del juego.
d:PalboxSearchPlus.store_bar_nudge_x=Desplaza la barra de búsqueda del almacén de lado desde donde el mod la colocó; positivo la mueve a la derecha.
d:PalboxSearchPlus.store_bar_nudge_y=Desplaza la barra de búsqueda del almacén en vertical desde donde el mod la colocó; positivo la mueve hacia abajo.
d:PalboxSearchPlus.store_bar_x_offset=Qué tan a la derecha de la barra de búsqueda de la Caja 1 se coloca la barra del lado del almacén, en unidades de lienzo.
d:PalboxSearchPlus.store_bar_y_offset=Qué tan por debajo de la barra de búsqueda de la Caja 1 se coloca la barra del lado del almacén, en unidades de lienzo.
d:PalboxSearchPlus.version=De qué versión de PalCalc se generó la tabla de crianza incluida, datos más que una opción.
d:PalboxStatCompare.DebugLogging=Escribe mensajes de diagnóstico extra en el registro para solucionar problemas.
d:PalpediaEnhancer.ClearAllKey=Tecla que regresa todos los filtros, el orden y el objetivo de búsqueda a los valores predeterminados de abajo, o None para dejarla sin asignar.
d:PalpediaEnhancer.DefaultSearchTargets=Dónde busca el cuadro de búsqueda cuando abres la Palpedia; separa varios objetivos con comas.
d:PalpediaEnhancer.DefaultSort=El orden con el que se abre la lista de la Palpedia y al que la regresa la tecla que borra todo.
d:PalpediaEnhancer.DefaultSortDescending=Abre la Palpedia con ese orden invertido, así la última entrada o la más alta queda primero.
d:PalpediaEnhancer.DefaultUnreadOnly=Abre la Palpedia mostrando desde el inicio solo las entradas que todavía no has abierto.
d:PalpediaEnhancer.MarkAllSeenKey=Tecla que marca como abiertas todas las entradas sin leer de la Palpedia, igual que el botón Marcar todo como visto.
d:PalpediaEnhancer.RememberState=Conserva tus filtros, el orden, los objetivos de búsqueda y la última consulta cuando cierras y vuelves a abrir la Palpedia en la misma sesión.
d:PalpediaEnhancer.ShowMarkAllSeenButton=Muestra el botón Marcar todo como visto junto a la pestaña Stats; su tecla sigue funcionando aunque el botón esté oculto.
d:PalpediaEnhancer.ToggleUnreadKey=Tecla que muestra solo las entradas de la Palpedia que todavía no has abierto y quita el punto de nuevo sin que tengas que desplazarte.
d:PalpediaEnhancer.VerboseLogging=Escribe diagnósticos extra de la Palpedia en el registro, útil al reportar un fallo.
d:PalsLearnOverTime.__version=Sello de formato del registro de progreso guardado del mod; no es algo para editar a mano. (?)
d:PalsLearnOverTime.applyEnabled=Permite que el trabajo realizado suba de verdad la aptitud de un Pal; apagado registra el avance sin tocar la partida.
