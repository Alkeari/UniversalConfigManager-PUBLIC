d:PerfProbe.sp=Porcentaje de escala de renderizado que aplica PerfProbe, de 33 a 100, ignorado mientras DLSS controla la resolución.
d:PerfProbe.spset=Registra que elegiste un escalador tú mismo, para que PerfProbe deje de seguir la escala de renderizado propia del motor. (?)
d:PerfProbe.ssgi=Iluminación global en pantalla, donde 1 la activa, 0 la desactiva y -1 deja intacto el propio ajuste del juego. (?)
d:PerfProbe.ssr=Reflejos en pantalla, donde 1 los activa, 0 los desactiva y -1 deja intacto el propio ajuste del juego. (?)
d:PerfProbe.used=Registra que cambiaste al menos una opción gráfica de PerfProbe, lo que permite que el mod aplique algo al iniciar. (?)
d:PerfProbe.viewdist=Escala de distancia de visión en porcentaje que aplica PerfProbe, de 10 a 200, con -1 dejando intacto el propio valor del juego. (?)
d:PerfProbe.volfog=Niebla volumétrica, donde 1 la activa, 0 la desactiva y -1 deja intacto el propio ajuste del juego. (?)
d:PerfProbe.w=Ancho guardado del panel flotante al que pertenece este archivo, limitado al rango permitido de ese panel. (?)
d:PerfProbe.x=Borde izquierdo guardado del panel flotante al que pertenece este archivo, en unidades de pantalla desde la esquina superior izquierda. (?)
d:PerfProbe.y=Borde superior guardado del panel flotante al que pertenece este archivo, en unidades de pantalla desde la esquina superior izquierda. (?)
