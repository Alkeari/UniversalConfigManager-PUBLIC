d:PerfProbe.schema=Versión de formato de este archivo, escrita por PerfProbe para que una versión posterior pueda migrar un archivo más antiguo en vez de borrarlo. (?)
d:PerfProbe.settings.txt:mode=Método de escalado que aplica PerfProbe, elegido entre los que soporta tu hardware. (?)
d:PerfProbe.settings.txt:schema=Versión de formato del archivo de opciones, para que una versión posterior de PerfProbe pueda migrarlo en vez de borrarlo. (?)
d:PerfProbe.shadowdist=Escala de distancia de sombras en porcentaje que aplica PerfProbe, de 10 a 200, con -1 dejando intacto el propio valor del juego. (?)
d:PerfProbe.shafts=Rayos de luz, donde 1 los activa, 0 los desactiva y -1 deja intacto el propio ajuste del juego. (?)
d:PerfProbe.sharp=Intensidad de nitidez FSR2 que aplica PerfProbe, usada solo cuando el modo de escalado es FSR2. (?)
d:PerfProbe.skellod=Sesgo de nivel de detalle de malla esquelética que aplica PerfProbe, de 0 a 4, con -1 dejando intacto el propio valor del juego. (?)
