d:NoDecayFeedBag.InventoryType.PlayerEquipArmor=Numero che il gioco usa per gli slot dell'armatura, fissato dal gioco e non un'impostazione da cambiare. (?)
d:NoDecayFeedBag.InventoryType.WeaponLoadout=Numero che il gioco usa per gli slot delle armi, fissato dal gioco e non un'impostazione da cambiare. (?)
d:NoDecayFeedBag.debugLog=Scrive nel log l'attività dettagliata della mod invece delle poche righe di normale funzionamento.
d:NoDecayFeedBag.debugLogIntervalSeconds=Secondi tra le righe di stato dettagliate scritte nel log mentre il log di debug è attivo. (?)
d:NoDecayFeedBag.enabled=Attiva o disattiva l'intera mod, lasciando intatto il deterioramento del cibo quando è spenta. (?)
d:NoDecayFeedBag.freezeFeedBag=Impedisce al cibo negli slot della sacca del cibo di deteriorarsi, l'effetto principale della mod.
d:NoDecayFeedBag.freezeIntervalSeconds=Secondi tra i passaggi che aggiornano la sacca del cibo; più bassi sono più reattivi e più costosi. (?)
d:NoDecayFeedBag.freezeVerboseSeconds=Secondi tra le righe di log dettagliate sulla sacca del cibo mentre il log di debug è attivo. (?)
d:NoDecayFeedBag.inventoryRetrySeconds=Secondi tra un tentativo e l'altro mentre la mod attende che il tuo inventario diventi disponibile. (?)
d:NoDecayFeedBag.logPrefix=Etichetta di testo messa davanti a ogni riga che la mod scrive nel log. (?)
d:NoDeleteConfirm.Diagnostic=Registra ogni finestra di dialogo che apre il gioco, che è quanto chiede l'autore in una segnalazione di bug.
d:NoDeleteConfirm.VerboseLogging=Scrive righe aggiuntive di NoDeleteConfirm nel log di UE4SS per la risoluzione dei problemi.
d:NoGrapplingGunCooldownTimer.CoolDownTime=Secondi di recupero dopo aver sparato con il rampino, dove il valore predefinito del gioco è 8.
d:NoGrapplingGunCooldownTimer.palGameVersion=Versione del gioco per cui la mod è stata creata, stampata nella sua riga di log all'avvio. (?)
d:NoGrapplingGunCooldownTimer.palModName=Nome stampato davanti al messaggio di avvio della mod nel log. (?)
d:NoGrapplingGunCooldownTimer.palModVersion=Numero di versione della mod, stampato nella sua riga di log all'avvio e senza effetto sul gioco. (?)
