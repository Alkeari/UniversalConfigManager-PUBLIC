d:PalBoxQoL.button.label.B=Il canale blu del colore della dicitura sui pulsanti aggiunti da questa mod, da 0 a 1. (?)
d:PalBoxQoL.button.label.G=Il canale verde del colore della dicitura sui pulsanti aggiunti da questa mod, da 0 a 1. (?)
d:PalBoxQoL.button.label.R=Il canale rosso del colore della dicitura sui pulsanti aggiunti da questa mod, da 0 a 1. (?)
d:PalBoxQoL.button.layout.hAlign=Come si dispongono orizzontalmente i pulsanti aggiunti, dove l'autore richiede 1 (a sinistra) perché il riempimento li allunga per tutta la riga e nasconde le diciture del gioco.
