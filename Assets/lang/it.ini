d:MapCollectablesNative.Toggle.OutpostsOnMap=Mostra ogni posizione di avamposto come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.Paloxite=Stato combinato residuo per i giacimenti di paloxite che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
d:MapCollectablesNative.Toggle.PaloxiteOnMap=Mostra ogni posizione di giacimento di paloxite come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.PanelExpanded=Apre il pannello delle impostazioni della mod già espanso alla prossima apertura della mappa del mondo. (?)
d:MapCollectablesNative.Toggle.Quartz=Stato combinato residuo per i giacimenti di quarzo che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
d:MapCollectablesNative.Toggle.QuartzOnMap=Mostra ogni posizione di giacimento di quarzo come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.RelicTooltip=Mostra il pannello informativo della mappa del gioco quando passi il puntatore su un'icona di effige di Lifmunk.
d:MapCollectablesNative.Toggle.Relics=Stato combinato residuo per le effigi di Lifmunk che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
