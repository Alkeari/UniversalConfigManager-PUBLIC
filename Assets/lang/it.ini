d:ScanEffigiesBLP.beam_height_min=L'altezza minima che può raggiungere una colonna di fascio una volta applicata la sua scala di altezza. (?)
d:ScanEffigiesBLP.debug_profiling=Scrive nel log di UE4SS le tempistiche di scansione e aggiornamento per la risoluzione dei problemi. (?)
