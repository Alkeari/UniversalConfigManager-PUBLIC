d:PalArmy.Controller.SummonAllKey=Pulsante del controller che evoca l'intera squadra. (?)
d:PalArmy.Controller.SummonSelectedKey=Pulsante del controller che evoca il Pal aggiuntivo selezionato, o lo richiama a una seconda pressione. (?)
d:PalArmy.General.DebugLogging=Scrive nel log della mod l'attività dettagliata di Pal Army, solo per la risoluzione dei problemi.
