d:PalInsight.neutralIVColor.r=Quantità di rosso nel colore usato per i valori di potenziale intermedi, da 0 a 1. (?)
d:PalInsight.opacity=Opacità del pannello di analisi, da 0.4 per trasparente fino a 1.0 per pieno.
