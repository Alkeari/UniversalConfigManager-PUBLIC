d:ScanEffigiesBLP.effigy_list_refresh_ms=Ogni quanto, in millisecondi, viene ricostruito l'elenco degli oggetti tracciati, valori più alti costano meno prestazioni e individuano gli oggetti più tardi.
d:ScanEffigiesBLP.enable_beam_color=Colora ogni fascio con il colore impostato per il suo tipo invece di lasciare ogni fascio uguale. (?)
d:ScanEffigiesBLP.enable_beam_scale=Applica la scala di altezza propria di ogni tipo invece di dare a ogni fascio l'altezza predefinita. (?)
d:ScanEffigiesBLP.hotkeys.info_dump=Tasto che stampa nel log di UE4SS le informazioni di tracciamento attuali della mod. (?)
d:ScanEffigiesBLP.hotkeys.rescan=Tasto che forza una nuova scansione degli oggetti, per quando un fascio è scomparso.
d:ScanEffigiesBLP.hotkeys.toggle_all=Tasto che attiva o disattiva ogni fascio, interessando solo i tipi attivati nella configurazione.
d:ScanEffigiesBLP.max_spawns_per_frame=Quanti fasci possono essere creati in un singolo fotogramma, limitando il costo di un'ondata di nuovi oggetti. (?)
d:ScanEffigiesBLP.mobile_check_interval_ms=Ogni quanto, in millisecondi, vengono ricontrollati i bersagli mobili come Mimog. (?)
