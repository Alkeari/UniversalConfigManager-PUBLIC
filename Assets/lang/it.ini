d:PalBoxQoL.pacing.delayMs=Millisecondi tra un gruppo di preferiti e il successivo; aumentalo se un'operazione di massa fa scattare il gioco.
d:PalBoxQoL.pacing.importBatch=Pal importati per passaggio, che deve restare a 1 perché aumentarlo è ciò che ha rotto l'importazione.
d:PalBoxQoL.pacing.importDelayMs=Millisecondi tra un Pal importato e il successivo; aumentalo se il riepilogo segnala importazioni rifiutate.
d:PalBoxQoL.pairIndex=Posizione nell'elenco delle icone su cui si trovano ora le diciture sostituite Cerca e Ordina. (?)
d:PalBoxQoL.transfer.export.bForceExport=Esporta un Pal anche quando il gioco normalmente si rifiuterebbe di farlo.
d:PalBoxQoL.transfer.export.bRemoveOldData=Sostituisce la voce salvata esistente durante l'esportazione invece di aggiungerne una nuova accanto, un significato che l'autore stesso della mod annota come probabile e non confermato. (?)
d:PalBoxQoL.transfer.import.bOverwriteData=Importa sovrascrivendo una voce già presente nel gioco invece di lasciarla intatta.
d:PalEggInfo.EnableMod=Disattiva le informazioni sulle uova senza disinstallare la mod. (?)
d:PalInsight.activationMode=Apre il pannello di analisi dalla sua scorciatoia, oppure segue la tua mira attuale.
d:PalInsight.activeAbilitiesThreshold=Requisito di catture residuo per le abilità attive, tenuto a zero così decidono i valori della rivelazione progressiva. (?)
d:PalInsight.aimTriggerMode=Sceglie quale mira mostra il pannello: un'arma, il lancio di una Palsfera o entrambi.
d:PalInsight.analyzeHumans=Permette di analizzare gli umani allo stesso modo dei Pal. (?)
d:PalInsight.badIVColor.a=Opacità del colore usato per i valori di potenziale bassi, da 0 trasparente a 1 pieno. (?)
d:PalInsight.badIVColor.b=Quantità di blu nel colore usato per i valori di potenziale bassi, da 0 a 1. (?)
d:PalInsight.badIVColor.g=Quantità di verde nel colore usato per i valori di potenziale bassi, da 0 a 1. (?)
d:PalInsight.badIVColor.r=Quantità di rosso nel colore usato per i valori di potenziale bassi, da 0 a 1. (?)
