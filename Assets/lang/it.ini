d:PalBoxQoL.button.layout.vAlign=Come si dispongono verticalmente i pulsanti aggiunti, dove 0 riempie e assume l'altezza dei pulsanti del gioco e 2 li centra lasciandoli più bassi.
d:PalBoxQoL.button.layout.weight=Quanta larghezza libera della riga occupa ogni pulsante aggiunto quando la regola di dimensione è impostata su riempi. (?)
d:PalBoxQoL.glyphIndex=Posizione nell'elenco dei simboli su cui si trova ora l'icona del pulsante Cancella, azzerata a ogni sessione. (?)
