d:MapCollectablesNative.Toggle.RuinsOnCompass=Mostra le rovine antiche sulla bussola nel mondo di gioco con l'indicazione della distanza.
d:MapCollectablesNative.Toggle.RuinsOnMap=Mostra ogni posizione di rovina antica come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.ShouldHideClusteredIconsSetting=Raggruppa le icone affollate in una sola icona con un contatore, che si separa man mano che ingrandisci.
d:MapCollectablesNative.Toggle.ShowFogOfWar=Disegna la nebbia della mappa sul terreno inesplorato, lasciando intatti i tuoi dati di esplorazione salvati.
d:MapCollectablesNative.Toggle.Soralite=Stato combinato residuo per i giacimenti di soralite che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
d:MapCollectablesNative.Toggle.SoraliteOnMap=Mostra ogni posizione di giacimento di soralite come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.Sulfur=Stato combinato residuo per i giacimenti di zolfo che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
d:MapCollectablesNative.Toggle.SulfurOnMap=Mostra ogni posizione di giacimento di zolfo come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.ViewportCullSetting=Disegna le icone solo per la porzione di mappa che stai vedendo, il che mantiene la mappa fluida. (?)
d:MapCollectablesNative.Tuning.ClusterRadius=Quanto devono essere vicine due icone della mappa prima di fondersi in un'unica icona raggruppata.
d:NativeModOptions.PREFIX=Prefisso di nome interno che il framework usa per passare le impostazioni tra mod diverse.
d:NativeModOptions.enabled=Aggiunge al log i messaggi di sviluppo del framework delle opzioni delle mod.
d:NoBuildingLimits100.baseLimits=Allenta il limite dell'area della base, così puoi costruire fuori dal confine di una base e più vicino ad altre basi.
d:NoBuildingLimits100.buildControls=Abilita i tasti aggiuntivi che avvicinano, allontanano, alzano o abbassano l'anteprima di costruzione.
d:NoBuildingLimits100.buildingLimits=Rimuove i limiti di altezza di costruzione e di numero di strutture per base.
d:NoBuildingLimits100.collapseProtection=Impedisce alle strutture a sbalzo di crollare e di essere rimborsate subito dopo il posizionamento.
d:NoBuildingLimits100.debugLogging=Scrive nel log della mod dettagli aggiuntivi sulle costruzioni per le segnalazioni di bug. (?)
d:NoBuildingLimits100.dismantleRange=Distanza in unità di gioco entro cui una struttura può essere presa di mira per lo smontaggio.
d:NoBuildingLimits100.distanceCoarseStep=Unità di gioco di cui si sposta l'anteprima di costruzione a ogni pressione mentre tieni premuto Shift.
d:NoBuildingLimits100.distanceFineStep=Unità di gioco di cui si sposta l'anteprima di costruzione a ogni pressione senza Shift premuto.
d:NoBuildingLimits100.distanceIncreaseHotkey=Tasto che allontana l'anteprima di costruzione, con Shift per uno scatto più ampio.
d:NoBuildingLimits100.distanceMax=Distanza massima a cui l'anteprima di costruzione può essere allontanata da te, in unità di gioco. (?)
d:NoBuildingLimits100.distanceMin=Distanza minima a cui l'anteprima di costruzione può essere avvicinata, in unità di gioco, dove 100 corrisponde all'originale.
d:NoBuildingLimits100.distanceOffsetMax=Massimo spostamento in avanti dell'anteprima nelle costruzioni automatiche e con aggancio, in unità di gioco.
d:NoBuildingLimits100.errorRelaxation=Ignora i blocchi di posizionamento che impediscono una costruzione, mentre restano valide le regole su materiali, sblocchi e permessi.
d:NoBuildingLimits100.foundation=Allenta le regole delle fondamenta, così possono impilarsi, inclinarsi, fluttuare e stare più in basso sull'acqua.
d:NoBuildingLimits100.heightHotkey=Tasto che alza l'anteprima di costruzione, e con Shift premuto la abbassa.
d:NoBuildingLimits100.heightMax=Altezza massima a cui l'anteprima di costruzione può essere alzata, in unità di gioco sopra la sua altezza iniziale. (?)
d:NoBuildingLimits100.heightMin=Altezza minima a cui l'anteprima di costruzione può essere abbassata, in unità di gioco sotto la sua altezza iniziale. (?)
d:NoBuildingLimits100.heightStep=Unità di gioco di cui l'anteprima di costruzione sale o scende a ogni pressione. (?)
d:NoBuildingLimits100.perItemRules=Permette ai pezzi di toccarsi e sovrapporsi eliminando le regole di posizionamento specifiche di ogni oggetto.
d:NoBuildingLimits100.previewControlsEnabledByDefault=Avvia ogni sessione con i comandi dell'anteprima di costruzione già attivi invece della costruzione originale.
d:NoBuildingLimits100.previewControlsToggleHotkey=Tasto che attiva o disattiva i comandi di distanza e altezza dell'anteprima di costruzione.
d:NoBuildingLimits100.resourceRespawnTestHotkey=Tasto che esegue il test di ricomparsa del minerale, solo quando Resource Respawn Test Enabled è attivo. (?)
d:NoBuildingLimits100.resourceRespawnTestRadius=Raggio attorno a te che il test di ricomparsa del minerale controlla, solo quando Resource Respawn Test Enabled è attivo. (?)
d:NoBuildingLimits100.statusDuration=Secondi di permanenza a schermo dei messaggi dei comandi di costruzione, almeno 0.5. (?)
d:NoBuildingLimits100.support=Rimuove il requisito di sostegno strutturale, così i pezzi si collegano e restano sospesi ovunque.
d:NoDecayFeedBag.InventoryType.Common=Numero che il gioco usa per il tuo inventario principale, fissato dal gioco e non un'impostazione da cambiare. (?)
d:NoDecayFeedBag.InventoryType.DropSlot=Numero che il gioco usa per lo slot di rilascio, fissato dal gioco e non un'impostazione da cambiare. (?)
d:NoDecayFeedBag.InventoryType.Essential=Numero che il gioco usa per la borsa degli oggetti chiave, fissato dal gioco e non un'impostazione da cambiare. (?)
