d:PalboxSearchPlus.diagnostic_logging=Scrive un log dettagliato per le segnalazioni di bug, utile da attivare prima di riprodurre un problema.
d:PalboxSearchPlus.enable_client_view_sort=Riordina la vista del Palbox senza spostare i Pal e aggiunge al menu Ordina i pulsanti extra per statistiche e potenziale. (?)
d:PalboxSearchPlus.filter_debounce_ms=Millisecondi di pausa nella digitazione prima che la box rifiltri, così non si ricostruisce a ogni tasto. (?)
d:PalboxSearchPlus.focus_search_on_open=Dà la tastiera alla barra di ricerca appena una schermata si apre, il che sospende lo sfoglio con Q ed E finché non confermi.
d:PalboxSearchPlus.poll_interval_ms=Millisecondi tra i controlli della casella di ricerca, 50 per impostazione predefinita; valori più alti costano meno e reagiscono più lentamente. (?)
d:PalboxSearchPlus.restore_order_after_search=Rimette la box del Condensatore e del Mercante com'era quando cancelli la ricerca o esci dalla schermata.
d:PalboxSearchPlus.save_parameter_reads=Legge i dati salvati dei Pal perché funzionino le ricerche per fortunato, preferito, condensatore e potenziale; disattivato perché su alcune configurazioni causava crash.
d:PalboxSearchPlus.search_host_asset=Il riquadro del campo di ricerca della mod, che intercetta Backspace per modificare il testo invece di chiudere la box.
d:PalboxSearchPlus.search_host_class=Nome interno della classe del riquadro di ricerca della mod; un valore errato impedisce la comparsa della barra. (?)
d:PalboxSearchPlus.search_host_inner=Nome interno della casella di testo dentro il riquadro di ricerca della mod, meglio lasciarlo esattamente com'è. (?)
d:PalboxSearchPlus.show_focus_toggle=Mostra sopra la barra di ricerca il pulsante di messa a fuoco automatica.
d:PalboxSearchPlus.show_status_line=Mostra sopra la barra di ricerca la riga di stato attraverso cui riferiscono i pianificatori di accoppiamento e condensazione.
d:PalboxSearchPlus.sorted_slots_per_search=Quanti slot un ordinamento riordina davvero al Condensatore e dal Mercante, con 120 pari a quattro pagine.
d:PalboxSearchPlus.source=Attribuisce le coppie di accoppiamento incluse a PalCalc, che le estrae dai file di gioco.
d:PalboxSearchPlus.store_bar_nudge_x=Sposta lateralmente la barra di ricerca dello stoccaggio rispetto a dove l'ha messa la mod; valori positivi la spostano a destra.
d:PalboxSearchPlus.store_bar_nudge_y=Sposta verticalmente la barra di ricerca dello stoccaggio rispetto a dove l'ha messa la mod; valori positivi la spostano in basso.
d:PalboxSearchPlus.store_bar_x_offset=Quanto a destra della barra di ricerca della Box 1 si trova la barra di ricerca lato stoccaggio, in unità di canvas.
d:PalboxSearchPlus.store_bar_y_offset=Quanto sotto la barra di ricerca della Box 1 si trova la barra di ricerca lato stoccaggio, in unità di canvas.
d:PalboxSearchPlus.version=Da quale versione di PalCalc è stata generata la tabella di accoppiamento inclusa; sono dati, non un'impostazione.
d:PalboxStatCompare.DebugLogging=Scrive nel log messaggi diagnostici aggiuntivi per la risoluzione dei problemi.
d:PalpediaEnhancer.ClearAllKey=Tasto che riporta ogni filtro, l'ordinamento e il bersaglio di ricerca ai valori predefiniti impostati qui sotto, oppure None per lasciarlo non assegnato.
d:PalpediaEnhancer.DefaultSearchTargets=Dove cerca la casella di ricerca all'apertura della Palpedia; separa più bersagli con le virgole.
d:PalpediaEnhancer.DefaultSort=L'ordinamento con cui si apre la lista della Palpedia e a cui la riporta il tasto che azzera tutto.
d:PalpediaEnhancer.DefaultSortDescending=Apre la Palpedia con quell'ordinamento invertito, così la voce finale o più alta compare per prima.
d:PalpediaEnhancer.DefaultUnreadOnly=Apre la Palpedia mostrando già solo le voci che non hai ancora aperto.
d:PalpediaEnhancer.MarkAllSeenKey=Tasto che segna come aperte tutte le voci non lette della Palpedia, come il pulsante Segna tutto come visto.
d:PalpediaEnhancer.RememberState=Mantiene filtri, ordinamento, bersagli di ricerca e ultima ricerca quando chiudi e riapri la Palpedia nella stessa sessione.
d:PalpediaEnhancer.ShowMarkAllSeenButton=Mostra il pulsante Segna tutto come visto accanto alla scheda Stats; il suo tasto funziona anche quando il pulsante è nascosto.
d:PalpediaEnhancer.ToggleUnreadKey=Tasto che mostra solo le voci della Palpedia che non hai ancora aperto, togliendo il pallino di novità senza scorrere.
d:PalpediaEnhancer.VerboseLogging=Scrive nel log diagnostiche aggiuntive della Palpedia, utili quando segnali un bug.
d:PalsLearnOverTime.__version=Marcatore di formato del registro dei progressi salvato dalla mod, non da modificare a mano. (?)
d:PalsLearnOverTime.applyEnabled=Permette al lavoro svolto di aumentare davvero l'attitudine di un Pal; da spento traccia i progressi senza toccare il salvataggio.
d:PalsLearnOverTime.count=Registro interno di quante attitudini al lavoro esistono nel gioco; modificarlo non ha effetto. (?)
d:PalsLearnOverTime.enabled=Interruttore interno che la mod imposta per le proprie diagnostiche; modificarlo non ha effetto. (?)
d:PalsLearnOverTime.first=Registro interno del numero della prima attitudine al lavoro; modificarlo non ha effetto. (?)
d:PalsLearnOverTime.firstId=La prima attitudine al lavoro che la mod percorre, parte del blocco avanzato da lasciare stare. (?)
d:PalsLearnOverTime.last=Registro interno del numero dell'ultima attitudine al lavoro; modificarlo non ha effetto. (?)
d:PalsLearnOverTime.lastId=L'ultima attitudine al lavoro che la mod percorre, parte del blocco avanzato da lasciare stare. (?)
d:PalsLearnOverTime.logging=Scrive i progressi e i passaggi di livello nei file di log della mod.
d:PalsLearnOverTime.numWorkTypes=Quanti tipi di attitudine al lavoro la mod tiene sotto controllo, parte del blocco avanzato da lasciare stare. (?)
d:PalsLearnOverTime.probeSpawnQueues=Registra ogni pochi secondi la lunghezza delle code di generazione del gioco mentre un mondo si carica, per la risoluzione dei problemi.
d:PalsLearnOverTime.seq=Contatore interno che numera le righe diagnostiche della mod; modificarlo non ha effetto. (?)
d:PalsLearnOverTime.snapshotEvery=Millisecondi tra le riscritture del file di stato dei progressi, 30000 per impostazione predefinita.
d:PalsLearnOverTime.unlockTotalCost=Costo per sbloccare un tipo di lavoro che un Pal non ha, tenuto come riferimento e inutilizzato finché gli sblocchi restano disattivati.
d:PalsLearnOverTime.worldQuietSec=Secondi in cui il mondo deve restare fermo dopo il caricamento prima che i Pal inizino a guadagnare progressi; aumentalo se il caricamento causa crash.
d:PalworldEasyCheats.GodModeFlagName=Nome interno del flag che la mod usa per tracciare la modalità dio. (?)
d:PalworldEasyCheats.HungerFlagName=Nome interno del flag che la mod usa per tracciare il blocco della fame. (?)
d:PalworldEasyCheats.JumpFlagName=Nome interno del flag che la mod usa per tracciare il trucco del salto alto. (?)
d:PalworldEasyCheats.SavedSpeedMultiplier=Memorizza il moltiplicatore di velocità impostato l'ultima volta, così torna al prossimo avvio. (?)
d:PalworldEasyCheats.SpeedFlagName=Nome interno del flag che la mod usa per tracciare il trucco della velocità del personaggio. (?)
d:PalworldEasyCheats.building.buildingMaxZ=Imposta a che altezza dal suolo puoi costruire.
d:PalworldEasyCheats.building.buildingObjectMaxNum=Imposta quanti oggetti da costruzione può contenere una base.
d:PalworldEasyCheats.building.foundationFloatingAllowance=Imposta di quanto una fondazione può fluttuare dal suolo ed essere ancora piazzata.
d:PalworldEasyCheats.building.leanAngleMax=Imposta l'angolo massimo di inclinazione con cui un edificio può ancora essere piazzato.
d:PalworldEasyCheats.building.spawnableIfOverlapped=Ti permette di piazzare edifici che si sovrappongono ad altri oggetti.
d:PalworldEasyCheats.capture.perfectCaptureRate=Fa riuscire ogni tentativo di cattura di un Pal.
d:PalworldEasyCheats.capture.perfectFishCapture=Fa riuscire ogni tentativo di pesca.
d:PalworldEasyCheats.combat.godModeEnabled=Fa sì che il tuo personaggio non subisca danni.
d:PalworldEasyCheats.combat.includePalsGodMode=Estende la modalità dio anche ai tuoi Pal, oltre che al tuo personaggio.
d:PalworldEasyCheats.extras.infiniteAmmo=Impedisce che le munizioni si consumino quando spari.
d:PalworldEasyCheats.extras.instantPalRevive=Rianima all'istante un Pal abbattuto.
d:PalworldEasyCheats.extras.instantPalSkillCooldown=Rimuove il tempo di ricarica delle abilità dei tuoi Pal.
d:PalworldEasyCheats.extras.noFallDamage=Impedisce che tu subisca danni quando cadi.
d:PalworldEasyCheats.fuel.infiniteFuel=Impedisce che il carburante si consumi, così nulla che alimenti si esaurisce mai.
d:PalworldEasyCheats.hotkeys.fuel=Tasto che attiva o disattiva il carburante infinito (predefinito Alt+F).
d:PalworldEasyCheats.hotkeys.god=Tasto che attiva o disattiva la modalità dio (predefinito Alt+G).
d:PalworldEasyCheats.hotkeys.hunger=Tasto che attiva o disattiva il blocco della fame (predefinito Alt+H).
d:PalworldEasyCheats.hotkeys.jump=Tasto che attiva o disattiva il salto alto (predefinito Alt+J).
d:PalworldEasyCheats.hotkeys.speedDown=Tasto che abbassa il moltiplicatore di velocità del personaggio (predefinito -).
d:PalworldEasyCheats.hotkeys.speedReset=Tasto che ripristina il moltiplicatore di velocità del personaggio (predefinito Alt+0).
d:PalworldEasyCheats.hotkeys.speedUp=Tasto che alza il moltiplicatore di velocità del personaggio (predefinito =).
d:PalworldEasyCheats.hotkeys.stamina=Tasto che attiva o disattiva la stamina infinita (predefinito Alt+S).
d:PalworldEasyCheats.hunger.disableHunger=Impedisce che il tuo personaggio abbia fame.
d:PalworldEasyCheats.hunger.includePalsHunger=Estende il blocco della fame anche ai tuoi Pal, oltre che al tuo personaggio.
d:PalworldEasyCheats.jump.highJumpEnabled=Attiva il salto alto così il tuo personaggio salta più in alto del normale.
d:PalworldEasyCheats.jump.jumpHeightMultiplier=Imposta di quanto salta più in alto il tuo personaggio mentre il salto alto è attivo.
d:PalworldEasyCheats.map.levelOnLoadEnabled=Imposta il tuo personaggio a un livello scelto non appena carichi il salvataggio.
d:PalworldEasyCheats.map.levelOnLoadTarget=Imposta il livello del personaggio da applicare quando carichi il salvataggio.
d:PalworldEasyCheats.map.revealMap=Rivela l'intera mappa del mondo.
d:PalworldEasyCheats.map.revealMapClearSize=Imposta la dimensione dell'area liberata dalla nebbia della mappa quando la mappa viene rivelata. (?)
d:PalworldEasyCheats.map.unlockAllFastTravelPoints=Sblocca ogni punto di viaggio rapido sulla mappa.
d:PalworldEasyCheats.map.unlockAllNotes=Sblocca ogni appunto del mondo sulla mappa.
d:PalworldEasyCheats.map.unlockAllNotesNoXp=Sblocca ogni appunto del mondo senza dare l'esperienza che normalmente concede.
d:PalworldEasyCheats.map.unlockAllPalEffigies=Sblocca ogni effigie di Pal sulla mappa.
d:PalworldEasyCheats.map.unlockAllPalEffigiesNoXp=Sblocca ogni effigie di Pal senza dare l'esperienza che normalmente concede.
d:PalworldEasyCheats.movement.defaultSpeedMultiplier=Imposta il moltiplicatore di velocità a cui torna la scorciatoia di ripristino velocità. (?)
d:PalworldEasyCheats.movement.matchSwimSpeed=Applica il tuo moltiplicatore di velocità anche al nuoto, oltre che al movimento a terra. (?)
d:PalworldEasyCheats.movement.maxSpeedMultiplier=Imposta il moltiplicatore di velocità più alto che le scorciatoie di velocità possono raggiungere. (?)
d:PalworldEasyCheats.movement.minSpeedMultiplier=Imposta il moltiplicatore di velocità più basso che le scorciatoie di velocità possono raggiungere. (?)
d:PalworldEasyCheats.movement.speedMultiplier=Imposta quanto più veloce del normale si muove il tuo personaggio.
d:PalworldEasyCheats.movement.speedStep=Imposta di quanto le scorciatoie di velocità cambiano il moltiplicatore di velocità a ogni pressione. (?)
d:PalworldEasyCheats.multipliers.characterMaxLevel=Imposta il livello più alto che il tuo personaggio può raggiungere.
d:PalworldEasyCheats.multipliers.techPointMultiplier=Moltiplica i punti tecnologia che guadagni.
d:PalworldEasyCheats.stamina.infiniteStamina=Impedisce che la tua stamina si esaurisca.
d:PalworldEasyCheats.system.applyOnLoadDelayMs=Imposta per quanto tempo, in millisecondi, la mod aspetta dopo il caricamento del salvataggio prima di applicare le impostazioni.
d:PalworldEasyCheats.system.disablePermanentConfirmAlerts=Blocca gli avvisi di conferma mostrati prima che venga applicata un'opzione permanente. (?)
d:PalworldEasyCheats.system.maintainIntervalMs=Imposta ogni quanto, in millisecondi, la mod riapplica i tuoi trucchi attivi. (?)
d:PalworldEasyCheats.system.persistModifications=Mantiene applicati i trucchi scelti invece di azzerarli ogni volta che giochi. (?)
d:PalworldEasyCheats.system.skipModDisclaimer=Salta l'avviso sulle mod rilevate che il gioco mostra all'avvio.
d:PalworldEasyCheats.travel.fastTravelAnyMapIcon=Ti permette di viaggiare rapidamente da qualsiasi icona sulla mappa.
d:PalworldEasyCheats.work.fasterWorkSpeed=Fa lavorare più in fretta i tuoi Pal.
d:PalworldEasyCheats.work.noBuildingCosts=Ti permette di piazzare edifici senza spendere materiali.
d:PalworldEasyCheats.work.noCraftingCosts=Ti permette di craftare oggetti senza spendere materiali.
d:PalworldEasyCheats.work.workSpeedMultiplier=Imposta quanto più in fretta lavorano i tuoi Pal mentre la velocità di lavoro maggiorata è attiva.
d:PartySlotExtender.PartySlotCount=Imposta quanti Pal viaggiano nella tua squadra, da 6 a 10, con 8 come valore predefinito.
d:PassivePals.aggressivePalProfile=Profilo di reazione usato dai pal che di norma ti danno la caccia appena ti vedono; default segue l'impostazione qui sopra.
d:PassivePals.alphaAndBossProfile=Profilo di reazione usato dagli alpha e dai boss del gioco; default segue l'impostazione valida per tutti i pal.
d:PassivePals.behaviorProfiles.custom.AttackedByEqual=Reazione del profilo custom quando lo colpisce un PNG di forza simile.
d:PassivePals.behaviorProfiles.custom.AttackedByPlayer=Reazione del profilo custom quando sei tu a colpire il personaggio.
d:PassivePals.behaviorProfiles.custom.AttackedByStronger=Reazione del profilo custom quando lo colpisce un PNG più forte.
d:PassivePals.behaviorProfiles.custom.AttackedByWeaker=Reazione del profilo custom quando lo colpisce un PNG più debole.
d:PassivePals.behaviorProfiles.custom.SeeEqual=Reazione del profilo custom quando un personaggio nota un PNG di forza simile.
d:PassivePals.behaviorProfiles.custom.SeePlayer=Reazione del profilo custom quando un personaggio ti nota e non è ancora successo nulla.
d:PassivePals.behaviorProfiles.custom.SeeStronger=Reazione del profilo custom quando un personaggio nota un PNG più forte.
d:PassivePals.behaviorProfiles.custom.SeeWeaker=Reazione del profilo custom quando un personaggio nota un PNG più debole.
d:PassivePals.defaultHumanProfile=Profilo di reazione usato da ogni PNG umano, lasciato su vanilla perché gli umani ostili restino pericolosi e gli abitanti si comportino normalmente.
d:PassivePals.defaultPalProfile=Profilo di reazione usato da ogni pal fuori dal tuo controllo, a meno che un preset di IA o una regola di specie qui sotto non lo sostituisca.
d:PassivePals.friendlyPalProfile=Profilo di reazione usato dalle sei specie amichevoli, tra cui Lamball, Chikipi e Daedream.
d:PassivePals.hostileHumanProfile=Profilo di reazione usato dagli umani che ti attaccano a vista, come i predoni degli accampamenti di cacciatori.
d:PassivePals.liveReloadSeconds=Ogni quanti secondi questa mod controlla il suo file per le tue modifiche, così che una modifica si applichi mentre giochi; 0 ferma il controllo fino al prossimo avvio.
d:PassivePals.logging=Quanto scrive questa mod nel log di UE4SS; quiet tiene solo la riga di caricamento, gli avvisi e i problemi.
d:PassivePals.nativePresetClassPath=Indirizzo interno del tipo di preset di reazione di cui la mod crea un esemplare per ogni specie configurata.
d:PassivePals.neutralPalProfile=Profilo di reazione usato dai pal che di norma ti ignorano finché qualcosa non li colpisce davvero.
d:PassivePals.pollLimit=Quanti tentativi fa la mod prima di rinunciare per questa sessione e lasciare invariata la reazione di ogni pal.
d:PassivePals.pollSeconds=Secondi tra un tentativo e l'altro mentre la mod aspetta che il gioco carichi i preset di IA che riscrive.
d:PassivePals.preservePettingBehavior=Mantiene nelle specie docili l'avvicinarsi per farsi accarezzare, invece di lasciarlo sostituire dal profilo scelto.
d:PassivePals.response.Battle=Il numero del gioco stesso per il combattere solo quando il controllo di forza dice che si può vincere.
d:PassivePals.response.Battle_Anyway=Il numero del gioco stesso per il combattere sempre, senza alcun controllo di forza.
d:PassivePals.response.Escape=Il numero del gioco stesso per la reazione che fa scappare un pal.
d:PassivePals.response.Ignore=Il numero del gioco stesso per la reazione che non fa nulla, né lotta né fuga.
d:PassivePals.response.Special=Il numero del gioco stesso per la reazione con script, come un pal docile che si avvicina per farsi accarezzare.
d:PassivePals.sensorSensePath=Indirizzo interno della decisione di percezione del gioco stesso a cui si agganciano le regole per specie.
d:PassivePals.skittishPalProfile=Profilo di reazione usato dai pal che di norma scappano quando ti avvicini, come Cattiva e Lifmunk.
d:PassivePals.speciesRules.rule1Profile=Profilo di reazione della specie indicata nella prima regola; ha la precedenza su ogni impostazione qui sopra.
d:PassivePals.speciesRules.rule1Species=La specie a cui si applica questa prima regola, scritta come nome inglese, id interno o nome di Blueprint.
d:PassivePals.speciesRules.rule2Profile=Profilo di reazione della specie indicata nella seconda regola; ha la precedenza su ogni impostazione qui sopra.
d:PassivePals.speciesRules.rule2Species=La specie a cui si applica questa seconda regola, scritta come nome inglese, id interno o nome di Blueprint.
d:PassivePals.speciesRules.rule3Profile=Profilo di reazione della specie indicata nella terza regola; ha la precedenza su ogni impostazione qui sopra.
d:PassivePals.speciesRules.rule3Species=La specie a cui si applica questa terza regola, scritta come nome inglese, id interno o nome di Blueprint.
d:PassivePals.villagerProfile=Profilo di reazione usato da abitanti, mercanti e poliziotti; default segue l'impostazione valida per tutti gli umani.
