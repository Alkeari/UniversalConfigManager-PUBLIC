d:PerfProbe.hudDumpRequested=Flag per sviluppatori che chiede a PerfProbe di scrivere un dump dell'albero dei widget dell'HUD al prossimo fotogramma. (?)
d:PerfProbe.key_cmd.txt:mode=Se l'osservatore della scorciatoia dell'equipaggiamento sta osservando, catturando un nuovo tasto o è inattivo. (?)
d:PerfProbe.loadouts.txt:schema=Versione del formato del file degli insiemi di equipaggiamento, così una versione successiva di PerfProbe può migrarlo invece di cancellarlo. (?)
d:PerfProbe.lumengi=Illuminazione globale Lumen, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.lumenrefl=Riflessi Lumen, dove 1 li attiva, 0 li disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.mblur=Sfocatura di movimento, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.mode=In settings.txt il metodo di upscaling applicato da PerfProbe, e in key_cmd.txt se l'osservatore della scorciatoia dell'equipaggiamento sta osservando, catturando o è inattivo. (?)
d:PerfProbe.occl=Cattura di occlusione del cielo, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.overlay=Percorso della risorsa che PerfProbe ricorda per la finestra di assegnazione tasti del gioco, così non deve ricercarla di nuovo al prossimo avvio. (?)
d:PerfProbe.palboxbrowser=Mostra l'indice mobile del Palbox accanto al Palbox originale ogni volta che ne apri uno.
d:PerfProbe.param=Percorso della risorsa che PerfProbe ricorda per l'oggetto parametro di configurazione tasti del gioco usato dalla finestra di assegnazione tasti. (?)
d:PerfProbe.primary=Tasto o pulsante che scambia il tuo insieme di equipaggiamento accessori, scritto come id tasto proprio di PerfProbe. (?)
d:PerfProbe.recon.BABY_HALF=Moltiplicatore di taglia a cui punta la modalità cucciolo quando rimpicciolisce i tuoi Pal, prima che si applichino i limiti minimo e massimo. (?)
d:PerfProbe.recon.BABY_MAX_CM=Altezza massima in centimetri che un Pal rimpicciolito dalla modalità cucciolo può raggiungere, il che abbassa ulteriormente le specie giganti. (?)
d:PerfProbe.recon.BABY_MIN_CM=Altezza minima in centimetri che un Pal rimpicciolito dalla modalità cucciolo può raggiungere. (?)
d:PerfProbe.recon.MESH_PROBE_CAP=Quante mesh percorre una sonda mesh per sviluppatori prima di fermarsi, così una scansione non può bloccare il gioco. (?)
d:PerfProbe.recon.SMC_MAT_CAP=Quanti materiali legge una scansione mesh statica per sviluppatori prima di fermarsi, così una scansione non può bloccare il gioco. (?)
d:PerfProbe.recon.SMC_SCAN_CAP=Quanti componenti mesh statica percorre una scansione per sviluppatori prima di fermarsi, così una scansione non può bloccare il gioco. (?)
d:PerfProbe.recon.dlssDumpRequested=Flag per sviluppatori che chiede a PerfProbe di interrogare una volta la libreria DLSS e stampare cosa supporta l'hardware. (?)
d:PerfProbe.recon.statReadRequested=Flag per sviluppatori che chiede a PerfProbe di leggere una volta i risultati delle statistiche di unità del gioco e stamparli nel log. (?)
d:PerfProbe.rendercontrols=Interruttore principale del percorso grafico di PerfProbe, dove 0 lascia ogni impostazione di rendering al gioco senza disattivare le altre funzioni della mod.
d:PerfProbe.schema=Versione del formato di questo file, scritta da PerfProbe così una versione successiva può migrare un file più vecchio invece di cancellarlo. (?)
d:PerfProbe.settings.txt:mode=Metodo di upscaling applicato da PerfProbe, scelto tra quelli supportati dal tuo hardware. (?)
d:PerfProbe.settings.txt:schema=Versione del formato del file delle impostazioni, così una versione successiva di PerfProbe può migrarlo invece di cancellarlo. (?)
d:PerfProbe.shadowdist=Scala della distanza delle ombre in percentuale applicata da PerfProbe, da 10 a 200, con -1 che lascia intatto il valore del gioco stesso. (?)
d:PerfProbe.shafts=Raggi di luce, dove 1 li attiva, 0 li disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.sharp=Intensità di nitidezza FSR2 applicata da PerfProbe, usata solo quando la modalità di upscaling è FSR2. (?)
d:PerfProbe.skellod=Scostamento del livello di dettaglio della mesh scheletrica applicato da PerfProbe, da 0 a 4, con -1 che lascia intatto il valore del gioco stesso. (?)
d:PerfProbe.sky=Mesh del cielo come sole, luna e mappa stellare, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.sp=Percentuale di scala di rendering applicata da PerfProbe, da 33 a 100, ignorata mentre il DLSS guida la risoluzione.
d:PerfProbe.spset=Registra che hai scelto tu stesso un upscaler, così PerfProbe smette di seguire la scala di rendering del motore stesso. (?)
d:PerfProbe.ssgi=Illuminazione globale in spazio schermo, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.ssr=Riflessi in spazio schermo, dove 1 li attiva, 0 li disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.used=Registra che hai cambiato almeno un'impostazione grafica di PerfProbe, il che è ciò che permette alla mod di applicare qualcosa all'avvio. (?)
d:PerfProbe.viewdist=Scala della distanza di visuale in percentuale applicata da PerfProbe, da 10 a 200, con -1 che lascia intatto il valore del gioco stesso. (?)
d:PerfProbe.volfog=Nebbia volumetrica, dove 1 la attiva, 0 la disattiva e -1 lascia intatta l'impostazione del gioco stesso. (?)
d:PerfProbe.w=Larghezza salvata del pannello mobile a cui appartiene questo file, limitata all'intervallo consentito da quel pannello. (?)
d:PerfProbe.x=Bordo sinistro salvato del pannello mobile a cui appartiene questo file, in unità dello schermo dall'angolo in alto a sinistra. (?)
d:PerfProbe.y=Bordo superiore salvato del pannello mobile a cui appartiene questo file, in unità dello schermo dall'angolo in alto a sinistra. (?)
d:PerfectPlacement.bindings.copy_piece.key=Tasto contagocce che copia il pezzo di costruzione inquadrato nell'anteprima attiva.
d:PerfectPlacement.bindings.freeze_at_piece.key=Tasto che blocca il pezzo selezionato sul punto di ancoraggio inquadrato.
d:PerfectPlacement.bindings.freeze_to_piece.key=Tasto che copia posizione e rotazione del pezzo inquadrato in un'anteprima sostitutiva e la blocca lì.
d:PerfectPlacement.bindings.move_back=Tasto che sposta indietro l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.move_down=Tasto che abbassa l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.move_forward=Tasto che sposta in avanti l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.move_left=Tasto che sposta a sinistra l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.move_right=Tasto che sposta a destra l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.move_up=Tasto che alza l'anteprima bloccata del passo di movimento attuale.
d:PerfectPlacement.bindings.reset=Tasto che riporta l'anteprima alla posizione e alla rotazione che aveva al momento del blocco.
d:PerfectPlacement.bindings.rotate_left=Tasto che ruota a sinistra l'anteprima bloccata del passo di rotazione attuale.
d:PerfectPlacement.bindings.rotate_right=Tasto che ruota a destra l'anteprima bloccata del passo di rotazione attuale.
d:PerfectPlacement.bindings.rotation_step_down=Tasto che scende all'incremento di rotazione più piccolo successivo.
d:PerfectPlacement.bindings.rotation_step_up=Tasto che sale all'incremento di rotazione più grande successivo.
d:PerfectPlacement.bindings.step_down=Tasto che riduce il passo di movimento, così ogni pressione sposta meno l'anteprima.
d:PerfectPlacement.bindings.step_up=Tasto che aumenta il passo di movimento, così ogni pressione sposta di più l'anteprima.
d:PerfectPlacement.bindings.toggle_freeze=Tasto che blocca sul posto l'anteprima di costruzione o la libera di nuovo.
d:PerfectPlacement.diagnostics.ui_lifecycle_log_interval_ms=Millisecondi tra le righe dei contatori dell'interfaccia di costruzione quando quei contatori diagnostici sono attivi. (?)
d:PerfectPlacement.diagnostics.verbose=Scrive righe di diagnostica aggiuntive nel log di UE4SS, cosa che può produrne moltissime.
d:PerfectPlacement.gamepad.enabled=Attiva il supporto al controller tramite il ponte di input di accompagnamento, che richiede un riavvio del gioco.
d:PerfectPlacement.gamepad.invert_forward_back=Scambia i pulsanti del controller che spostano avanti e indietro l'anteprima bloccata.
d:PerfectPlacement.gamepad.invert_height=Scambia i pulsanti del controller che spostano su e giù l'anteprima bloccata.
d:PerfectPlacement.gamepad.swap_rotate_buttons=Scambia i pulsanti del controller che ruotano a sinistra e a destra l'anteprima bloccata.
d:PerfectPlacement.hold_locked_transform=Continua a riapplicare la posizione bloccata così l'anteprima non può tornare al mirino, con un costo per frame.
d:PerfectPlacement.movement.coarse=Passo di movimento grossolano residuo di cento centimetri che la mod non legge più. (?)
d:PerfectPlacement.movement.fine=Passo di movimento fine residuo di un centimetro che la mod non legge più da nessuna parte. (?)
d:PerfectPlacement.movement.maximum=Passo di movimento massimo in centimetri raggiungibile con il tasto di aumento, tra 0.1 e 1000.
d:PerfectPlacement.movement.maximum_above_initial_cm=Centimetri di cui l'anteprima bloccata può essere alzata sopra l'altezza a cui è stata bloccata, 650 per impostazione predefinita.
d:PerfectPlacement.movement.maximum_below_initial_cm=Centimetri di cui l'anteprima bloccata può essere abbassata sotto l'altezza a cui è stata bloccata, 25 per impostazione predefinita.
d:PerfectPlacement.movement.minimum=Passo di movimento minimo in centimetri raggiungibile con il tasto di riduzione, tra 0.1 e 1000.
d:PerfectPlacement.movement.normal=Passo di movimento in centimetri da cui parte l'anteprima bloccata, tra 0.1 e 1000.
d:PerfectPlacement.movement.step_scale=Moltiplicatore applicato al passo di movimento a ogni pressione di aumento o riduzione, 2, 5 o 10.
d:PerfectPlacement.rotation.coarse=Passo di rotazione grossolano in gradi sulla scala dei passi di rotazione, 15 gradi per impostazione predefinita.
d:PerfectPlacement.rotation.fine=Passo di rotazione fine in gradi sulla scala dei passi di rotazione, 1 grado per impostazione predefinita.
d:PerfectPlacement.rotation.normal=Passo di rotazione intermedio in gradi sulla scala dei passi di rotazione, 5 gradi per impostazione predefinita.
d:PerfectPlacement.rotation.precision=Passo di rotazione più piccolo in gradi sulla scala dei passi di rotazione, un decimo di grado per impostazione predefinita. (?)
d:PerfectPlacement.rotation.snap=Passo di rotazione più grande in gradi sulla scala dei passi di rotazione, 45 gradi per impostazione predefinita.
d:PerfectPlacement.transform_refresh_ms=Millisecondi tra le riapplicazioni della posizione bloccata mentre quel mantenimento è attivo. (?)
d:PerfectPlacement.ui.gamepad_enabled_property=Nome interno del campo della guida che indica se l'input del controller è attivo. (?)
d:PerfectPlacement.ui.hide_function=Nome interno della chiamata di accompagnamento che nasconde la guida al posizionamento; modificarlo non ha effetto. (?)
d:PerfectPlacement.ui.hide_toast_function=Nome interno della chiamata di accompagnamento che cancella il messaggio di blocco e rilascio. (?)
d:PerfectPlacement.ui.host_class_name=Nome del widget di accompagnamento a cui si aggancia la guida al posizionamento; modificarlo non ha effetto. (?)
d:PerfectPlacement.ui.move_step_property=Nome interno del campo della guida che riporta il passo di movimento attuale in centimetri. (?)
d:PerfectPlacement.ui.refresh_function=Nome interno della chiamata di accompagnamento che ridisegna la guida al posizionamento dopo una modifica. (?)
d:PerfectPlacement.ui.show_frozen_guide_function=Nome interno della chiamata di accompagnamento che mostra la guida mentre un'anteprima è bloccata. (?)
d:PerfectPlacement.ui.show_frozen_toast_function=Nome interno della chiamata di accompagnamento che mostra il messaggio quando un'anteprima viene bloccata. (?)
d:PerfectPlacement.ui.show_unfrozen_guide_function=Nome interno della chiamata di accompagnamento che mostra la guida mentre un'anteprima non è bloccata. (?)
d:PerfectPlacement.ui.show_unfrozen_toast_function=Nome interno della chiamata di accompagnamento che mostra il messaggio quando un'anteprima viene rilasciata. (?)
d:PerfectPlacement.ui.use_palworld_keycaps=Disegna i comandi di posizionamento con icone dei tasti in stile Palworld nella guida di costruzione. (?)
d:PingMod.bypass_guild_marker_limit=Piazza un ping anche al limite dei segnalini della gilda rimuovendone brevemente un altro.
d:Plasma Multicutter Damage.damage_per_hit=Quanto danno infligge ogni colpo del Plasma Multicutter ai nemici. (?)
d:Plasma Multicutter Damage.debug_logging=Scrive righe diagnostiche aggiuntive di Plasma Multicutter Damage nel log di UE4SS. (?)
d:Plasma Multicutter Damage.target_cooldown_seconds=Per quanto tempo lo stesso bersaglio deve aspettare prima che il Plasma Multicutter possa colpirlo di nuovo, in secondi. (?)
d:RecoverPalSpheres.debug=Scrive nel log l'attività dettagliata di recupero delle sfere per una segnalazione di bug.
d:RecoverPalSpheres.enabled=Copia dell'interruttore del log di debug che la mod conserva durante l'esecuzione, presa dalle impostazioni principali. (?)
d:RecoverPalSpheres.max_pickup_lifetime=Secondi per cui un oggetto recuperato resta nel mondo; -1 lo mantiene per sempre e 0 salta gli oggetti a terra.
d:RecoverPalSpheres.notify_inventory_return=Mostra il normale messaggio di oggetto ricevuto per le sfere restituite direttamente al tuo inventario.
d:RecoverPalSpheres.return_sphere_min_distance_x=Distanza orizzontale massima in metri alla quale una sfera mancata viene lasciata a terra da raccogliere.
d:RecoverPalSpheres.return_sphere_min_distance_y=Distanza verticale massima in metri alla quale una sfera mancata viene lasciata a terra da raccogliere.
d:RecoverPalSpheres.sphere_launcher_pickups=Permette ai tiri mancati del lanciatore di diventare oggetti a terra per i giocatori singoli e gli host in cooperativa.
d:RecoverPalSpheres.sphere_recovery_percentage=Probabilità percentuale che una Palsfera mancata venga recuperata invece che persa, da 0 a 100.
d:ScanEffigiesBLP.base_suppress_radius=Raggio del tuo accampamento base usato per nascondere i fasci soppressi vicino a una base, come quello di Mimog.
d:ScanEffigiesBLP.beam_color_param_name=Nome del parametro colore sull'effetto del fascio che la mod imposta per colorarlo. (?)
