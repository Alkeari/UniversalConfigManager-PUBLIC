d:MapCollectablesNative.Toggle.RelicsOnCompass=Mostra le effigi di Lifmunk sulla bussola nel mondo di gioco con l'indicazione della distanza.
d:MapCollectablesNative.Toggle.RelicsOnMap=Mostra ogni posizione di effige di Lifmunk come icona sulla mappa del mondo.
d:MapCollectablesNative.Toggle.ResourcesEnabled=Interruttore principale di tutte le icone dei minerali, che attiva o disattiva in blocco l'intero gruppo delle risorse.
d:MapCollectablesNative.Toggle.RespectFogOfWar=Nasconde le icone della mod sotto la nebbia di guerra inesplorata, come fanno le icone della mappa del gioco.
d:MapCollectablesNative.Toggle.RuinTooltip=Mostra un riquadro informativo quando passi il puntatore su un'icona di rovine antiche sulla mappa.
d:MapCollectablesNative.Toggle.Ruins=Stato combinato residuo per le rovine antiche che la mod riscrive da sé, quindi modificarlo non ha effetti duraturi. (?)
