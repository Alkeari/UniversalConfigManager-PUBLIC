d:PalArmy.Collision.DebugLogging=Scrive nel log della mod i dettagli sulle collisioni in sella per le segnalazioni di bug. (?)
d:PalArmy.Collision.MountedPartyNoCollision=Evita che tu e la tua cavalcatura restiate bloccati sugli altri Pal della squadra mentre cavalchi.
d:PalArmy.Controller.Enabled=Attiva i pulsanti del gamepad per evocare e richiamare i Pal aggiuntivi della squadra. (?)
