d:PalArmy.destruct_path=Percorso interno del gioco usato per accorgersi della chiusura di una finestra della squadra, non pensato per essere modificato. (?)
d:PalBoxQoL.DEV_DEBUG_MODE_ENABLED=Abilita i tasti di sviluppo e gli strumenti di analisi dell'autore, disattivati per il gioco normale.
d:PalBoxQoL.LOCAL_MARKER=Nome interno che la mod cerca per individuare l'elenco Palbox locale invece di quello globale.
d:PalBoxQoL.alphaIndex=Posizione nell'elenco delle sfumature della targa su cui si trova ora la barra degli strumenti, azzerata a ogni sessione. (?)
