d:NoGrapplingGunCooldownTimer.palRedColorWrapperFront=Avvia la colorazione rossa del messaggio di avvio della mod nel log. (?)
d:NoPalDeposit.CMD_QUERY=Nome interno del messaggio di rete usato per chiedere all'host lo stato di una cassa, quindi lascialo invariato. (?)
d:NoPalDeposit.CMD_STATE=Nome interno del messaggio di rete con cui l'host risponde con lo stato di una cassa, quindi lascialo invariato. (?)
