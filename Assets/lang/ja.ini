d:InstantHaul.FacilityNearSec=自分の近くにある生産設備から完成品を回収する間隔の秒数です。
d:InstantHaul.FacilityTriggerMode=完成品を引き出すきっかけです。一定時間ごと、アイテム数、充填率のいずれかです。
d:InstantHaul.FarIntervalSec=近距離の半径より外にある拠点で、落ちたアイテムを回収する間隔の秒数です。
d:InstantHaul.FoodRouting=食料を保管先の優先設定に従って振り分けます。オフにすると食料も他のアイテムと同じ扱いになります。
d:InstantHaul.GuildChest=保管にギルドの保管庫も使います。何が入るかはゲーム自身の保管庫フィルターが決めます。
d:InstantHaul.IntervalSec=自分の近くに落ちたアイテムを回収する間隔の秒数で、次の回収から反映されます。
d:InstantHaul.Language=MOD自身の設定メニューの言語で、メニューの文字は次に開いたときに切り替わります。
d:InstantHaul.MaxMovesPerTick=1回の回収で動かすアイテムの上限で、超えた分は次の回収に持ち越されます。
d:InstantHaul.NearRadius=近いとみなす自分からの距離で、ゲーム内単位の15000がおよそ150メートルです。
d:InstantHaul.NetIntervalSec=即時通知が取りこぼした落下物を拾う全体回収の間隔の秒数で、短いほど負荷が増えます。
d:InstantHaul.PriorityDish=料理を優先的に入れる先です。餌箱、冷蔵庫、通常の保管庫、ギルドの保管庫のいずれかです。
d:InstantHaul.PriorityIngredient=生の食材や材料を優先的に入れる先です。餌箱、冷蔵庫、通常の保管庫、ギルドの保管庫のいずれかです。
d:InstantHaul.PriorityOther=その他すべてを優先的に入れる先です。ギルドの保管庫、同じアイテムかカテゴリを収めた保管庫、いちばん近い保管庫のいずれかです。
