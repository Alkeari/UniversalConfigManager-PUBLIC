d:AutoHealWorkers.ScanIntervalMs=拠点の作業員の負傷をミリ秒単位でどのくらいの頻度で確認するかです。 (?)
d:AutoHealWorkers.ToggleKey=プレイ中に拠点の作業員の自動治療のオンオフを切り替えるキーです。 (?)
d:AutoSanityCare.DiagnosticKey=MODが現在行っていることをUE4SSログに出力するキーです。 (?)
