d:AntiWasteDisassembleItems.COLLAPSED=部品が隠れていて場所も取らないことを表すためにインターフェースが使う番号で、ゲーム側で固定です。 (?)
d:AntiWasteDisassembleItems.DestroyRemainder=まとめて分解で分解しきれない端数のスタックを、スロットに残さず破棄します。素材は返還されません。
d:AntiWasteDisassembleItems.HIDDEN=部品は見えないが場所は取ることを表すためにインターフェースが使う番号です。 (?)
d:AntiWasteDisassembleItems.HIT_TEST_INVISIBLE=部品は表示されるがクリックを受け付けないことを表す番号で、ゲーム側で固定です。 (?)
d:AntiWasteDisassembleItems.Language=MODのボタンとメッセージの言語で、autoならゲーム自身の言語設定に従います。
d:AntiWasteDisassembleItems.MaterialRecoveryRate=分解時に戻ってくる素材の割合で、0にすると残りの耐久度に応じた量になります。
d:AntiWasteDisassembleItems.UseSubTypes=大まかなカテゴリ一覧ではなく、細かいサブタイプ一覧で分解の可否を判定します。
d:AntiWasteDisassembleItems.VERB_ITEM=後からクリックを見分けられるよう、単品の分解ボタンにMODが付ける短いタグです。 (?)
d:AntiWasteDisassembleItems.VERB_STACK=後からクリックを見分けられるよう、スタック全体の分解ボタンにMODが付ける短いタグです。 (?)
d:AntiWasteDisassembleItems.VISIBLE=部品が表示されていることを表すためにインターフェースが使う番号で、ゲーム側で固定であり設定項目ではありません。 (?)
d:AutoHealWorkers.DiagnosticKey=MODが現在行っていることをUE4SSログに出力するキーです。 (?)
