d:AutoSanityCare.ToggleKey=プレイ中に拠点の作業員の自動サニティケアのオンオフを切り替えるキーです。 (?)
d:BaseCampEggBonus.AlphaEnabled=拠点キャンプに配属したブロンチェリーが、そこで拾った卵をアルファ卵に変えられるようにします。
