d:AntiPhatPalResizing.ResizePals=リサイズの主スイッチで、オフのときはボスとラッキーのサイズ正規化だけが動きます。
d:AntiPhatPalResizing.SizeMode=見た目のモデルだけを縮めるメッシュ縮小か、当たり判定も縮めるアクター縮小かを選びます。
