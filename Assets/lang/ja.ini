d:TidyBaseInfo.gridOffsetX=拠点の作業者情報パネル内でのパルのグリッドの横位置で、単位は画面単位です。
d:TidyBaseInfo.gridOffsetY=パルのグリッドを下へ、負の値なら上へ、ピクセル単位で動かします。
d:TidyBaseInfo.gridWidth=パルのグリッドの幅で、単位は画面単位。初期のアイコンの大きさなら1行に4体分が並びます。
d:TidyBaseInfo.hoverPanelOffsetX=パルのグリッドの下にある詳細パネルの横方向のずらし量で、単位は画面単位です。
d:TidyBaseInfo.hoverPanelOffsetY=パルのグリッドの下端と、その下にカーソルを合わせたときに出る状態の行との間隔で、単位はピクセルです。
d:TidyBaseInfo.iconPadding=グリッド内のパルのマスどうしの間隔で、単位は画面単位。縦横の両方に効きます。
