d:TidyBaseInfo.cursorGraceTicks=パネルから外れたあと自由カーソルが何回の保守処理まで持ちこたえるかで、メニューへ移るあいだに切れないようにします。
d:TidyBaseInfo.emptyPortraitScale=空の作業スロットに描かれる仮の円の大きさの倍率です。
