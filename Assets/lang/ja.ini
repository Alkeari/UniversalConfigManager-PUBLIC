d:TidyBaseInfo.inspectHoldKey=さっと確認するあいだ押しておくキーで、離すまでグリッド上でマウスカーソルを自由にします。
d:TidyBaseInfo.inspectKey=パネル上で自由なマウスカーソルを入にし、もう一度押すと切にするキーで、空欄にすると無効になります。
d:TidyBaseInfo.keybindModifier=スクロールキーや確認キーと一緒に押す修飾キーです。NONEにすると修飾キーなしで使えます。
d:TidyBaseInfo.language=このMODが自分のラベルを表示する言語です。autoならゲームの言語設定に従います。
d:TidyBaseInfo.liveReloadSeconds=このMODが変更を反映するためにファイルを読み直す間隔（秒）です。プレイ中に変更が反映されます。0 にすると次回起動まで監視を止めます。
d:TidyBaseInfo.maintenanceMs=ゲーム自身の作業者の行をたたみ直し、カーソルが何の上にあるかを追う保守処理の間隔のミリ秒です。
d:TidyBaseInfo.maxGridHeight=パルのグリッドが伸びられる高さの上限をピクセルで指定し、これを超えるとホットバーを覆わずにグリッド内でスクロールします。
d:TidyBaseInfo.menuItemGap=右クリックの操作メニューの項目どうしの間隔で、単位はピクセルです。
d:TidyBaseInfo.menuItemPadding=右クリックの操作メニューで各ラベルの上下に取る余白で、単位はピクセルです。
d:TidyBaseInfo.menuItemPaddingX=右クリックの操作メニューで各ラベルの左右に取る余白で、単位はピクセルです。
d:TidyBaseInfo.menuItemPaddingY=右クリックの操作メニューで各ラベルの上下に取る余白で、単位はピクセルです。
d:TidyBaseInfo.menuOffsetX=パルのグリッドと、その横に開く右クリックの操作メニューとの間隔で、単位はピクセルです。
d:TidyBaseInfo.menuOffsetY=パルのグリッドの上端に対する右クリックの操作メニューの縦方向のずらし量で、単位は画面単位です。
d:TidyBaseInfo.menuWidth=右クリックの操作メニューの幅をピクセルで指定し、翻訳されたラベルが切れるときは大きくします。
d:TidyBaseInfo.openDetailsOnClick=パルをクリックしたときゲーム本来のパル詳細画面を開きます。オフなら代わりにそのパルの名前と状態をグリッドの下に留めます。
d:TidyBaseInfo.portraitOffsetX=各パルの立ち絵をマス内で右へ、負の値なら左へずらします。
d:TidyBaseInfo.portraitOffsetY=各パルの立ち絵をマス内で下へ、負の値なら上へずらします。
d:TidyBaseInfo.portraitScale=グリッドのマス内でのパルの立ち絵の大きさの倍率で、1.0がゲームの描く大きさです。
d:TidyBaseInfo.resummonTimeoutMs=Resummonがパルのパルボックス到着を待つ時間で、これを過ぎるとあきらめ、そのまま安全に残します。
