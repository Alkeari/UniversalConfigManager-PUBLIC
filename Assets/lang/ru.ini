d:Elevator.KeyboardInteractKey=Клавиша клавиатуры, вызывающая лифт и отправляющая его вверх или вниз; по умолчанию F.
d:Elevator.MaximumFloorCount=Наибольшее число этажей, на которое можно настроить лифт; по умолчанию 16, так как большие значения были нестабильны.
d:Elevator.MaximumFloorSearchMeters=На каком расстоянии в метрах лифт ищет этаж для остановки при вызове. (?)
d:Elevator.MaximumSpeedMetersPerSecond=Наибольшая скорость платформы лифта, в метрах в секунду. (?)
d:Elevator.MinimumFloorCount=Наименьшее число этажей, на которое можно настроить лифт. (?)
d:Elevator.MinimumTravelHeightMeters=Наименьшее расстояние в метрах, на которое перемещается лифт при отправке вверх или вниз. (?)
d:Elevator.PlatformHorizontalScale=Горизонтальный размер платформы лифта. (?)
d:Elevator.PlatformScale=Общий размер платформы лифта. (?)
d:Elevator.TravelSeconds=Сколько секунд занимает у лифта полное перемещение. (?)
d:ExpandedWorldOptions.global_max=Наибольшее значение, до которого можно поднять любой расширенный параметр мира, если ниже для него не задано отдельное переопределение.
d:ExpandedWorldOptions.mod.game_version=Версия Palworld, под которую написана эта сборка мода. (?)
d:ExpandedWorldOptions.mod.mod_version=Собственный номер версии мода. (?)
d:ExpandedWorldOptions.mod.name=Имя, которым мод называет себя в строках журнала. (?)
d:ExpandedWorldOptions.overrides.PalEggDefaultHatchingTime.max=Наибольшее значение, которое можно задать параметру мира «время высиживания яйца пала».
d:ExpandedWorldOptions.overrides.PalEggDefaultHatchingTime.min=Наименьшее значение, которое можно задать параметру мира «время высиживания яйца пала».
d:ExpandedWorldOptions.overrides.SupplyDropSpan.max=Наибольшее значение, которое можно задать параметру мира «интервал снабженческих сбросов».
d:ExpandedWorldOptions.overrides.SupplyDropSpan.min=Наименьшее значение, которое можно задать параметру мира «интервал снабженческих сбросов».
d:FToDrop.DropAll.Enabled=Включает сочетание клавиш, сбрасывающее всю стопку под курсором.
d:FToDrop.DropAll.Key=Клавиша, сбрасывающая всю стопку под курсором; по умолчанию F.
d:FToDrop.DropHalf.Enabled=Включает сочетание клавиш, сбрасывающее половину стопки под курсором.
d:FToDrop.DropHalf.Key=Сочетание клавиш, сбрасывающее половину стопки с округлением вниз; по умолчанию Shift+F.
d:FToDrop.DropOne.Enabled=Включает сочетание клавиш, сбрасывающее один предмет из стопки под курсором.
d:FToDrop.DropOne.Key=Сочетание клавиш, сбрасывающее один предмет из стопки под курсором; по умолчанию Ctrl+F.
d:GhostWildCaptureHp.debug=Записывает в журнал дополнительную диагностику шанса поимки для устранения неполадок. (?)
d:GhostWildCaptureHp.exempt_min_capture_item_level=Сила поимки, при которой сфера считается древней и пропускает штраф к здоровью для всех палов.
d:GhostWildCaptureHp.level_advantage_exempt=Превосходство в уровне над палом, освобождающее от штрафа к здоровью при поимке; -1 отключает это.
d:GhostWildCaptureHp.player_level_cache_sec=Секунды, в течение которых мод помнит ваш уровень, прежде чем прочитать его снова.
d:GhostWildCaptureHp.sphere_unlock_exempt=Пропускает штраф к здоровью, если сфера открывается на уровне цели или выше.
d:GhostWildCaptureHp.wild_only=Ограничивает штраф к здоровью при поимке дикими палами; при выключении он касается и боссов, и боссов башен.
d:GoToBedTeleportEdition.Debug=Подробная запись в UE4SS.log для устранения неполадок; при обычной игре лучше оставить выключенной.
d:HUDLocator.ConfigLoadedOnce=Отмечает, что настройки были прочитаны один раз за сессию; её изменение ничего не даёт. (?)
d:HUDLocator.currentRegionName=Регион, в котором трекер в последний раз вас определил; переписывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.globalSaveProgress.clearedBounties=Число закрытых заказов; пересчитывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.globalSaveProgress.collectedEffigies=Число собранных статуэток Лифмунка; пересчитывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.globalSaveProgress.defeatedAlphas=Число побеждённых альфа-палов; пересчитывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.globalSaveProgress.defeatedTowers=Число побеждённых боссов башен; пересчитывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.globalSaveProgress.overallPercent=Общий процент прохождения, который выводит трекер; пересчитывается при каждом сканировании. (?)
d:HUDLocator.globalSaveProgress.totalAlphas=Сколько альфа-палов учитывает трекер; это цель, по которой считается его процент. (?)
d:HUDLocator.globalSaveProgress.totalBounties=Сколько заказов учитывает трекер; это цель, по которой считается его процент. (?)
d:HUDLocator.globalSaveProgress.totalEffigies=Сколько статуэток Лифмунка учитывает трекер; это цель, по которой считается его процент. (?)
d:HUDLocator.globalSaveProgress.totalFastTravels=Сколько точек быстрого перемещения учитывает трекер; это цель, по которой считается его процент. (?)
d:HUDLocator.globalSaveProgress.totalTowers=Сколько боссов башен учитывает трекер; это цель, по которой считается его процент. (?)
d:HUDLocator.globalSaveProgress.unlockedFastTravels=Число найденных точек быстрого перемещения; пересчитывается при каждом сканировании, изменение не влияет. (?)
d:HUDLocator.isOpen=Отмечает, открыто ли сейчас собственное меню мода; её изменение ничего не даёт. (?)
d:InstantHaul.CatPriority.Accessory=Куда в первую очередь попадают аксессуары: по правилу «Всё остальное», в сундук гильдии, в сундук с тем же предметом или категорией, либо в ближайший.
