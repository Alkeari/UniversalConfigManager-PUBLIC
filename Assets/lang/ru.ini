d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.is_mobile=Считает Mimog движущейся целью, поэтому его луч перепроверяется, а не выставляется один раз. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.list_refresh_ms=Как часто в миллисекундах перестраивается список кандидатов Mimog. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.reveal_radius=Насколько близко должен быть Mimog, чтобы его луч стал виден. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.suppress_near_base=Скрывает луч Mimog, пока вы находитесь на базе, используя радиус подавления рядом с базой. (?)
d:ScanEffigiesBLP.effigy_list_refresh_ms=Как часто в миллисекундах перестраивается список отслеживаемых объектов; большие значения меньше нагружают производительность, но замечают объекты позже.
d:ScanEffigiesBLP.enable_beam_color=Окрашивает каждый луч цветом, заданным для его типа, вместо одного цвета для всех лучей. (?)
d:ScanEffigiesBLP.enable_beam_scale=Применяет собственный масштаб высоты луча для каждого типа вместо одинаковой высоты по умолчанию для всех. (?)
d:ScanEffigiesBLP.hotkeys.info_dump=Клавиша, выводящая текущую информацию отслеживания мода в журнал UE4SS. (?)
d:ScanEffigiesBLP.hotkeys.rescan=Клавиша, принудительно запускающая пересканирование объектов, если луч пропал.
d:ScanEffigiesBLP.hotkeys.toggle_all=Клавиша, включающая и выключающая все лучи, затрагивая только типы, включённые в конфиге.
d:ScanEffigiesBLP.max_spawns_per_frame=Сколько лучей может быть создано за один кадр; ограничивает нагрузку от резкого появления новых объектов. (?)
d:ScanEffigiesBLP.mobile_check_interval_ms=Как часто в миллисекундах повторно проверяются движущиеся цели, такие как Mimog. (?)
d:ScanEffigiesBLP.pc_check_interval=Как часто мод повторно ищет персонажа игрока. (?)
d:ScanEffigiesBLP.proximity_check_interval_ms=Как часто в миллисекундах мод проверяет, что находится рядом с вами; большие значения меньше нагружают процессор, но находят добычу чуть позже.
d:ScanEffigiesBLP.prune_check_interval_ms=Как часто в миллисекундах мод ищет лучи, которые нужно убрать. (?)
d:ScanEffigiesBLP.refresh_budget_per_tick=Сколько отслеживаемых объектов мод обновляет за один тик; автор рекомендует держать значение между 5 и 10.
d:ScanEffigiesBLP.spawn_drain_per_tick=Сколько лучей из очереди создания создаётся за один тик. (?)
d:ScanEffigiesBLP.startup_delay_ms=Сколько миллисекунд мод ждёт после запуска игры, прежде чем начать сканирование. (?)
d:SharedXP.technology_points_per_level=Очки технологий, выдаваемые за каждый уровень, который игрок пропускает, догоняя по общему опыту.
d:SharedXP.verbose_logging=Записывает в журнал подробные сообщения об общем опыте; полезно при проверке совместной игры.
d:SmartPalFeeding.Feeding.AbsoluteStartEatingThreshold=Фиксированный процент сытости, при котором пал на базе идёт есть, когда используется абсолютный порог. (?)
d:SmartPalFeeding.Feeding.EnableDebugLogging=Записывает в журнал каждое решение о кормлении; полезно только при сообщении о проблеме. (?)
d:SmartPalFeeding.Feeding.EnableMod=Включает более умное поведение при кормлении; при выключении остаются собственные пороги голода игры. (?)
d:SmartPalFeeding.Feeding.FallbackHungerDebuffThreshold=Процент голода, используемый как уровень ослабления, когда собственное значение игры не удаётся прочитать. (?)
d:SmartPalFeeding.Feeding.LogDecisionCooldownSeconds=Секунды между повторными строками журнала о кормлении, от 0.1 до 3600, чтобы журнал оставался читаемым. (?)
d:SmartPalFeeding.Feeding.StartEatingThresholdOffsetAboveHungerDebuff=Процентные пункты, добавляемые к собственному уровню ослабления от голода, чтобы решить, когда пал на базе идёт есть.
d:SmartPalFeeding.Feeding.StopEatingThreshold=Процент сытости, до которого пал на базе ест, прежде чем вернуться к работе, по умолчанию 95.
d:SmartPalFeeding.Feeding.UseAbsoluteStartEatingThreshold=Использует фиксированный процент голода для начала еды вместо смещения над уровнем ослабления от голода. (?)
d:SmartPalFeeding.author=Имя человека, сделавшего мод; хранится для справки и при изменении ни на что не влияет. (?)
d:SmartPalFeeding.name=Отображаемое имя, которое мод записывает для себя; хранится для справки и при изменении ни на что не влияет. (?)
d:SmartPalFeeding.package_name=Имя папки, в которую устанавливается мод; хранится для справки и при изменении ни на что не влияет. (?)
d:SmartPalFeeding.tested_game_build_id=Сборка игры, на которой автор последний раз проверял мод; хранится для справки и при изменении ни на что не влияет. (?)
d:SmartPalFeeding.tested_game_release=Выпуск игры, на котором автор последний раз проверял мод; хранится для справки и при изменении ни на что не влияет. (?)
d:SmartPalFeeding.version=Версия, которую мод записывает для себя; хранится для справки и при изменении ни на что не влияет. (?)
d:SmoothBossBattles.AutoConfirm_BossTower=Подтверждает за вас запрос на начало боя при входе в бой с боссом башни.
d:SmoothBossBattles.AutoConfirm_RaidBoss=Подтверждает за вас запрос на начало боя при запуске рейдового босса у алтаря призыва.
d:SmoothBossBattles.AutoConfirm_WorldTree=Подтверждает за вас запрос на начало боя при входе в бой с боссом Мирового древа.
d:SmoothBossBattles.SkipIntroCutscene_BossTower=Пропускает ролик, который проигрывается по пути в бой с боссом башни.
d:SmoothBossBattles.SkipVictoryWait_BossTower=Позволяет покинуть босса башни сразу после победы, не дожидаясь; только в одиночной игре.
d:SmoothBossBattles.SkipVictoryWait_WorldTree=Позволяет уйти сразу после победы над одним из трёх средних боссов Мирового древа; только в одиночной игре.
d:SmoothBossBattles.SkipVictoryWait_WorldTreeFinal=Позволяет уйти сразу после финального босса Мирового древа, что обрывает концовку игры.
d:SmoothBossBattles.enabled=Включает авторскую отладочную запись, которая поставляется выключенной и должна оставаться выключенной в обычной игре.
d:TidyBaseInfo.cursorGraceTicks=Сколько служебных проходов переживает свободный курсор после ухода с панели, чтобы переход к меню его не отключал.
d:TidyBaseInfo.emptyPortraitScale=Множитель размера кружка-заполнителя, отрисованного в пустом слоте работника.
d:TidyBaseInfo.fallback.menu_assign=Английская формулировка действия Назначить, используемая только когда языковые файлы мода не читаются.
d:TidyBaseInfo.fallback.menu_palbox=Английская формулировка действия Отправить в Палбокс, используемая только когда языковые файлы мода не читаются.
d:TidyBaseInfo.fallback.menu_resummon=Английская формулировка действия Призвать заново, используемая только когда языковые файлы мода не читаются.
d:TidyBaseInfo.gridOffsetX=Горизонтальное положение сетки палов внутри панели сведений о работниках базы, в экранных единицах.
d:TidyBaseInfo.gridOffsetY=Смещает сетку палов вниз, а при отрицательном значении вверх, в пикселях.
d:TidyBaseInfo.gridWidth=Ширина сетки палов в экранных единицах, достаточная для четырёх портретов в ряд при штатном размере значков.
d:TidyBaseInfo.hoverPanelOffsetX=Горизонтальный сдвиг панели подробностей, расположенной под сеткой палов, в экранных единицах.
d:TidyBaseInfo.hoverPanelOffsetY=Отступ между нижним краем сетки палов и строкой состояния под ней, появляющейся при наведении, в пикселях.
d:TidyBaseInfo.iconPadding=Промежуток между ячейками палов в сетке, в экранных единицах, по обеим осям.
d:TidyBaseInfo.iconSize=Длина стороны одной ячейки пала в сетке, в экранных единицах; четыре такие ячейки умещаются в штатную ширину сетки.
d:TidyBaseInfo.inspectHoldKey=Клавиша, которую держат для быстрого взгляда: она освобождает курсор мыши над сеткой, пока вы её не отпустите.
d:TidyBaseInfo.inspectKey=Клавиша, включающая свободный курсор мыши над панелью и выключающая его при повторном нажатии, либо пусто, чтобы отключить её.
d:TidyBaseInfo.keybindModifier=Клавиша-модификатор, удерживаемая вместе с клавишами прокрутки и осмотра; NONE позволяет пользоваться ими без модификатора.
d:TidyBaseInfo.language=Язык, на котором этот мод выводит собственные подписи; auto следует языковой настройке игры.
d:TidyBaseInfo.liveReloadSeconds=Как часто этот мод перечитывает свой файл на ваши изменения, в секундах, чтобы изменение сработало во время игры; 0 останавливает наблюдение до следующего запуска.
d:TidyBaseInfo.maintenanceMs=Миллисекунды между служебными проходами, которые снова сворачивают собственные строки работников игры и следят за тем, на что наведён курсор.
d:TidyBaseInfo.maxGridHeight=Наибольшая высота сетки палов в пикселях, после которой она прокручивается внутри себя, а не закрывает панель быстрого доступа.
d:TidyBaseInfo.menuItemGap=Промежуток между пунктами меню действий по правому клику, в пикселях.
d:TidyBaseInfo.menuItemPadding=Отступ сверху и снизу от каждой подписи в меню действий по правому клику, в пикселях.
d:TidyBaseInfo.menuItemPaddingX=Отступ слева и справа от каждой подписи в меню действий по правому клику, в пикселях.
d:TidyBaseInfo.menuItemPaddingY=Отступ сверху и снизу от каждой подписи в меню действий по правому клику, в пикселях.
d:TidyBaseInfo.menuOffsetX=Отступ между сеткой палов и меню действий по правому клику, открывающимся рядом, в пикселях.
d:TidyBaseInfo.menuOffsetY=Вертикальный сдвиг меню действий по правому клику относительно верхнего края сетки палов, в экранных единицах.
d:TidyBaseInfo.menuWidth=Ширина меню действий по правому клику в пикселях, которую стоит увеличить, если переведённая подпись обрезается.
d:TidyBaseInfo.openDetailsOnClick=Открывает полный экран сведений о пале по клику на нём; выключено закрепляет имя и состояние этого пала под сеткой.
d:TidyBaseInfo.portraitOffsetX=Сдвигает каждый портрет пала вправо, а при отрицательном значении влево, внутри его собственной ячейки.
d:TidyBaseInfo.portraitOffsetY=Сдвигает каждый портрет пала вниз, а при отрицательном значении вверх, внутри его собственной ячейки.
d:TidyBaseInfo.portraitScale=Множитель размера портрета пала внутри его ячейки сетки, где 1.0 это размер, которым рисует игра.
d:TidyBaseInfo.resummonTimeoutMs=Сколько Resummon ждёт, пока пал доберётся до Палбокса, прежде чем отказаться и безопасно оставить его на месте.
d:TidyBaseInfo.scrollDownKey=Клавиша, нажимаемая вместе с Alt, чтобы прокрутить сетку палов на шаг вниз.
d:TidyBaseInfo.scrollStepPx=Расстояние, на которое сетка палов сдвигается за один шаг прокрутки с клавиатуры, в экранных единицах.
d:TidyBaseInfo.scrollUpKey=Клавиша, прокручивающая сетку палов на шаг вверх, нажимаемая вместе с модификатором выше, либо пусто, чтобы отключить её.
d:TidyBaseInfo.showEmptySlots=Показывает пустой слот работника кружком-заполнителем; выключено оставляет в сетке только ваших палов.
d:TidyBaseInfo.suspendInputOverPanel=Приостанавливает смену оружия, прицеливание, стрельбу и команды палам, пока курсор находится над панелью.
d:TidyBaseInfo.tokens.deepGraphite=Шестнадцатеричный цвет подложки за меню действий по правому клику.
d:TidyBaseInfo.tokens.forgedGold=Шестнадцатеричный цвет рамки вокруг пункта меню действий, на который наведена мышь.
d:TidyBaseInfo.tokens.hairline=Шестнадцатеричный цвет тонкой линии вокруг подложки меню и вокруг каждого его пункта.
d:TidyBaseInfo.tokens.raised=Шестнадцатеричный цвет заливки одного пункта меню действий по правому клику.
d:TidyBaseInfo.tokens.raisedHover=Шестнадцатеричный цвет заливки пункта меню действий, на который наведена мышь.
d:UMJItemFilter.CaptureGameInput=Блокирует собственные клавиатурные сочетания игры, пока открыто окно фильтра, чтобы можно было в нём печатать.
d:UMJItemFilter.ChestFilter=Возвращает на землю у ног открывшего сундук игрока неотмеченные награды из сундука с сокровищами.
d:UMJItemFilter.EnableMouse=Позволяет управлять окном фильтра мышью. (?)
d:UMJItemFilter.EnforceFilter=Оставляет неотмеченные предметы на земле при автоматическом подборе, чтобы их можно было забрать вручную.
d:UMJItemFilter.LeftMargin=Задаёт отступ, сохраняемый у левого края окна фильтра. (?)
d:UMJItemFilter.OpenKey=Клавиша, открывающая и закрывающая окно фильтра предметов; по умолчанию обратный слеш.
d:UMJItemFilter.PanelScale=Масштабирует размер окна фильтра на экране. (?)
d:UMJItemFilter.RecentItemLimit=Сколько недавних уникальных подборов перечисляет окно фильтра для изменения их состояния; по умолчанию десять.
d:UMJItemFilter.RememberSelection=При повторном открытии окна фильтра возвращается к последнему выбранному предмету. (?)
d:UltraGraphics.State.ChangelogShownFor=Версия, для которой мод последний раз показывал список изменений; записывается модом, а не вами. (?)
d:UltraGraphics.State.PerformanceMode=Включён ли сейчас режим производительности; записывается модом, а не вами. (?)
d:UnsheathedKatanaMercy.ENABLE_LOGGING=Записывает собственные строки мода в журнал UE4SS для диагностики. (?)
d:UnsheathedKatanaMercy.RESET_LIMIT=Сколько раз можно сбросить цепочку заданий Unsheathed Katana; 0 отключает сброс заданий.
d:vuxRemoveFlyingStamina.vuxCheckAcknowledge=Внутренний флаг, который мод переключает после применения изменений полёта в этой сессии. (?)
d:vuxRemoveFlyingStamina.vuxFlyHorizon_Dash_SP=Выносливость, расходуемая в секунду при рывке вперёд на летающем скакуне, где 0 значит без расхода. (?)
d:vuxRemoveFlyingStamina.vuxFlyHover_SP=Выносливость, расходуемая в секунду при зависании на месте на летающем скакуне, где 0 значит без расхода. (?)
d:vuxRemoveFlyingStamina.vuxFlyMaxHeight=Наибольшая высота, на которую может подняться летающий скакун, в мировых единицах. (?)
d:vuxRemoveFlyingStamina.vuxFlyVertical_SP=Выносливость, расходуемая в секунду при полёте строго вверх или вниз, где 0 значит без расхода. (?)
d:vuxRemoveFlyingStamina.vuxGameVersion=Версия игры, под которую собран мод; выводится при запуске и на игру не влияет. (?)
d:vuxRemoveFlyingStamina.vuxModVersion=Обозначение версии мода; выводится при запуске, его изменение ничего не даёт. (?)
