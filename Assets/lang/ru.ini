d:AntiWasteDisassembleItems.COLLAPSED=Число, которым интерфейс обозначает скрытый элемент, не занимающий места; задано игрой. (?)
d:AntiWasteDisassembleItems.DestroyRemainder=Уничтожает остаток неполной партии, который Разобрать стопку не может разложить, вместо того чтобы оставить его в слоте, без возврата материалов.
d:AntiWasteDisassembleItems.HIDDEN=Число, которым интерфейс обозначает невидимый элемент, всё ещё занимающий своё место. (?)
d:AntiWasteDisassembleItems.HIT_TEST_INVISIBLE=Число, которым интерфейс обозначает видимый элемент, не реагирующий на нажатия; задано игрой. (?)
d:AntiWasteDisassembleItems.Language=Язык кнопок и сообщений мода; значение auto следует языку самой игры.
d:AntiWasteDisassembleItems.MaterialRecoveryRate=Доля материалов, возвращаемых при разборе; 0 масштабирует возврат по остатку прочности.
d:AntiWasteDisassembleItems.UseSubTypes=Ограничивает разбор подробным списком подтипов вместо широкого списка категорий.
d:AntiWasteDisassembleItems.VERB_ITEM=Короткая метка, которую мод ставит на кнопку разбора одного предмета, чтобы позже распознать нажатие. (?)
d:AntiWasteDisassembleItems.VERB_STACK=Короткая метка, которую мод ставит на кнопку разбора всей стопки, чтобы позже распознать нажатие. (?)
d:AntiWasteDisassembleItems.VISIBLE=Число, которым интерфейс обозначает видимый элемент; задано игрой и не является настройкой. (?)
d:AutoHealWorkers.DiagnosticKey=Клавиша, записывающая текущие действия мода в журнал UE4SS. (?)
d:AutoHealWorkers.Enabled=Включает автоматическое лечение работающих на базе палов сразу при запуске игры. (?)
d:AutoHealWorkers.MaxPalsPerScan=Сколько палов мод проверяет за один проход; не даёт большой базе подтормаживать. (?)
d:AutoHealWorkers.ScanIntervalMs=Как часто мод проверяет работников базы на травмы, в миллисекундах. (?)
d:AutoHealWorkers.ToggleKey=Клавиша, включающая и выключающая автоматическое лечение работников базы прямо во время игры. (?)
d:AutoSanityCare.DiagnosticKey=Клавиша, записывающая текущие действия мода в журнал UE4SS. (?)
d:AutoSanityCare.Enabled=Включает автоматическую заботу о рассудке работников базы сразу при запуске игры. (?)
d:AutoSanityCare.MaxPalsPerScan=Сколько палов мод проверяет за один проход; не даёт большой базе подтормаживать. (?)
d:AutoSanityCare.SanityFloor=Уровень рассудка, ниже которого должен упасть работник, чтобы мод вмешался. (?)
d:AutoSanityCare.ScanIntervalMs=Как часто мод проверяет работников базы на низкий рассудок, в миллисекундах. (?)
d:AutoSanityCare.ToggleKey=Клавиша, включающая и выключающая автоматическую заботу о рассудке прямо во время игры. (?)
d:BaseCampEggBonus.AlphaEnabled=Позволяет Broncherry, назначенному на базовый лагерь, превращать подобранное там яйцо в яйцо альфа-пала.
d:BaseCampEggBonus.Enabled=Включает или выключает весь мод целиком. (?)
d:BaseCampEggBonus.ExtraEggEnabled=Позволяет Grintale, назначенному на базовый лагерь, давать дополнительное яйцо при подборе яйца пала там.
d:BaseCampEggBonus.Language=Задаёт язык, который мод использует для своих сообщений.
d:BaseCampEggBonus.ToggleAlphaKey=Хоткей, включающий и выключающий превращение в альфа-яйцо, по умолчанию Ctrl+L.
d:BaseCampEggBonus.ToggleBothKey=Хоткей, включающий и выключающий одновременно оба эффекта: дополнительное яйцо и превращение в альфа-яйцо. (?)
d:BaseCampEggBonus.ToggleExtraKey=Хоткей, включающий и выключающий эффект дополнительного яйца, по умолчанию Ctrl+K.
d:BaseCampEggBonus.Verbose=Записывает дополнительные строки мода в журнал UE4SS для диагностики. (?)
d:BasePalSpawnImprovements.Batching.BatchDelayMs=Миллисекунды ожидания между партиями палов базы при её загрузке.
