d:PerfProbe.babies=Уменьшает выпускаемых палов примерно до трети обычного размера, с ограничением, чтобы самые маленькие и самые крупные виды оставались пригодными для использования. (?)
d:PerfProbe.badgePos.enabled=Показывает на HUD зелёный или красный значок-индикатор пощады; вкладка PerfProbe также может его скрыть.
d:PerfProbe.bloom=Свечение (bloom): 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.browserlayout.txt:anchor=Угол экрана, от которого отсчитывается позиция указателя Palbox; tl - верхний левый, tr - верхний правый. (?)
d:PerfProbe.browserlayout.txt:collapsed=Сохранённое состояние свёрнутости панели указателя Palbox: 0 - полное окно, 1 - только заголовок. (?)
d:PerfProbe.browserlayout.txt:h=Сохранённая высота панели указателя Palbox, ограниченная допустимым для этой панели диапазоном. (?)
d:PerfProbe.browserlayout.txt:w=Сохранённая ширина панели указателя Palbox, ограниченная допустимым для этой панели диапазоном. (?)
d:PerfProbe.browserlayout.txt:x=Сохранённое положение левого края панели указателя Palbox, в экранных единицах от верхнего левого угла. (?)
d:PerfProbe.browserlayout.txt:y=Сохранённое положение верхнего края панели указателя Palbox, в экранных единицах от верхнего левого угла. (?)
d:PerfProbe.capsule=Капсульные тени: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.cascades=Наибольшее число каскадов теней, применяемое PerfProbe, от 0 до 4; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.collapsed=Сохранённое состояние свёрнутости плавающей панели: 0 - полное окно, 1 - только заголовок, 2 - компактный вид счётчика урона. (?)
d:PerfProbe.damagemeter=Показывает плавающий счётчик урона, отслеживающий урон от выпущенных палов и от вас самих.
d:PerfProbe.damagemeterlayout.txt:anchor=Угол экрана, от которого отсчитывается позиция счётчика урона; tl - верхний левый, tr - верхний правый. (?)
d:PerfProbe.damagemeterlayout.txt:collapsed=Сохранённое состояние свёрнутости счётчика урона: 0 - полное окно, 2 - его компактный вид. (?)
d:PerfProbe.damagemeterlayout.txt:h=Сохранённая высота счётчика урона, ограниченная допустимым для этой панели диапазоном. (?)
d:PerfProbe.damagemeterlayout.txt:w=Сохранённая ширина счётчика урона, ограниченная допустимым для этой панели диапазоном. (?)
d:PerfProbe.damagemeterlayout.txt:x=Сохранённое положение левого края счётчика урона, в экранных единицах от верхнего левого угла. (?)
d:PerfProbe.damagemeterlayout.txt:y=Сохранённое положение верхнего края счётчика урона, в экранных единицах от верхнего левого угла. (?)
d:PerfProbe.dfao=Фоновое затенение по полю расстояний (DFAO): 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.dlssq=Режим качества DLSS, запрашиваемый PerfProbe: 1 - Auto, 2 - DLAA, 3 - Ultra Quality, 4 - Quality, 5 - Balanced, 6 - Performance, 7 - Ultra Performance. (?)
d:PerfProbe.dof=Глубина резкости: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.flare=Блики объектива: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.fog=Высотный туман: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.foliaged=Плотность растительности в процентах, применяемая PerfProbe, от 0 до 100; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.fringe=Хроматическая аберрация: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.gfxopen=Запоминает, была ли свёртываемая группа настроек графики на вкладке PerfProbe оставлена развёрнутой. (?)
d:PerfProbe.grassd=Плотность травы в процентах, применяемая PerfProbe, от 0 до 100; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.h=Сохранённая высота плавающей панели, которой принадлежит этот файл, ограниченная допустимым для неё диапазоном. (?)
d:PerfProbe.hudDumpRequested=Флаг разработчика, запрашивающий у PerfProbe один дамп дерева виджетов HUD на следующем кадре. (?)
d:PerfProbe.key_cmd.txt:mode=Состояние наблюдателя за хоткеем комплекта: слежение, захват новой клавиши или бездействие. (?)
d:PerfProbe.loadouts.txt:schema=Версия формата файла комплектов, чтобы более новый PerfProbe мог перенести его вместо очистки. (?)
d:PerfProbe.lumengi=Глобальное освещение Lumen: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.lumenrefl=Отражения Lumen: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.mblur=Размытие в движении: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.mode=В settings.txt - метод масштабирования, применяемый PerfProbe; в key_cmd.txt - состояние наблюдателя за хоткеем комплекта: слежение, захват или бездействие. (?)
d:PerfProbe.occl=Захват затенения неба: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.overlay=Путь к ассету, который PerfProbe запоминает для окна назначения клавиш игры, чтобы не искать его заново при следующем запуске. (?)
d:PerfProbe.palboxbrowser=Показывает плавающий указатель Palbox рядом со стандартным Palbox при каждом его открытии.
d:PerfProbe.param=Путь к ассету, который PerfProbe запоминает для объекта параметров настройки клавиш, используемого окном назначения клавиш. (?)
d:PerfProbe.primary=Клавиша или кнопка, переключающая комплект аксессуаров, записанная в виде собственного id клавиши PerfProbe. (?)
d:PerfProbe.recon.BABY_HALF=Множитель размера, к которому стремится режим «малыши» при уменьшении палов, до применения нижнего и верхнего пределов. (?)
d:PerfProbe.recon.BABY_MAX_CM=Наибольшая высота в сантиметрах, до которой разрешено уменьшить пала в режиме «малыши»; для гигантских видов это ограничение сильнее. (?)
d:PerfProbe.recon.BABY_MIN_CM=Наименьшая высота в сантиметрах, до которой разрешено уменьшить пала в режиме «малыши». (?)
d:PerfProbe.recon.MESH_PROBE_CAP=Сколько мешей обходит отладочный зонд мешей, прежде чем остановиться, чтобы сканирование не подвешивало игру. (?)
d:PerfProbe.recon.SMC_MAT_CAP=Сколько материалов читает отладочное сканирование статических мешей, прежде чем остановиться, чтобы сканирование не подвешивало игру. (?)
d:PerfProbe.recon.SMC_SCAN_CAP=Сколько компонентов статических мешей обходит отладочное сканирование, прежде чем остановиться, чтобы сканирование не подвешивало игру. (?)
d:PerfProbe.recon.dlssDumpRequested=Флаг разработчика, запрашивающий у PerfProbe однократный опрос библиотеки DLSS и вывод поддерживаемых оборудованием возможностей. (?)
d:PerfProbe.recon.statReadRequested=Флаг разработчика, запрашивающий у PerfProbe однократное чтение результатов stat unit игры и вывод их в журнал. (?)
d:PerfProbe.rendercontrols=Главный переключатель графического пути PerfProbe; при 0 все настройки рендера остаются у игры, но остальные возможности мода продолжают работать.
d:PerfProbe.schema=Версия формата этого файла, записываемая PerfProbe, чтобы более новая версия могла перенести старый файл вместо очистки. (?)
d:PerfProbe.settings.txt:mode=Метод масштабирования, применяемый PerfProbe, выбираемый из поддерживаемых вашим оборудованием. (?)
d:PerfProbe.settings.txt:schema=Версия формата файла настроек, чтобы более новый PerfProbe мог перенести его вместо очистки. (?)
d:PerfProbe.shadowdist=Дальность теней в процентах, применяемая PerfProbe, от 10 до 200; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.shafts=Световые лучи (light shafts): 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.sharp=Сила резкости FSR2, применяемая PerfProbe; используется только при режиме масштабирования FSR2. (?)
d:PerfProbe.skellod=Смещение уровня детализации скелетных мешей, применяемое PerfProbe, от 0 до 4; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.sky=Меш неба - солнце, луна и карта звёзд: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.sp=Процент масштаба рендера, применяемый PerfProbe, от 33 до 100; игнорируется, пока разрешение задаёт DLSS.
d:PerfProbe.spset=Отмечает, что вы сами выбрали способ масштабирования, поэтому PerfProbe перестаёт следовать за собственным масштабом рендера движка. (?)
d:PerfProbe.ssgi=Экранное глобальное освещение (SSGI): 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.ssr=Экранные отражения (SSR): 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.used=Отмечает, что вы изменили хотя бы одну графическую настройку PerfProbe; именно это позволяет моду что-либо применять при запуске. (?)
d:PerfProbe.viewdist=Дальность прорисовки в процентах, применяемая PerfProbe, от 10 до 200; -1 оставляет собственное значение игры без изменений. (?)
d:PerfProbe.volfog=Объёмный туман: 1 включает, 0 выключает, -1 оставляет собственную настройку игры без изменений. (?)
d:PerfProbe.w=Сохранённая ширина плавающей панели, которой принадлежит этот файл, ограниченная допустимым для неё диапазоном. (?)
d:PerfProbe.x=Сохранённое положение левого края плавающей панели, которой принадлежит этот файл, в экранных единицах от верхнего левого угла. (?)
d:PerfProbe.y=Сохранённое положение верхнего края плавающей панели, которой принадлежит этот файл, в экранных единицах от верхнего левого угла. (?)
d:PerfectPlacement.bindings.copy_piece.key=Клавиша пипетки, которая копирует элемент постройки, на который вы наводитесь, в активный предпросмотр.
d:PerfectPlacement.bindings.freeze_at_piece.key=Клавиша, которая замораживает выбранный элемент на точке привязки, на которую вы наводитесь.
d:PerfectPlacement.bindings.freeze_to_piece.key=Клавиша, которая копирует положение и поворот выбранного элемента в замещающий предпросмотр и замораживает его там.
d:PerfectPlacement.bindings.move_back=Клавиша, сдвигающая замороженный предпросмотр назад на текущий шаг перемещения.
d:PerfectPlacement.bindings.move_down=Клавиша, опускающая замороженный предпросмотр на текущий шаг перемещения.
d:PerfectPlacement.bindings.move_forward=Клавиша, сдвигающая замороженный предпросмотр вперёд на текущий шаг перемещения.
d:PerfectPlacement.bindings.move_left=Клавиша, сдвигающая замороженный предпросмотр влево на текущий шаг перемещения.
d:PerfectPlacement.bindings.move_right=Клавиша, сдвигающая замороженный предпросмотр вправо на текущий шаг перемещения.
d:PerfectPlacement.bindings.move_up=Клавиша, поднимающая замороженный предпросмотр на текущий шаг перемещения.
d:PerfectPlacement.bindings.reset=Клавиша, возвращающая предпросмотр в положение и поворот, которые он имел в момент заморозки.
d:PerfectPlacement.bindings.rotate_left=Клавиша, поворачивающая замороженный предпросмотр влево на текущий шаг поворота.
d:PerfectPlacement.bindings.rotate_right=Клавиша, поворачивающая замороженный предпросмотр вправо на текущий шаг поворота.
d:PerfectPlacement.bindings.rotation_step_down=Клавиша, переходящая к следующему меньшему шагу поворота.
d:PerfectPlacement.bindings.rotation_step_up=Клавиша, переходящая к следующему большему шагу поворота.
d:PerfectPlacement.bindings.step_down=Клавиша, уменьшающая шаг перемещения, чтобы каждое нажатие двигало предпросмотр меньше.
d:PerfectPlacement.bindings.step_up=Клавиша, увеличивающая шаг перемещения, чтобы каждое нажатие двигало предпросмотр больше.
d:PerfectPlacement.bindings.toggle_freeze=Клавиша, замораживающая предпросмотр постройки на месте или освобождающая его снова.
d:PerfectPlacement.diagnostics.ui_lifecycle_log_interval_ms=Миллисекунды между строками счётчиков интерфейса строительства, когда эти диагностические счётчики включены. (?)
d:PerfectPlacement.diagnostics.verbose=Записывает в журнал UE4SS дополнительные строки для устранения неполадок, которых может оказаться очень много.
d:PerfectPlacement.gamepad.enabled=Включает поддержку контроллера через сопутствующий мост ввода, для чего нужен перезапуск игры.
d:PerfectPlacement.gamepad.invert_forward_back=Меняет местами кнопки контроллера, двигающие замороженный предпросмотр вперёд и назад.
d:PerfectPlacement.gamepad.invert_height=Меняет местами кнопки контроллера, двигающие замороженный предпросмотр вверх и вниз.
d:PerfectPlacement.gamepad.swap_rotate_buttons=Меняет местами кнопки контроллера, поворачивающие замороженный предпросмотр влево и вправо.
d:PerfectPlacement.hold_locked_transform=Постоянно заново применяет замороженное положение, чтобы предпросмотр не возвращался к прицелу, ценой нагрузки на кадр.
d:PerfectPlacement.movement.coarse=Устаревший крупный шаг перемещения в сто сантиметров, который мод больше не читает. (?)
d:PerfectPlacement.movement.fine=Устаревший мелкий шаг перемещения в один сантиметр, который мод больше нигде не читает. (?)
d:PerfectPlacement.movement.maximum=Наибольший шаг перемещения в сантиметрах, которого может достичь клавиша увеличения шага, от 0.1 до 1000.
d:PerfectPlacement.movement.maximum_above_initial_cm=Сантиметры, на которые замороженный предпросмотр можно поднять выше высоты заморозки, по умолчанию 650.
d:PerfectPlacement.movement.maximum_below_initial_cm=Сантиметры, на которые замороженный предпросмотр можно опустить ниже высоты заморозки, по умолчанию 25.
d:PerfectPlacement.movement.minimum=Наименьший шаг перемещения в сантиметрах, которого может достичь клавиша уменьшения шага, от 0.1 до 1000.
d:PerfectPlacement.movement.normal=Шаг перемещения в сантиметрах, с которого начинает замороженный предпросмотр, от 0.1 до 1000.
d:PerfectPlacement.movement.step_scale=Множитель, применяемый к шагу перемещения при каждом нажатии увеличения или уменьшения шага: 2, 5 или 10.
d:PerfectPlacement.rotation.coarse=Крупный шаг поворота в градусах на лестнице шагов поворота, по умолчанию 15 градусов.
d:PerfectPlacement.rotation.fine=Мелкий шаг поворота в градусах на лестнице шагов поворота, по умолчанию 1 градус.
d:PerfectPlacement.rotation.normal=Средний шаг поворота в градусах на лестнице шагов поворота, по умолчанию 5 градусов.
d:PerfectPlacement.rotation.precision=Наименьший шаг поворота в градусах на лестнице шагов поворота, по умолчанию десятая доля градуса. (?)
d:PerfectPlacement.rotation.snap=Наибольший шаг поворота в градусах на лестнице шагов поворота, по умолчанию 45 градусов.
d:PerfectPlacement.transform_refresh_ms=Миллисекунды между повторными применениями замороженного положения, пока это удержание включено. (?)
d:PerfectPlacement.ui.gamepad_enabled_property=Внутреннее имя поля подсказки, хранящего, включён ли ввод с контроллера. (?)
d:PerfectPlacement.ui.hide_function=Внутреннее имя сопутствующего вызова, скрывающего подсказку по установке; его изменение ничего не даёт. (?)
d:PerfectPlacement.ui.hide_toast_function=Внутреннее имя сопутствующего вызова, убирающего сообщение о заморозке и освобождении. (?)
d:PerfectPlacement.ui.host_class_name=Имя сопутствующего виджета, к которому крепится подсказка по установке; его изменение ничего не даёт. (?)
d:PerfectPlacement.ui.move_step_property=Внутреннее имя поля подсказки, хранящего текущий шаг перемещения в сантиметрах. (?)
d:PerfectPlacement.ui.refresh_function=Внутреннее имя сопутствующего вызова, перерисовывающего подсказку по установке после изменения. (?)
d:PerfectPlacement.ui.show_frozen_guide_function=Внутреннее имя сопутствующего вызова, показывающего подсказку, пока предпросмотр заморожен. (?)
d:PerfectPlacement.ui.show_frozen_toast_function=Внутреннее имя сопутствующего вызова, показывающего сообщение при заморозке предпросмотра. (?)
d:PerfectPlacement.ui.show_unfrozen_guide_function=Внутреннее имя сопутствующего вызова, показывающего подсказку, пока предпросмотр не заморожен. (?)
d:PerfectPlacement.ui.show_unfrozen_toast_function=Внутреннее имя сопутствующего вызова, показывающего сообщение при освобождении предпросмотра. (?)
d:PerfectPlacement.ui.use_palworld_keycaps=Рисует органы управления установкой значками клавиш в стиле Palworld в подсказке по строительству. (?)
d:PingMod.bypass_guild_marker_limit=Ставит метку даже при достигнутом пределе меток гильдии, ненадолго убирая другую метку.
d:Plasma Multicutter Damage.damage_per_hit=Сколько урона наносит противникам каждое попадание Plasma Multicutter. (?)
d:Plasma Multicutter Damage.debug_logging=Записывает дополнительные диагностические строки Plasma Multicutter Damage в журнал UE4SS. (?)
d:Plasma Multicutter Damage.target_cooldown_seconds=Сколько секунд должна подождать одна и та же цель, прежде чем Plasma Multicutter снова сможет её повредить. (?)
d:RecoverPalSpheres.debug=Записывает в журнал подробную работу по возврату сфер для отчёта об ошибке.
d:RecoverPalSpheres.enabled=Копия переключателя отладочной записи, которую мод держит во время работы; берётся из основных настроек. (?)
d:RecoverPalSpheres.max_pickup_lifetime=Секунды, которые возвращённый предмет ждёт в мире; -1 оставляет его навсегда, а 0 отключает такие предметы.
d:RecoverPalSpheres.notify_inventory_return=Показывает обычное сообщение о получении предмета для сфер, возвращённых прямо в ваш инвентарь.
d:RecoverPalSpheres.return_sphere_min_distance_x=Наибольшее горизонтальное расстояние в метрах, на котором промахнувшаяся сфера остаётся лежать как подбираемый предмет.
d:RecoverPalSpheres.return_sphere_min_distance_y=Наибольшее вертикальное расстояние в метрах, на котором промахнувшаяся сфера остаётся лежать как подбираемый предмет.
d:RecoverPalSpheres.sphere_launcher_pickups=Позволяет промахам из пускателя становиться подбираемыми предметами в мире для одиночной игры и хостов совместной игры.
d:RecoverPalSpheres.sphere_recovery_percentage=Процентная вероятность того, что промахнувшаяся Пал-сфера будет возвращена, а не потеряна, от 0 до 100.
d:ScanEffigiesBLP.base_suppress_radius=Радиус вашего базового лагеря, в пределах которого скрываются лучи, подавляемые рядом с базой, например у Mimog.
d:ScanEffigiesBLP.beam_color_param_name=Имя параметра цвета в эффекте луча, который мод задаёт для его окраски. (?)
d:ScanEffigiesBLP.beam_effect_path=Путь к ассету эффекта частиц, который мод создаёт для отрисовки луча. (?)
d:ScanEffigiesBLP.beam_height_max=Наибольшая высота, которую может принять столб луча после применения масштаба высоты. (?)
d:ScanEffigiesBLP.beam_height_min=Наименьшая высота, которую может принять столб луча после применения масштаба высоты. (?)
d:ScanEffigiesBLP.debug_profiling=Записывает время сканирования и обновления в журнал UE4SS для диагностики. (?)
d:ScanEffigiesBLP.default_beam_height=Высота столба луча для любого типа, не задающего собственную высоту. (?)
d:ScanEffigiesBLP.default_detection_radius=На каком расстоянии от вас появляются лучи для типа, не задающего собственный радиус; по умолчанию около 300 метров.
d:ScanEffigiesBLP.effigy_configs.BP_LevelObject_Note_C.beam_height_scale=Умножает высоту луча по умолчанию для столба над «заметки». (?)
