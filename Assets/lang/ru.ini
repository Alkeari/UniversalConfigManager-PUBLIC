d:AntiPhatPalResizing.PersistentScale=Заново применяет размеры, когда поглаживание, кормление или эмоции их сбрасывают, что важно в основном в режиме актора.
d:AntiPhatPalResizing.ReloadHotkey=Включает клавишу, которая перезагружает настройки прямо в игре и заново проверяет размер каждого пала.
d:AntiPhatPalResizing.ResizeBossAndShiny=Позволяет менять размер боссов и счастливых палов по масштабам ниже вместо того, чтобы оставлять им собственный размер.
d:AntiPhatPalResizing.ResizeHumanPals=Уменьшает пойманных людей-NPC, например членов Синдиката и торговцев, вместе с вашими палами.
d:AntiPhatPalResizing.ResizePals=Главный переключатель изменения размера; когда он выключен, работает только выравнивание размера боссов и счастливых палов.
d:AntiPhatPalResizing.SizeMode=Выбирает масштабирование меша, которое уменьшает только видимую модель, или масштабирование актора, которое уменьшает и столкновения.
