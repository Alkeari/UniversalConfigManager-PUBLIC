d:BaseRenamingUtility.BASE_ATTACH_PROBE=Диагностика для разработчика, отслеживающая привязку баз к значкам карты; нужна для поиска ошибок, а не для игры. (?)
d:BaseRenamingUtility.BASE_COLOR_AUDIT=Диагностика для разработчика, проверяющая сохранённые цвета баз; нужна для поиска ошибок, а не для обычной игры. (?)
d:BaseRenamingUtility.BASE_LOAD_PROBE=Диагностика для разработчика, отслеживающая загрузку баз на карту; нужна для поиска ошибок, а не для игры. (?)
d:BaseRenamingUtility.COLOR_PALETTE_PROBE=Диагностика для разработчика, выгружающая цветовую палитру карты; нужна для поиска ошибок, а не для обычной игры. (?)
d:BaseRenamingUtility.GUILD_MARKER_PROBE=Диагностика для разработчика, отслеживающая метки гильдии; нужна для поиска ошибок, а не для обычной игры. (?)
d:BaseRenamingUtility.MAP_PANEL=Показывает на карте панель сохранённых мест со списком ваших названных баз и меток.
d:BaseRenamingUtility.MAP_PANEL_LIVE_SYNC=Обновляет панель сохранённых мест сразу при переименовании или добавлении места, а не при следующем открытии карты. (?)
d:BaseRenamingUtility.MAP_PARENT_PROBE=Диагностика для разработчика, отслеживающая устройство экрана карты; нужна для поиска ошибок, а не для обычной игры. (?)
d:BaseRenamingUtility.MARKER_LAYOUT_DIAGNOSTICS=Диагностика для разработчика, записывающая размещение подписей меток; нужна для поиска ошибок, а не для игры. (?)
d:BaseRenamingUtility.MARKER_PROBE=Диагностика для разработчика, отслеживающая метки карты; нужна для поиска ошибок, а не для обычной игры. (?)
d:BaseRenamingUtility.MARKER_VISUALS=Наносит ваши сохранённые названия на метки карты вместо того, чтобы оставлять их без подписей. (?)
d:BaseRenamingUtility.MODULES.MarkerImportExport=Добавляет кнопки экспорта и импорта для переноса названий, цветов и меток между сохранениями.
d:BaseRenamingUtility.MOD_NAME=Имя, которое мод ставит в своих строках журнала; на его работу это не влияет. (?)
d:BaseRenamingUtility.NAME_WIDGET_PROPERTY=Внутреннее имя подписи на карте, в которую пишет мод; неверное значение не даст названиям появиться. (?)
d:BaseRenamingUtility.SET_CAMP_INFO=Внутренняя игровая функция, которую мод слушает при отрисовке базы на карте; лучше оставить как есть. (?)
d:BaseRenamingUtility.VERSION=Версия, которую мод ставит в своих строках журнала; на его работу это не влияет. (?)
d:BaseRenamingUtility.g_bound_from_live_map=Внутренняя отметка о привязке клавиши переименования; её изменение ничего не даёт. (?)
d:BaseRenamingUtility.h_bound_from_live_map=Внутренняя отметка о привязке клавиши цвета; её изменение ничего не даёт. (?)
d:BaseRenamingUtility.hover_context_ready=Внутренняя отметка о том, готово ли наведённое место к действию; её изменение ничего не даёт. (?)
d:BaseRenamingUtility.key_registered=Внутренняя отметка о том, привязаны ли клавиши переименования и цвета; её изменение ничего не даёт. (?)
d:BaseRenamingUtility.marker_hover_token=Внутренний счётчик метки, на которую вы наводитесь прямо сейчас; его изменение ничего не даёт. (?)
d:BaseRenamingUtility.registered=Внутренняя отметка о том, настроены ли перехваты карты; её изменение ничего не даёт. (?)
d:BaseRenamingUtility.sequence=Внутренний счётчик, который мод увеличивает по ходу работы; его изменение ничего не даёт. (?)
d:BaseRenamingUtility.world_generation=Внутренний счётчик перезагрузок мира; его изменение ничего не даёт. (?)
d:BaseTrimmer.BATCH_SIZE=Количество построек, обрабатываемых за проход; меньшее значение растягивает работу и сглаживает просадки.
d:BaseTrimmer.BUILD_COMPLETE_FN=Внутреннее игровое действие, которое слушает мод, чтобы растения убирались сразу после завершения постройки. (?)
d:BaseTrimmer.BUILD_PATH_MATCH=Внутренний фрагмент имени, по которому мод отличает построенное игроком сооружение от остального мира. (?)
d:BaseTrimmer.DEBUG=Записывает ключевые события расчистки и ошибки в журнал для отчёта об ошибке.
d:BaseTrimmer.DEBUG_SCAN_LANDSCAPE_RADIUS=Радиус в игровых единицах, который охватывает отладочное сканирование по F7 при перечислении ближайших мешей ландшафта.
d:BaseTrimmer.DISMANTLE_MODEL_FN=Внутреннее игровое действие, которое слушает мод, чтобы скрытая трава возвращалась при разборе постройки. (?)
d:BaseTrimmer.NOTIFY_CLASS=Внутренний тип, за которым следит мод, чтобы замечать постройки рядом с вами. (?)
d:BaseTrimmer.PERIODIC_SWEEP_MOVE_DIST=Расстояние в игровых единицах, которое нужно пройти до фоновой повторной расчистки; 12800 это 128 метров. (?)
d:BaseTrimmer.PERIODIC_SWEEP_MS=Миллисекунды между фоновыми проверками, заново убирающими растения при перемещении по базе. (?)
d:BaseTrimmer.RT_BRUSH_PATH=Внутренний адрес формы кисти, наносимой на маску травы под каждой постройкой. (?)
d:BaseTrimmer.RT_PATH=Внутренний адрес маски травы, по которой рисует мод, чтобы прятать растения под вашими постройками. (?)
d:BaseTrimmer.RT_STAMP_ROT_SIGN=Направление поворота отпечатка маски; смените его, если скрытые участки травы под постройками расположены криво. (?)
d:BaseTrimmer.TELEPORT_DELAY_MS=Миллисекунды ожидания после быстрого перемещения перед расчисткой растений на новом месте. (?)
d:BaseTrimmer.USE_OVERLAP_QUERY=Убирает растения, оказавшиеся внутри радиуса расчистки каждой постройки; это основной проход очистки мода. (?)
d:BondalotLoadingScreen.createDesktopShortcut=Создаёт на рабочем столе ярлык для выбора экрана загрузки при первом запуске.
d:BondalotLoadingScreen.customImage=Полный путь к вашему изображению экрана загрузки; пустое значение оставляет встроенную иллюстрацию.
d:BondalotLoadingScreen.showOnAnyServer=Показывает свой экран загрузки на любом сервере, к которому вы подключаетесь, а не только на BondAlot Island.
d:CarryWeightIncrease.vuxCheckAcknowledge=Внутренний флаг, который мод переключает после применения изменений веса в этой сессии. (?)
d:CarryWeightIncrease.vuxGameVersion=Версия игры, под которую собран мод; выводится при запуске и на игру не влияет. (?)
d:CarryWeightIncrease.vuxModVersion=Обозначение версии мода; выводится при запуске, его изменение ничего не даёт. (?)
d:CarryWeightIncrease.vuxWeightPerSP=Дополнительный переносимый вес за каждое очко характеристик, вложенное в грузоподъёмность.
d:ChickNomadBiggerRecycler.DumpKey=Необязательная клавиша, выводящая в журнал текущее число слотов переработчика для отчёта об ошибке; по умолчанию выключена.
d:ChickNomadNoPostCrashModWarning.MessageKeywords=Дополнительный текст, который должно содержать диалоговое сообщение, чтобы мод его закрыл. (?)
d:ChickNomadPauseOnMenu.DiagnosticIntervalMs=Как часто в миллисекундах мод записывает диагностические строки в журнал UE4SS. (?)
d:CrossBaseInventoryCpp.build_mat_trace=Записывает дополнительные строки о стройматериалах в журнал UE4SS для диагностики. (?)
d:CrossBaseInventoryCpp.craft_trace=Записывает дополнительные строки о крафте в журнал UE4SS для диагностики. (?)
d:CrossBaseInventoryCpp.display_mint=Показывает материалы с других баз гильдии в меню крафта и строительства как стопки только для отображения, не добавляющие вес в инвентарь. (?)
d:CrossBaseInventoryCpp.mat_audit=Записывает в журнал сверку общих материалов гильдии для диагностики. (?)
d:DeadBodiesDisappearFasterInstant.palGameVersion=Версия игры, под которую собран мод; выводится в стартовой строке журнала. (?)
d:DeadBodiesDisappearFasterInstant.palModVersion=Номер версии мода; выводится в стартовой строке журнала и на игру не влияет. (?)
d:DeadBodiesDisappearFasterInstant.palRedColorWrapperBack=Завершает красную окраску стартового сообщения мода в журнале.
d:DeadBodiesDisappearFasterInstant.palRedColorWrapperFront=Начинает красную окраску стартового сообщения мода в журнале.
d:DynamicPassives8.debug_logging=Записывает дополнительные диагностические строки DynamicPassives8 в журнал UE4SS. (?)
d:DynamicPassives8.final_weight_5=Относительный шанс того, что пал, набравший 4 пассивки, в итоге получит 5, с учётом остальных итоговых весов.
d:DynamicPassives8.final_weight_6=Относительный шанс того, что пал, набравший 4 пассивки, в итоге получит 6, с учётом остальных итоговых весов.
d:DynamicPassives8.final_weight_7=Относительный шанс того, что пал, набравший 4 пассивки, в итоге получит 7, с учётом остальных итоговых весов.
d:DynamicPassives8.final_weight_8=Относительный шанс того, что пал, набравший 4 пассивки, в итоге получит 8, с учётом остальных итоговых весов.
d:DynamicPassives8.include_rare_only=Разрешает выбирать для дополнительных слотов только пассивки, помеченные игрой как редкие. (?)
d:DynamicPassives8.include_special_assignable=Разрешает выбирать для дополнительных слотов особые назначаемые пассивки. (?)
d:DynamicPassives8.include_unknown_metadata=Разрешает выбирать для дополнительных слотов пассивки, метаданные которых мод не может прочитать. (?)
d:DynamicPassives8.modify_native_weights=Использует указанные ниже свои веса появления от 0 до 4 вместо того, чтобы оставить собственные шансы Palworld на число пассивок без изменений.
d:DynamicPassives8.native_weight_0=Относительный шанс того, что пал появится без пассивок, с учётом остальных весов появления.
d:DynamicPassives8.native_weight_1=Относительный шанс того, что пал появится с 1 пассивкой, с учётом остальных весов появления.
d:DynamicPassives8.native_weight_2=Относительный шанс того, что пал появится с 2 пассивками, с учётом остальных весов появления.
d:DynamicPassives8.native_weight_3=Относительный шанс того, что пал появится с 3 пассивками, с учётом остальных весов появления.
d:DynamicPassives8.native_weight_4=Относительный шанс того, что пал появится с 4 пассивками; это же условие открывает путь к 5-8 пассивкам.
d:DynamicPassives8.natural_lottery_only=Ограничивает дополнительные пассивки только теми, что могут выпасть в собственной лотерее пассивок игры. (?)
d:DynamicPassives8.special_assignable_weight=Относительный шанс выбрать особую пассивку при заполнении слотов 5-8. (?)
d:DynamicPassives8.unknown_metadata_weight=Относительный шанс выбрать пассивку с нечитаемыми метаданными при заполнении слотов 5-8. (?)
d:Elevator.ControllerFloorSelectionModifierKey=Кнопка геймпада, удерживаемая при взаимодействии для выбора числа этажей перемещения лифта; по умолчанию стрелка вниз на крестовине.
d:Elevator.ControllerInteractKey=Кнопка геймпада, вызывающая лифт и отправляющая его вверх или вниз.
d:Elevator.DefaultFloorCount=Число этажей, на которое по умолчанию настроен только что установленный лифт. (?)
d:Elevator.FloorHeightMeters=Высота одного этажа в метрах; используется для расчёта расстояния перемещения лифта. (?)
d:Elevator.InteractionHalfWidthMeters=На каком расстоянии в метрах в стороны от лифта можно стоять и всё ещё взаимодействовать с ним. (?)
