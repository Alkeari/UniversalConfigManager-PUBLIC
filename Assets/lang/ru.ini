d:MapCollectablesNative.Toggle.Outposts=Устаревшее объединённое состояние для аванпостов, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.OutpostsEnabled=Главный переключатель аванпостов, включающий и выключающий их метки на карте группой.
d:MapCollectablesNative.Toggle.OutpostsOnMap=Показывает каждый аванпост значком на карте мира.
d:MapCollectablesNative.Toggle.Paloxite=Устаревшее объединённое состояние для месторождений палоксита, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.PaloxiteOnMap=Показывает каждое месторождение палоксита значком на карте мира.
d:MapCollectablesNative.Toggle.PanelExpanded=Открывает панель настроек мода уже развёрнутой при следующем открытии карты мира. (?)
d:MapCollectablesNative.Toggle.Quartz=Устаревшее объединённое состояние для месторождений кварца, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.QuartzOnMap=Показывает каждое месторождение кварца значком на карте мира.
d:MapCollectablesNative.Toggle.RelicTooltip=Показывает собственную информационную панель карты при наведении на значок статуэтки Лифмунка.
d:MapCollectablesNative.Toggle.Relics=Устаревшее объединённое состояние для статуэток Лифмунка, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.RelicsEnabled=Главный переключатель статуэток Лифмунка, включающий их метки на карте и компасе разом.
d:MapCollectablesNative.Toggle.RelicsOnCompass=Показывает статуэтки Лифмунка на полосе компаса в мире с указанием расстояния.
d:MapCollectablesNative.Toggle.RelicsOnMap=Показывает каждую статуэтку Лифмунка значком на карте мира.
d:MapCollectablesNative.Toggle.ResourcesEnabled=Главный переключатель всех значков руды, включающий и выключающий всю группу ресурсов разом.
d:MapCollectablesNative.Toggle.RespectFogOfWar=Прячет значки мода под неисследованным туманом войны, как ведут себя собственные значки карты.
d:MapCollectablesNative.Toggle.RuinTooltip=Показывает информационную подсказку при наведении на значок древних руин на карте.
d:MapCollectablesNative.Toggle.Ruins=Устаревшее объединённое состояние для древних руин, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.RuinsEnabled=Главный переключатель древних руин, включающий их метки на карте и компасе разом.
d:MapCollectablesNative.Toggle.RuinsOnCompass=Показывает древние руины на полосе компаса в мире с указанием расстояния.
d:MapCollectablesNative.Toggle.RuinsOnMap=Показывает каждые древние руины значком на карте мира.
d:MapCollectablesNative.Toggle.ShouldHideClusteredIconsSetting=Сводит скученные значки в один значок со счётчиком, который распадается при приближении.
d:MapCollectablesNative.Toggle.ShowFogOfWar=Рисует туман карты поверх неисследованной земли, не трогая ваши сохранённые данные об исследовании.
d:MapCollectablesNative.Toggle.Soralite=Устаревшее объединённое состояние для месторождений соралита, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.SoraliteOnMap=Показывает каждое месторождение соралита значком на карте мира.
d:MapCollectablesNative.Toggle.Sulfur=Устаревшее объединённое состояние для месторождений серы, которое мод переписывает сам, поэтому его изменение не сохраняется. (?)
d:MapCollectablesNative.Toggle.SulfurOnMap=Показывает каждое месторождение серы значком на карте мира.
d:MapCollectablesNative.Toggle.ViewportCullSetting=Рисует значки только для видимой сейчас части карты, что сохраняет её плавность. (?)
d:MapCollectablesNative.Tuning.ClusterRadius=Насколько близко должны оказаться два значка карты, чтобы слиться в один сгруппированный значок.
d:NativeModOptions.PREFIX=Внутренний префикс имени, который фреймворк использует при передаче настроек между разными модами.
d:NativeModOptions.enabled=Добавляет в журнал служебные сообщения фреймворка настроек модов.
d:NoBuildingLimits100.baseLimits=Ослабляет ограничение зоны базы, позволяя строить за её границей и ближе к другим базам.
d:NoBuildingLimits100.buildControls=Включает дополнительные клавиши, приближающие, отдаляющие, поднимающие и опускающие предпросмотр постройки.
d:NoBuildingLimits100.buildingLimits=Убирает ограничения на высоту строительства и на количество сооружений на базе.
d:NoBuildingLimits100.collapseProtection=Не даёт нависающим конструкциям обрушиться и вернуться в ресурсы сразу после установки.
d:NoBuildingLimits100.debugLogging=Записывает в журнал мода дополнительные подробности о строительстве для отчётов об ошибках. (?)
d:NoBuildingLimits100.dismantleRange=Расстояние в игровых единицах, на котором сооружение можно взять на прицел для разбора.
d:NoBuildingLimits100.distanceCoarseStep=Игровые единицы, на которые предпросмотр постройки смещается за нажатие при удерживаемом Shift.
d:NoBuildingLimits100.distanceFineStep=Игровые единицы, на которые предпросмотр постройки смещается за нажатие без удерживаемого Shift.
d:NoBuildingLimits100.distanceIncreaseHotkey=Клавиша, отодвигающая предпросмотр постройки дальше от вас; с Shift шаг больше.
d:NoBuildingLimits100.distanceMax=Наибольшее расстояние, на которое предпросмотр можно отодвинуть от вас, в игровых единицах. (?)
d:NoBuildingLimits100.distanceMin=Наименьшее расстояние, на которое предпросмотр можно придвинуть, в игровых единицах, где 100 соответствует обычной игре.
d:NoBuildingLimits100.distanceOffsetMax=Наибольшее смещение предпросмотра вперёд при автоматической постройке и привязке, в игровых единицах.
d:NoBuildingLimits100.errorRelaxation=Игнорирует запреты установки, останавливающие постройку, при этом правила материалов, разблокировки и прав продолжают действовать.
d:NoBuildingLimits100.foundation=Ослабляет правила фундаментов, позволяя им складываться, наклоняться, висеть в воздухе и садиться ниже над водой.
d:NoBuildingLimits100.heightHotkey=Клавиша, поднимающая предпросмотр постройки; с удержанным Shift она его опускает.
d:NoBuildingLimits100.heightMax=Наибольшая высота, на которую можно поднять предпросмотр, в игровых единицах над его исходной высотой. (?)
d:NoBuildingLimits100.heightMin=Наименьшая высота, на которую можно опустить предпросмотр, в игровых единицах ниже его исходной высоты. (?)
d:NoBuildingLimits100.heightStep=Игровые единицы, на которые предпросмотр смещается вверх или вниз за нажатие. (?)
d:NoBuildingLimits100.perItemRules=Позволяет деталям соприкасаться и пересекаться, отменяя правила установки для каждого объекта.
d:NoBuildingLimits100.previewControlsEnabledByDefault=Начинает каждую сессию с уже включённым управлением предпросмотром вместо обычного строительства.
d:NoBuildingLimits100.previewControlsToggleHotkey=Клавиша, включающая и выключающая управление расстоянием и высотой предпросмотра постройки.
d:NoBuildingLimits100.resourceRespawnTestHotkey=Клавиша, запускающая проверку возрождения руды, только когда Resource Respawn Test Enabled включён. (?)
d:NoBuildingLimits100.resourceRespawnTestRadius=Радиус вокруг вас, который проверяет проверка возрождения руды, только когда Resource Respawn Test Enabled включён. (?)
d:NoBuildingLimits100.statusDuration=Секунды, в течение которых экранные сообщения управления постройкой остаются видимыми, не менее 0.5. (?)
d:NoBuildingLimits100.support=Убирает требование несущей опоры, позволяя деталям соединяться и висеть где угодно.
d:NoDecayFeedBag.InventoryType.Common=Число, которым игра обозначает ваш основной инвентарь; задано игрой и не является настройкой. (?)
d:NoDecayFeedBag.InventoryType.DropSlot=Число, которым игра обозначает слот сброса; задано игрой и не является настройкой. (?)
d:NoDecayFeedBag.InventoryType.Essential=Число, которым игра обозначает сумку для ключевых предметов; задано игрой и не является настройкой. (?)
d:NoDecayFeedBag.InventoryType.FoodEquip=Число, которым игра обозначает слоты кормовой сумки; это контейнер, который мод хранит свежим. (?)
d:NoDecayFeedBag.InventoryType.PlayerEquipArmor=Число, которым игра обозначает слоты брони; задано игрой и не является настройкой. (?)
d:NoDecayFeedBag.InventoryType.WeaponLoadout=Число, которым игра обозначает слоты оружия; задано игрой и не является настройкой. (?)
d:NoDecayFeedBag.debugLog=Записывает в журнал подробную работу мода вместо обычных немногословных строк.
d:NoDecayFeedBag.debugLogIntervalSeconds=Секунды между подробными строками состояния в журнале, пока включена отладочная запись. (?)
d:NoDecayFeedBag.enabled=Включает и выключает мод целиком; при выключении порча еды остаётся прежней. (?)
d:NoDecayFeedBag.freezeFeedBag=Останавливает порчу еды в слотах кормовой сумки; это основной эффект мода.
d:NoDecayFeedBag.freezeIntervalSeconds=Секунды между проходами, обновляющими кормовую сумку; меньше значит отзывчивее и затратнее. (?)
d:NoDecayFeedBag.freezeVerboseSeconds=Секунды между подробными строками о кормовой сумке в журнале, пока включена отладочная запись. (?)
d:NoDecayFeedBag.inventoryRetrySeconds=Секунды между повторными попытками, пока мод ждёт, когда ваш инвентарь станет доступен. (?)
d:NoDecayFeedBag.logPrefix=Текстовая метка, которую мод ставит перед каждой строкой, записанной в журнал. (?)
d:NoDeleteConfirm.Diagnostic=Записывает в журнал каждое открываемое игрой диалоговое окно; именно это автор просит прикладывать к отчёту об ошибке.
d:NoDeleteConfirm.VerboseLogging=Записывает дополнительные строки NoDeleteConfirm в журнал UE4SS для диагностики.
d:NoGrapplingGunCooldownTimer.CoolDownTime=Секунды перезарядки после выстрела из крюка-кошки, где значение игры по умолчанию 8.
d:NoGrapplingGunCooldownTimer.palGameVersion=Версия игры, под которую собран мод; выводится в стартовой строке журнала. (?)
d:NoGrapplingGunCooldownTimer.palModName=Имя, выводимое перед стартовым сообщением мода в журнале. (?)
d:NoGrapplingGunCooldownTimer.palModVersion=Номер версии мода; выводится в стартовой строке журнала и на игру не влияет. (?)
d:NoGrapplingGunCooldownTimer.palRedColorWrapperBack=Завершает красную окраску стартового сообщения мода в журнале. (?)
d:NoGrapplingGunCooldownTimer.palRedColorWrapperFront=Начинает красную окраску стартового сообщения мода в журнале. (?)
d:NoPalDeposit.CMD_QUERY=Внутреннее имя сетевого сообщения для запроса у хоста состояния сундука; не меняйте его. (?)
d:NoPalDeposit.CMD_STATE=Внутреннее имя сетевого сообщения, которым хост отвечает о состоянии сундука; не меняйте его. (?)
d:NoPalDeposit.FlagsDir=Папка внутри папки сохранений игры, где мод хранит отметки блокировки для каждого сундука.
d:NoPalDeposit.RowLabel=Текст строки в настройках защиты сундука, запрещающей палам класть вещи; можно сформулировать по-своему.
d:PalArmy.Collision.DebugLogging=Записывает в журнал мода подробности о столкновениях во время езды верхом для отчётов об ошибках. (?)
d:PalArmy.Collision.MountedPartyNoCollision=Не даёт вам и вашему скакуну застревать в остальных палах отряда во время езды.
d:PalArmy.Controller.Enabled=Включает кнопки геймпада для призыва и отзыва дополнительных палов отряда. (?)
d:PalArmy.Controller.ModifierKey=Кнопка контроллера, удерживаемая вместе с кнопками призыва и отзыва. (?)
d:PalArmy.Controller.RecallAllKey=Кнопка контроллера, отзывающая весь ваш отряд. (?)
d:PalArmy.Controller.SummonAllKey=Кнопка контроллера, призывающая весь ваш отряд. (?)
d:PalArmy.Controller.SummonSelectedKey=Кнопка контроллера, призывающая выбранного дополнительного пала и отзывающая его при повторном нажатии. (?)
d:PalArmy.General.DebugLogging=Записывает в журнал мода подробную работу Pal Army; только для устранения неполадок.
d:PalArmy.General.Enabled=Выключает все возможности Pal Army и оставляет обычное поведение отряда. (?)
d:PalArmy.MassOperations.BatchDelayMilliseconds=Задержка в миллисекундах между партиями призыва или отзыва, от 0 до 10000.
d:PalArmy.MassOperations.BatchSize=Сколько палов призывается или отзывается за раз, от 1 до 100, где 1 безопаснее всего для больших отрядов.
d:PalArmy.Notifications.Enabled=Показывает на экране сообщения Pal Army, например о достижении предела призыва. (?)
d:PalArmy.Notifications.Priority=Важность экранных сообщений Pal Army, от 0 до 2. (?)
d:PalArmy.Party.PartySlots=Количество слотов вашего отряда, от 5 до 100, где 10 хорошая отправная точка.
d:PalArmy.Party.SafeShrink=Запрещает уменьшать отряд, пока палы занимают слоты, которые были бы убраны.
d:PalArmy.PartyWindow.NextPageKey=Клавиша перехода вперёд в панелях отряда, слишком маленьких для полного прокручиваемого списка.
d:PalArmy.PartyWindow.NextPageModifier=Модификатор, удерживаемый с клавишей следующей страницы, или NONE, если модификатора нет. (?)
d:PalArmy.PartyWindow.PreviousPageKey=Клавиша перехода назад в панелях отряда, слишком маленьких для полного прокручиваемого списка.
d:PalArmy.PartyWindow.PreviousPageModifier=Модификатор, удерживаемый с клавишей предыдущей страницы, или NONE, если модификатора нет. (?)
d:PalArmy.Summoning.Enabled=Включает призыв и отзыв дополнительных палов отряда сверх основного. (?)
d:PalArmy.Summoning.RecallAllKey=Клавиша, отзывающая весь ваш отряд по одной партии за раз.
d:PalArmy.Summoning.RecallAllModifier=Модификатор, удерживаемый с клавишей отзыва всех, или NONE, если модификатора нет.
d:PalArmy.Summoning.SummonAllKey=Клавиша, призывающая весь ваш отряд по одной партии за раз.
d:PalArmy.Summoning.SummonAllModifier=Модификатор, удерживаемый с клавишей призыва всех, или NONE, если модификатора нет.
d:PalArmy.Summoning.SummonLimit=Наибольшее число палов отряда, находящихся снаружи одновременно, от 1 до 100, или 0 без ограничения. (?)
d:PalArmy.Summoning.SummonSelectedKey=Клавиша, призывающая выбранного дополнительного пала и отзывающая его при повторном нажатии.
d:PalArmy.Summoning.SummonSelectedModifier=Модификатор, удерживаемый с клавишей призыва выбранного пала, или NONE, если его нет.
d:PalArmy.Updates.CheckForUpdates=Сообщает на экране, когда доступна более новая версия Pal Army. (?)
d:PalArmy.destruct_path=Внутренний игровой путь, по которому замечается закрытие окна отряда; не предназначен для изменения. (?)
d:PalBoxQoL.DEV_DEBUG_MODE_ENABLED=Включает авторские отладочные привязки клавиш и инструменты проверки; для обычной игры выключено.
d:PalBoxQoL.LOCAL_MARKER=Внутреннее имя, по которому мод находит локальный список Палбокса, а не глобальный.
d:PalBoxQoL.alphaIndex=Место в списке затенения панели, на котором сейчас стоит панель инструментов; сбрасывается при каждом запуске. (?)
d:PalBoxQoL.button.label.A=Насколько непрозрачна подпись на кнопках, которые добавляет этот мод, от 0 (невидимая) до 1 (сплошная). (?)
d:PalBoxQoL.button.label.B=Синий канал цвета подписи на кнопках, которые добавляет этот мод, от 0 до 1. (?)
d:PalBoxQoL.button.label.G=Зелёный канал цвета подписи на кнопках, которые добавляет этот мод, от 0 до 1. (?)
d:PalBoxQoL.button.label.R=Красный канал цвета подписи на кнопках, которые добавляет этот мод, от 0 до 1. (?)
d:PalBoxQoL.button.layout.hAlign=Как добавленные кнопки расположены по горизонтали; автор требует 1 (слева), потому что заполнение растягивает их на всю строку и поглощает собственные подписи игры.
d:PalBoxQoL.button.layout.padX=Отступ слева и справа от каждой добавленной кнопки, в пикселях; отступы сверху и снизу оставлены на 0, чтобы кнопки могли заполнить свою строку.
d:PalBoxQoL.button.layout.sizeRule=Как добавленные кнопки задают свой размер в строке, где 0 заполняет место и совпадает по высоте с собственными кнопками игры.
d:PalBoxQoL.button.layout.vAlign=Как добавленные кнопки расположены по вертикали, где 0 заполняет и совпадает по высоте с собственными кнопками игры, а 2 центрирует их и оставляет низкими.
d:PalBoxQoL.button.layout.weight=Какую часть свободной ширины строки занимает каждая добавленная кнопка, когда правило размера выставлено на заполнение. (?)
d:PalBoxQoL.glyphIndex=Место в списке символов, на котором сейчас стоит значок кнопки очистки; сбрасывается при каждом запуске. (?)
d:PalBoxQoL.pacing.batchSize=Сколько переключений избранного отправляется за партию при массовом запуске; меньше значит бережнее к игре.
d:PalBoxQoL.pacing.delayMs=Миллисекунды между партиями переключений избранного; увеличьте, если массовый запуск подтормаживает.
d:PalBoxQoL.pacing.importBatch=Сколько палов импортируется за шаг; должно оставаться 1, потому что именно увеличение сломало импорт.
d:PalBoxQoL.pacing.importDelayMs=Миллисекунды между импортируемыми палами; увеличьте, если в отчёте о запуске появляются отклонённые импорты.
d:PalBoxQoL.pairIndex=Место в списке значков, на котором сейчас стоят заменённые подписи поиска и сортировки. (?)
d:PalBoxQoL.transfer.export.bForceExport=Экспортирует пала даже тогда, когда игра обычно отказывается это делать.
d:PalBoxQoL.transfer.export.bRemoveOldData=При экспорте заменяет уже существующую сохранённую запись, а не добавляет рядом новую; сам автор мода отмечает это значение как вероятное, а не подтверждённое. (?)
d:PalBoxQoL.transfer.import.bOverwriteData=Импортирует поверх уже существующей записи в игре, а не оставляет её нетронутой.
d:PalEggInfo.EnableMod=Отключает показ сведений о яйцах, не удаляя мод. (?)
d:PalInsight.activationMode=Открывает панель осмотра по своему сочетанию клавиш или следует за вашим текущим прицеливанием.
d:PalInsight.activeAbilitiesThreshold=Устаревшее требование по поимкам для активных навыков, оставленное нулевым, чтобы решали значения постепенного раскрытия. (?)
d:PalInsight.aimTriggerMode=Выбирает, какое прицеливание показывает панель: оружием, броском Пал-сферы или и то и другое.
d:PalInsight.analyzeHumans=Позволяет осматривать людей так же, как палов. (?)
d:PalInsight.badIVColor.a=Непрозрачность цвета для низких значений потенциала, от 0 прозрачного до 1 сплошного. (?)
d:PalInsight.badIVColor.b=Доля синего в цвете для низких значений потенциала, от 0 до 1. (?)
d:PalInsight.badIVColor.g=Доля зелёного в цвете для низких значений потенциала, от 0 до 1. (?)
d:PalInsight.badIVColor.r=Доля красного в цвете для низких значений потенциала, от 0 до 1. (?)
d:PalInsight.badIVThreshold=Значения потенциала не выше этого числа окрашиваются цветом низких значений, от 0 до 100.
d:PalInsight.colorCodeIVs=Окрашивает значения потенциала в зависимости от того, насколько каждое из них высокое.
d:PalInsight.countAlphasSeparate=Считает альфа-палов отдельным видом в подсчёте одинаковых видов в Палбоксе. (?)
d:PalInsight.displayStyle=Показывает панель, пока удерживается сочетание клавиш, переключает её нажатием или держит всегда включённой.
d:PalInsight.distance=Наибольшая дальность осмотра в сантиметрах, от 1000 до 500000, где 30000 это 300 метров.
d:PalInsight.followOffsetX=Горизонтальное смещение панели в пикселях от пала, за которым она следует; положительное значение вправо. (?)
d:PalInsight.followOffsetY=Вертикальное смещение панели в пикселях от пала, за которым она следует; отрицательное значение вверх. (?)
d:PalInsight.followPal=Устаревший флаг следования, который перезаписывается выбором положения панели, поэтому его изменение ничего не меняет.
d:PalInsight.goodIVColor.a=Непрозрачность цвета для высоких значений потенциала, от 0 прозрачного до 1 сплошного. (?)
d:PalInsight.goodIVColor.b=Доля синего в цвете для высоких значений потенциала, от 0 до 1. (?)
d:PalInsight.goodIVColor.g=Доля зелёного в цвете для высоких значений потенциала, от 0 до 1. (?)
d:PalInsight.goodIVColor.r=Доля красного в цвете для высоких значений потенциала, от 0 до 1. (?)
d:PalInsight.goodIVThreshold=Значения потенциала не ниже этого числа окрашиваются цветом высоких значений, от 0 до 100.
d:PalInsight.highPotentialAttackThreshold=Потенциал атаки, от 0 до 100, который нужен палу для зелёного столба высокого потенциала.
d:PalInsight.highPotentialDefenseThreshold=Потенциал защиты, от 0 до 100, который нужен палу для зелёного столба высокого потенциала.
d:PalInsight.highPotentialHpThreshold=Потенциал здоровья, от 0 до 100, который нужен палу для зелёного столба высокого потенциала.
d:PalInsight.iVFontSizeDelta=Изменяет размер шрифта значений потенциала вверх или вниз от стандартного. (?)
d:PalInsight.iVSeparator=Символ, разделяющий значения потенциала в панели осмотра. (?)
d:PalInsight.iVTypeFace=Начертание шрифта для значений потенциала в панели осмотра. (?)
d:PalInsight.iVsThreshold=Устаревшее требование по поимкам для потенциала, оставленное нулевым, чтобы решали значения постепенного раскрытия. (?)
d:PalInsight.inspectAlt=Требует Alt вместе с клавишей, осматривающей пала под вашим прицелом. (?)
d:PalInsight.inspectCtrl=Требует Ctrl вместе с клавишей, осматривающей пала под вашим прицелом. (?)
d:PalInsight.inspectGamepadKey=Кнопка контроллера, осматривающая пала под вашим прицелом, или None, если привязки нет.
d:PalInsight.inspectKey=Клавиша клавиатуры или мыши, осматривающая пала под вашим прицелом.
d:PalInsight.inspectShift=Требует Shift вместе с клавишей, осматривающей пала под вашим прицелом. (?)
d:PalInsight.nativePotentialPalbox=Показывает потенциал в Палбоксе без надетых очков укротителя палов.
d:PalInsight.nativePotentialVision=Показывает потенциал без надетых очков укротителя палов на экранах, включённых ниже.
d:PalInsight.nativePotentialWorld=Показывает потенциал на полосках здоровья в мире без надетых очков укротителя палов.
d:PalInsight.neutralIVColor.a=Непрозрачность цвета для средних значений потенциала, от 0 прозрачного до 1 сплошного. (?)
d:PalInsight.neutralIVColor.b=Доля синего в цвете для средних значений потенциала, от 0 до 1. (?)
d:PalInsight.neutralIVColor.g=Доля зелёного в цвете для средних значений потенциала, от 0 до 1. (?)
d:PalInsight.neutralIVColor.r=Доля красного в цвете для средних значений потенциала, от 0 до 1. (?)
d:PalInsight.opacity=Непрозрачность панели осмотра, от 0.4 для еле заметной до 1.0 для сплошной.
d:PalInsight.palboxSearchAlt=Требует Alt вместе с клавишей, переключающей между вводом поиска и просмотром палов. (?)
d:PalInsight.palboxSearchCondenserEnabled=Добавляет строку поиска на экран конденсатора сущности палов.
d:PalInsight.palboxSearchCtrl=Требует Ctrl вместе с клавишей, переключающей между вводом поиска и просмотром палов. (?)
d:PalInsight.palboxSearchDisassemblyEnabled=Добавляет строку поиска на экран конвейера разбора палов.
d:PalInsight.palboxSearchExpeditionEnabled=Добавляет строку поиска на экран станции экспедиций палов.
d:PalInsight.palboxSearchShift=Требует Shift вместе с клавишей, переключающей между вводом поиска и просмотром палов. (?)
d:PalInsight.panelScale=Размер панели осмотра в процентах, от 40 до 100.
d:PalInsight.passiveAbilitiesThreshold=Устаревшее требование по поимкам для пассивных навыков, оставленное нулевым, чтобы решали значения постепенного раскрытия. (?)
d:PalInsight.potentialDisplayRule=Показывает потенциал через переключатели мода или только при надетых очках укротителя палов.
d:PalInsight.potentialVisionAlt=Требует Alt вместе с клавишей, показывающей потенциал без надетых очков. (?)
d:PalInsight.potentialVisionCtrl=Требует Ctrl вместе с клавишей, показывающей потенциал без надетых очков. (?)
d:PalInsight.potentialVisionShift=Требует Shift вместе с клавишей, показывающей потенциал без надетых очков. (?)
d:PalInsight.progressiveActiveThreshold=Сколько поимок вида нужно, прежде чем откроются его активные навыки, от 0 до 999.
d:PalInsight.progressiveDropsThreshold=Сколько поимок вида нужно, прежде чем откроется его добыча, от 0 до 999.
d:PalInsight.progressiveMovementThreshold=Сколько поимок вида нужно, прежде чем откроются его скорости передвижения, от 0 до 999.
d:PalInsight.progressivePartnerThreshold=Сколько поимок вида нужно, прежде чем откроется его навык напарника, от 0 до 999.
d:PalInsight.progressivePassiveThreshold=Сколько поимок вида нужно, прежде чем откроются его пассивные навыки, от 0 до 999.
d:PalInsight.progressivePotentialThreshold=Сколько поимок вида нужно, прежде чем откроется его потенциал, от 0 до 999.
d:PalInsight.progressiveWorkThreshold=Сколько поимок вида нужно, прежде чем откроется его пригодность к работе, от 0 до 999.
d:PalInsight.rampagingPalBeaconEnabled=Отмечает ближайших буйствующих палов красным столбом света.
d:PalInsight.rarePalBeaconEnabled=Отмечает ближайших счастливых палов золотым столбом света.
d:PalInsight.realtimeSpeedOffsetY=Сдвигает показ текущей скорости вниз при положительном значении, в безопасном диапазоне от -300 до 20.
d:PalInsight.settingsAlt=Требует Alt вместе с клавишей настроек, открывающей окно Pal Insight. (?)
d:PalInsight.settingsCtrl=Требует Ctrl вместе с клавишей настроек, открывающей окно Pal Insight. (?)
d:PalInsight.settingsGamepadKey1=Первая кнопка контроллера в паре, открывающей окно настроек Pal Insight.
d:PalInsight.settingsGamepadKey2=Вторая кнопка контроллера в паре, открывающей окно настроек Pal Insight.
d:PalInsight.settingsSchemaVersion=Отметка версии формата сохранённых настроек, по которой обновляются старые файлы; её изменение ничего не даёт. (?)
d:PalInsight.settingsShift=Требует Shift вместе с клавишей настроек, открывающей окно Pal Insight. (?)
d:PalInsight.showActive=Показывает активные навыки в панели осмотра.
d:PalInsight.showCaptureCount=Внутренний переключатель, который собственный анализатор игры требует оставить включённым, поэтому менять его не следует.
d:PalInsight.showDrops=Показывает в панели осмотра предметы, которые роняет пал.
d:PalInsight.showIVBonus=Показывает в панели осмотра прибавку, которую потенциал даёт каждой основной характеристике. (?)
d:PalInsight.showMovementSpeed=Показывает в панели осмотра скорости передвижения верхом.
d:PalInsight.showPalsInBox=Показывает, сколько палов того же вида у вас уже есть, при просмотре Палбокса.
d:PalInsight.showPartnerSkill=Показывает навык напарника в панели осмотра.
d:PalInsight.showPassive=Показывает пассивные навыки в панели осмотра.
d:PalInsight.showPotential=Показывает три значения потенциала в панели осмотра.
d:PalInsight.showRealtimeSpeed=Показывает вашу текущую скорость пешком или верхом в левом нижнем углу интерфейса.
d:PalInsight.showWork=Показывает пригодность к работе в панели осмотра.
d:PalInsight.staticOffsetX=Горизонтальное смещение панели в пикселях, когда она стоит в фиксированном месте экрана. (?)
d:PalInsight.staticOffsetY=Вертикальное смещение панели в пикселях, когда она стоит в фиксированном месте экрана. (?)
d:PalInsight.statsThreshold=Устаревшее требование по поимкам для характеристик в собственном анализаторе игры, оставленное нулевым. (?)
d:PalInsight.timeToHold=Секунды, которые нужно удерживать сочетание осмотра, прежде чем появится панель. (?)
d:PalInsightQuickStack.Alt=Требует удержания Alt вместе с сочетанием клавиш быстрого стека. (?)
d:PalInsightQuickStack.Ctrl=Требует удержания Ctrl вместе с сочетанием клавиш быстрого стека. (?)
d:PalInsightQuickStack.Shift=Требует удержания Shift вместе с сочетанием клавиш быстрого стека. (?)
d:PalInsightQuickStack.statuses.down=Код состояния, используемый при голосовании против мода. (?)
d:PalInsightQuickStack.statuses.noVote=Код состояния, используемый, когда вы ещё не голосовали за мод. (?)
d:PalInsightQuickStack.statuses.querying=Код состояния, используемый во время запроса статуса голосования в Мастерской. (?)
d:PalInsightQuickStack.statuses.settingUp=Код состояния, используемый во время отправки голоса «за». (?)
d:PalInsightQuickStack.statuses.unavailable=Код состояния, используемый, когда статус голосования в Мастерской прочитать не удаётся. (?)
d:PalInsightQuickStack.statuses.up=Код состояния, используемый при голосовании за мод. (?)
d:PalLevelScaling.configAutoReloadEnabled=Перечитывает настройки во время игры, чтобы правки доходили до будущих появлений без перезапуска.
d:PalLevelScaling.configAutoReloadIntervalSeconds=Секунды между перечитываниями настроек на предмет живых изменений, по умолчанию 300.
d:PalLevelScaling.decisionLogRetentionCount=Сколько файлов журнала решений о появлении сохраняется при удалении более старых.
d:PalLevelScaling.decisionLogRetentionEnabled=Удаляет более старые файлы журнала решений о появлении и оставляет только несколько новейших.
d:PalLevelScaling.despawnDistanceLarge=Мировые единицы, за которыми должны находиться все игроки, прежде чем палов крупного спавнера можно убрать.
d:PalLevelScaling.despawnDistanceMedium=Мировые единицы, за которыми должны находиться все игроки, прежде чем палов среднего спавнера можно убрать.
d:PalLevelScaling.despawnDistanceNPC=Мировые единицы, за которыми должны находиться все игроки, прежде чем персонажей спавнера людей-NPC можно убрать.
d:PalLevelScaling.despawnDistanceSmall=Мировые единицы, за которыми должны находиться все игроки, прежде чем палов малого спавнера можно убрать.
d:PalLevelScaling.levelsAboveSelectedPlayer=На сколько уровней выше выбранного ближнего игрока может выпасть новый дикий пал.
d:PalLevelScaling.levelsBelowSelectedPlayer=На сколько уровней ниже выбранного ближнего игрока может выпасть новый дикий пал.
d:PalLevelScaling.playerDetectionRangeBuffer=Дополнительные мировые единицы, добавляемые к радиусу спавнера при поиске ближних игроков для подстройки уровня.
d:PalLevelScaling.playerLevelSelectionMode=К какому из ближних игроков подстраивается появление: ближайшему, наивысшему, наинизшему, среднему, медианному или случайному.
d:PalLevelScaling.scalingDirection=В какую сторону может смещаться появление: только вверх поднимает слабых, только вниз опускает сильных, либо в обе стороны.
d:PalLevelScaling.spawnRadiusLarge=Расстояние в мировых единицах, около 100 на метр, с которого могут срабатывать крупные спавнеры диких палов.
d:PalLevelScaling.spawnRadiusMedium=Расстояние в мировых единицах, около 100 на метр, с которого могут срабатывать средние спавнеры диких палов.
d:PalLevelScaling.spawnRadiusNPC=Расстояние в мировых единицах, около 100 на метр, с которого могут срабатывать спавнеры людей-NPC.
d:PalLevelScaling.spawnRadiusSmall=Расстояние в мировых единицах, около 100 на метр, с которого могут срабатывать малые спавнеры диких палов.
d:PalMiniMap.autohideInBase=Скрывает миникарту, пока вы находитесь на территории базового лагеря.
d:PalMiniMap.autozoom=Автоматически расширяет обзор миникарты по мере увеличения скорости движения.
d:PalMiniMap.autozoomFly=Множитель зума, применяемый во время полёта, когда включён автозум. (?)
d:PalMiniMap.autozoomRun=Множитель зума, применяемый во время бега, когда включён автозум. (?)
d:PalMiniMap.autozoomWalk=Множитель зума, применяемый во время ходьбы, когда включён автозум. (?)
d:PalMiniMap.baseCampRadius=Запасной радиус, по которому определяется нахождение на территории базового лагеря, если собственную проверку игры прочитать не удаётся. (?)
d:PalMiniMap.captureHeight=На какой высоте над вами располагается камера живого рендера, от 200 до 20000 игровых единиц.
d:PalMiniMap.captureIntervalMs=Как часто перерисовывается живой рельеф, в миллисекундах, от 100 до 2000.
d:PalMiniMap.captureStyle=Какой источник живого рендера пробуется первым: 0 - освещённый мир, 1 - плоский неосвещённый цвет с возможным откатом на освещённый.
d:PalMiniMap.circular=Рисует миникарту кругом вместо квадрата.
d:PalMiniMap.elevationIndicatorSize=Размер стрелок высоты на метках, от 5 до 18 пикселей.
d:PalMiniMap.elevationThreshold=На сколько сантиметров выше или ниже вас должна быть метка, чтобы у неё появилась стрелка высоты.
d:PalMiniMap.enabled=Показывает или скрывает миникарту.
d:PalMiniMap.hideBehindGameUi=Скрывает миникарту, пока открыты собственные меню игры.
d:PalMiniMap.hideCollected=Скрывает уже собранные сундуки, яйца, заметки и статуэтки.
d:PalMiniMap.iconSize=Размер значков меток на миникарте, от 10 до 40 пикселей.
d:PalMiniMap.keys.corner=Клавиша, перемещающая миникарту в следующий угол экрана.
d:PalMiniMap.keys.down=Клавиша, перемещающая миникарту вниз, только в режиме редактирования.
d:PalMiniMap.keys.edit=Клавиша входа в режим редактирования, где стрелки перемещают миникарту, а клавиши зума меняют её размер.
d:PalMiniMap.keys.left=Клавиша, перемещающая миникарту влево, только в режиме редактирования.
d:PalMiniMap.keys.megazoom=Клавиша, переключающая мегазум - режим обзора всего региона.
d:PalMiniMap.keys.menu=Клавиша, открывающая и закрывающая меню настроек PalMiniMap.
d:PalMiniMap.keys.right=Клавиша, перемещающая миникарту вправо, только в режиме редактирования.
d:PalMiniMap.keys.up=Клавиша, перемещающая миникарту вверх, только в режиме редактирования.
d:PalMiniMap.keys.visible=Клавиша, показывающая или скрывающая миникарту.
d:PalMiniMap.keys.zoomIn=Клавиша приближения миникарты; в режиме редактирования также увеличивает её размер.
d:PalMiniMap.keys.zoomOut=Клавиша отдаления миникарты; в режиме редактирования также уменьшает её размер.
d:PalMiniMap.liveTerrain=Рисует рельеф живым видом сверху вместо использования собственной нарисованной текстуры карты мира игры.
d:PalMiniMap.liveZoomMax=Уровень зума, при превышении которого миникарта переключается с живого рендера на нарисованную текстуру карты.
d:PalMiniMap.lockIconsNorth=Удерживает значки вертикально, пока миникарта вращается.
d:PalMiniMap.mapQuality=Чёткость рельефа миникарты, от 0 (самая низкая) до 3 (самая высокая).
d:PalMiniMap.maxNpcIcons=Сколько значков NPC миникарта может показывать одновременно, от 0 до 64.
d:PalMiniMap.maxPalIcons=Сколько значков палов миникарта может показывать одновременно, от 8 до 128.
d:PalMiniMap.maxPlayerIcons=Сколько значков других игроков миникарта может показывать одновременно, от 0 до 64.
d:PalMiniMap.maxPoiIcons=Сколько значков точек интереса миникарта может показывать одновременно, от 8 до 128.
d:PalMiniMap.megazoom=Сколько мира показывает режим мегазума, в игровых единицах в поперечнике, от 60000 до 500000.
d:PalMiniMap.megazoomActive=Включён ли в данный момент обзорный режим мегазума. (?)
d:PalMiniMap.menuLanguage=Язык меню настроек; оставьте пустым, чтобы следовать языку игры. (?)
d:PalMiniMap.moveIntervalMs=Как часто переставляются значки, в миллисекундах; меньшее значение плавнее, но дороже по производительности.
d:PalMiniMap.onlyShinyPals=Показывает на миникарте только шайни-палов, скрывая обычных.
d:PalMiniMap.opacity=Непрозрачность миникарты, долей от 0 до 1.
d:PalMiniMap.palsWhileMegazoom=Оставляет значки палов видимыми, пока включён обзорный режим мегазума.
d:PalMiniMap.playerIconSize=Размер вашего собственного маркера игрока, от 10 до 48 пикселей.
d:PalMiniMap.rotateWithCamera=Вращает миникарту вместе с камерой вместо того, чтобы всегда держать север сверху.
d:PalMiniMap.scanIntervalMs=Как часто мир пересканируется на новые объекты, в миллисекундах, от 1000 до 20000.
d:PalMiniMap.showBaseCamps=Показывает базовые лагеря игроков на миникарте.
d:PalMiniMap.showChests=Показывает сундуки с сокровищами на миникарте.
d:PalMiniMap.showDeaths=Показывает на миникарте места, где вы погибали.
d:PalMiniMap.showDungeons=Показывает подземелья на миникарте.
d:PalMiniMap.showEffigies=Показывает статуэтки Лифмунка на миникарте.
d:PalMiniMap.showEggs=Показывает яйца палов на миникарте.
d:PalMiniMap.showElevationIndicators=Рисует стрелки на метках, находящихся заметно выше или ниже вас.
d:PalMiniMap.showEnemyCamps=Показывает вражеские лагеря на миникарте.
d:PalMiniMap.showFastTravel=Показывает точки быстрого перемещения на миникарте.
d:PalMiniMap.showFishing=Показывает места рыбалки на миникарте.
d:PalMiniMap.showNPCs=Показывает людей-NPC на миникарте.
d:PalMiniMap.showNotes=Показывает заметки на миникарте.
d:PalMiniMap.showPals=Показывает палов на миникарте.
d:PalMiniMap.showPlayers=Показывает других игроков на миникарте.
d:PalMiniMap.showResources=Показывает места добычи руды, лотоса и хлама на миникарте.
d:PalMiniMap.showSkillFruit=Показывает деревья фруктов навыков на миникарте.
d:PalMiniMap.showTowers=Показывает башни на миникарте.
d:PalMiniMap.showTreasureMaps=Показывает на миникарте клады, отмеченные картами сокровищ.
d:PalMiniMap.showViewCone=Рисует на миникарте конус, показывающий направление камеры.
d:PalMiniMap.size=Размер миникарты в пикселях, от 120 до 480.
d:PalMiniMap.terrainTexture=Текстура карты, которую рисует миникарта; оставьте пустым, чтобы использовать собственную карту мира игры. (?)
d:PalMiniMap.viewConeOpacity=Непрозрачность конуса обзора камеры, долей от 0 до 1.
d:PalMiniMap.viewConeSize=Насколько далеко достаёт конус обзора камеры, долей от радиуса миникарты.
d:PalMiniMap.x=Горизонтальное положение миникарты в пикселях экрана; отрицательное значение задаёт отступ от правого края. (?)
d:PalMiniMap.y=Вертикальное положение миникарты в пикселях экрана; отрицательное значение задаёт отступ от нижнего края. (?)
d:PalMiniMap.zoom=Сколько мира показывает миникарта, в игровых единицах в поперечнике, от 4000 до 120000.
d:PalMiniMap.zoomFactor=Во сколько раз одно нажатие клавиши зума меняет обзор, чтобы шаг ощущался одинаково на любом уровне зума. (?)
d:PalMiniMap.zoomMax=Наибольшая часть мира, которую может показать миникарта, в игровых единицах в поперечнике; это предел отдаления. (?)
d:PalMiniMap.zoomMin=Наименьшая часть мира, которую может показать миникарта, в игровых единицах в поперечнике; это предел приближения. (?)
d:PalSchema.enableAutoReload=Заново применяет контентные моды PalSchema во время игры, когда меняется любой из их файлов. (?)
d:PalSchema.enableDebugLogging=Записывает в журнал дополнительные подробности; полезно при сообщении о проблеме с контентным модом. (?)
d:PalSchema.languageOverride=Принудительно задаёт язык текста контентных модов PalSchema вместо следования языку игры. (?)
d:PalSizeSurgery.charge_gold=Списывает золото при каждом изменении размера пала на операционном столе для палов.
d:PalSizeSurgery.default_size_permille=Размер, с которого начинается вкладка изменения размера, в тысячных долях от обычного размера. (?)
d:PalSizeSurgery.diagnostic_logging=Записывает дополнительные строки Pal Size Surgery в журнал UE4SS для диагностики.
d:PalSizeSurgery.gold_cost=Сумма золота, списываемая за изменение размера на операционном столе для палов. (?)
d:PalSizeSurgery.max_size_permille=Наибольший доступный размер в тысячных долях от обычного размера; 2000 означает 2.00x. (?)
d:PalSizeSurgery.maximum_size=Наибольший размер, который вкладка изменения размера позволяет задать палу; по умолчанию 2.00x.
d:PalSizeSurgery.min_size_permille=Наименьший доступный размер в тысячных долях от обычного размера; 200 означает 0.20x. (?)
d:PalSizeSurgery.minimum_gold_cost=Наименьшая сумма золота, которую может стоить одно изменение размера. (?)
d:PalSizeSurgery.minimum_size=Наименьший размер, который вкладка изменения размера позволяет задать палу; по умолчанию 0.20x.
d:PalSizeSurgery.mounted_camera_distance=Настраивает расстояние камеры от пала с изменённым размером, на котором вы едете верхом. (?)
d:PalSizeSurgery.mounted_minimum_size=Наименьший размер, при котором на пала, способного носить верхом, ещё можно сесть; по умолчанию 0.80x.
d:PalSizeSurgery.step_size_permille=На сколько сдвигает один шаг ползунка размера, в тысячных долях от обычного размера. (?)
d:PalWorkPriority.CONTAINER_BASE_CLASS=Внутренний игровой класс, из которого мод читает контейнеры хранения базы. (?)
d:PalWorkPriority.FRESH_SECONDS=Задаёт, сколько секунд сохранённое значение считается актуальным, прежде чем будет измерено заново. (?)
d:PalWorkPriority.MAX_CEILING=Задаёт наибольший предел запаса, который может содержать правило производства. (?)
d:PalWorkPriority.MAX_ID_LEN=Задаёт наибольшую длину id предмета, допустимую модом в правиле производства. (?)
d:PalWorkPriority.MAX_RULES=Задаёт, сколько правил ограничения производства мод хранит одновременно. (?)
d:PalWorkPriority.STATION_SUIT.BlastFurnace_0=Внутренний код пригодности к работе, который мод сопоставляет со станцией доменной печи. (?)
d:PalWorkPriority.STATION_SUIT.CampFire_0=Внутренний код пригодности к работе, который мод сопоставляет со станцией костра. (?)
d:PalWorkPriority.WORK_IGNORE.Idle=Исключает тип работы «Простой» из назначений мода. (?)
d:PalWorkPriority._suitability_warned=Внутренний признак того, что предупреждение о пригодности к работе уже показано; изменение не влияет ни на что. (?)
d:PalWorkPriority.assignment_mode=Выбирает, распределяются ли палы по разным работам сразу или сначала заполняют одну работу, а затем следующую.
d:PalWorkPriority.enum_offset=Внутреннее смещение, которое мод использует, чтобы согласовать свой список типов работ с игровым. (?)
d:PalWorkPriority.find_ms=Внутреннее время поиска значков мода в миллисекундах; изменение не влияет ни на что. (?)
d:PalWorkPriority.finds=Внутренний счётчик количества поисков значков, выполненных модом; изменение не влияет ни на что. (?)
d:PalWorkPriority.game_ui_active=Внутренний признак того, что открыто одно из собственных меню игры; изменение не влияет ни на что. (?)
d:PalWorkPriority.hooked=Внутренний признак того, что хуки спроса мода установлены; изменение не влияет ни на что. (?)
d:PalWorkPriority.interval_seconds=Задаёт, сколько секунд проходит между проходами назначения работ модом.
d:PalWorkPriority.learned_warned=Внутренний признак того, что предупреждение о значках уже показано; изменение не влияет ни на что. (?)
d:PalWorkPriority.load_ms=Внутреннее время загрузки значков мода в миллисекундах; изменение не влияет ни на что. (?)
d:PalWorkPriority.loads=Внутренний счётчик количества загрузок значков модом; изменение не влияет ни на что. (?)
d:PalWorkPriority.pc_fallbacks=Внутренний счётчик того, как часто моду приходилось использовать запасной способ получить контроллер игрока; изменение не влияет ни на что. (?)
d:PalWorkPriority.perf=Включает журналирование производительности мода. (?)
d:PalWorkPriority.storage_scope=Выбирает, считаются ли ограничения производства отдельно для каждой базы или для всех баз вместе.
d:PalWorkPriority.worst_find=Внутренняя запись о самом медленном поиске значка, выполненном модом; изменение не влияет ни на что. (?)
d:PalboxPageLock.InfoKeybind=Клавиша, открывающая всплывающее окно с полным списком заблокированных страниц и текущими сочетаниями клавиш.
d:PalboxPageLock.Lang.AllUnlocked=Текст, показываемый после разблокировки всех заблокированных страниц. (?)
d:PalboxPageLock.Lang.ButtonAlreadyLocked=Текст, показываемый при попытке заблокировать уже заблокированную страницу. (?)
d:PalboxPageLock.Lang.ButtonAlreadyUnlocked=Текст, показываемый при попытке разблокировать страницу, которая и так не заблокирована. (?)
d:PalboxPageLock.Lang.ButtonList=Текст на кнопке, показывающей список заблокированных страниц.
d:PalboxPageLock.Lang.ButtonLock=Текст на кнопке, блокирующей просматриваемую страницу Palbox.
d:PalboxPageLock.Lang.ButtonLockedFlash=Текст, которым на миг вспыхивает кнопка сразу после блокировки страницы. (?)
d:PalboxPageLock.Lang.ButtonUnlock=Текст на кнопке, разблокирующей просматриваемую страницу Palbox.
d:PalboxPageLock.Lang.ButtonUnlockedFlash=Текст, которым на миг вспыхивает кнопка сразу после разблокировки страницы. (?)
d:PalboxPageLock.Lang.LockedListPrefix=Текст, добавляемый перед списком заблокированных страниц. (?)
d:PalboxPageLock.Lang.NoPagesLocked=Текст, показываемый, когда ни одна страница Palbox не заблокирована. (?)
d:PalboxPageLock.Lang.Unlocked=Слово, которым мод обозначает незаблокированную страницу. (?)
d:PalboxPageLock.ListKeybind=Клавиша, показывающая и обновляющая список заблокированных страниц Palbox.
d:PalboxPageLock.Message=Внутренний текст уведомления об обновлении, которое показывает мод. (?)
d:PalboxPageLock.NoticeVersion=Внутренняя запись о том, к какой версии мода относится уведомление об обновлении. (?)
d:PalboxPageLock.PruneAfterDays=Задаёт, сколько дней игрок может не появляться, прежде чем хост удалит его сохранённые заблокированные страницы.
d:PalboxPageLock.UnlockAllKeybind=Клавиша, разблокирующая сразу все заблокированные страницы Palbox.
d:PalboxSearchPlus.autocomplete_limit=Сколько подсказок с названиями пассивных навыков предлагает автодополнение при вводе. (?)
d:PalboxSearchPlus.condenser_click_searches=Нажатие на пала из отряда у конденсатора собирает перед вами остальных палов того же вида.
d:PalboxSearchPlus.container_swaps_per_tick=Сколько перемещений палов отправляется за игровой тик, пока поиск переставляет ваш бокс; стоит снизить, если сервер вас отключает.
d:PalboxSearchPlus.count=Сколько видов охватывает встроенная таблица разведения; это сгенерированные данные, а не настройка. (?)
d:PalboxSearchPlus.diagnostic_logging=Записывает подробный журнал для отчётов об ошибках; стоит включить перед воспроизведением проблемы.
d:PalboxSearchPlus.enable_client_view_sort=Переставляет вид Палбокса, не перемещая палов, и добавляет в меню сортировки кнопки характеристик и потенциала. (?)
d:PalboxSearchPlus.filter_debounce_ms=Миллисекунды паузы в наборе текста до перефильтрации бокса, чтобы он не перестраивался на каждое нажатие. (?)
d:PalboxSearchPlus.focus_search_on_open=Отдаёт строке поиска клавиатуру сразу при открытии экрана, из-за чего листание Q и E приостанавливается до подтверждения.
d:PalboxSearchPlus.poll_interval_ms=Миллисекунды между проверками строки поиска, по умолчанию 50, где больше значит дешевле и медленнее реакция. (?)
d:PalboxSearchPlus.restore_order_after_search=Возвращает бокс у конденсатора и торговца в прежний вид при очистке поиска или уходе с экрана.
d:PalboxSearchPlus.save_parameter_reads=Читает сохранённые данные палов, чтобы работал поиск по счастливым, избранным, конденсатору и потенциалу; выключено, так как на части систем вызывало вылеты.
d:PalboxSearchPlus.search_host_asset=Собственная рамка поля поиска мода, которая перехватывает Backspace, чтобы он правил текст, а не закрывал бокс.
d:PalboxSearchPlus.search_host_class=Внутреннее имя класса рамки поля поиска мода; неверное значение не даст строке появиться. (?)
d:PalboxSearchPlus.search_host_inner=Внутреннее имя текстового поля внутри рамки поиска мода; лучше оставить точно как есть. (?)
d:PalboxSearchPlus.show_focus_toggle=Показывает кнопку автофокуса над строкой поиска.
d:PalboxSearchPlus.show_status_line=Показывает над строкой поиска строку состояния, через которую отчитываются планировщики разведения и конденсации.
d:PalboxSearchPlus.sorted_slots_per_search=Сколько слотов сортировка физически переставляет у конденсатора и торговца, где 120 это четыре страницы.
d:PalboxSearchPlus.source=Указывает, что встроенные пары для разведения взяты из PalCalc, который извлекает их из файлов игры.
d:PalboxSearchPlus.store_bar_nudge_x=Смещает строку поиска хранилища вбок от места, куда её поставил мод; положительное значение вправо.
d:PalboxSearchPlus.store_bar_nudge_y=Смещает строку поиска хранилища по вертикали от места, куда её поставил мод; положительное значение вниз.
d:PalboxSearchPlus.store_bar_x_offset=Насколько правее строки поиска бокса 1 стоит строка поиска со стороны хранилища, в единицах холста.
d:PalboxSearchPlus.store_bar_y_offset=Насколько ниже строки поиска бокса 1 стоит строка поиска со стороны хранилища, в единицах холста.
d:PalboxSearchPlus.version=Из какого выпуска PalCalc сгенерирована встроенная таблица разведения; это данные, а не настройка.
d:PalboxStatCompare.DebugLogging=Записывает в журнал дополнительные диагностические сообщения для устранения неполадок.
d:PalpediaEnhancer.ClearAllKey=Клавиша, возвращающая все фильтры, сортировку и цель поиска к значениям по умолчанию, заданным ниже, либо None, чтобы оставить её без привязки.
d:PalpediaEnhancer.DefaultSearchTargets=Где ищет поле поиска при открытии Палпедии; несколько целей разделяйте запятыми.
d:PalpediaEnhancer.DefaultSort=Сортировка, с которой открывается список Палпедии, и та, к которой его возвращает клавиша сброса всего.
d:PalpediaEnhancer.DefaultSortDescending=Открывает Палпедию с обратной сортировкой, так что последняя или наибольшая запись оказывается первой.
d:PalpediaEnhancer.DefaultUnreadOnly=Открывает Палпедию сразу в режиме, где видны только записи, которые вы ещё не открывали.
d:PalpediaEnhancer.MarkAllSeenKey=Клавиша, отмечающая все непрочитанные записи Палпедии как открытые, так же как кнопка Отметить все как просмотренные.
d:PalpediaEnhancer.RememberState=Сохраняет фильтры, сортировку, цели поиска и последний запрос, когда вы закрываете и снова открываете Палпедию в той же сессии.
d:PalpediaEnhancer.ShowMarkAllSeenButton=Показывает кнопку Отметить все как просмотренные рядом с вкладкой Stats; её клавиша работает и при скрытой кнопке.
d:PalpediaEnhancer.ToggleUnreadKey=Клавиша, показывающая только те записи Палпедии, которые вы ещё не открывали, и снимающая точку новизны без прокрутки.
d:PalpediaEnhancer.VerboseLogging=Записывает в журнал дополнительную диагностику Палпедии; полезно при сообщении об ошибке.
d:PalsLearnOverTime.__version=Отметка формата в журнале сохранённого прогресса мода; не предназначена для правки вручную. (?)
d:PalsLearnOverTime.applyEnabled=Позволяет заработанной практике действительно повышать пригодность пала к работе; при выключении прогресс копится, не трогая сохранение.
d:PalsLearnOverTime.count=Внутренняя запись о том, сколько видов пригодности к работе есть в игре; её изменение ничего не даёт. (?)
d:PalsLearnOverTime.enabled=Внутренний переключатель, который мод ставит для собственной диагностики; его изменение ничего не даёт. (?)
d:PalsLearnOverTime.first=Внутренняя запись первого номера пригодности к работе; её изменение ничего не даёт. (?)
d:PalsLearnOverTime.firstId=Первая пригодность к работе, которую перебирает мод; часть расширенного блока, который лучше не трогать. (?)
d:PalsLearnOverTime.last=Внутренняя запись последнего номера пригодности к работе; её изменение ничего не даёт. (?)
d:PalsLearnOverTime.lastId=Последняя пригодность к работе, которую перебирает мод; часть расширенного блока, который лучше не трогать. (?)
d:PalsLearnOverTime.logging=Записывает прогресс и повышения уровня в собственные файлы журнала мода.
d:PalsLearnOverTime.numWorkTypes=Сколько видов пригодности к работе отслеживает мод; часть расширенного блока, который лучше не трогать. (?)
d:PalsLearnOverTime.probeSpawnQueues=Записывает глубину собственных очередей появления игры каждые несколько секунд во время загрузки мира, для устранения неполадок.
d:PalsLearnOverTime.seq=Внутренний счётчик, нумерующий диагностические строки мода; его изменение ничего не даёт. (?)
d:PalsLearnOverTime.snapshotEvery=Миллисекунды между перезаписями файла состояния прогресса, по умолчанию 30000.
d:PalsLearnOverTime.unlockTotalCost=Стоимость открытия вида работы, которого у пала нет; хранится для справки и не используется, пока открытие выключено.
d:PalsLearnOverTime.worldQuietSec=Секунды, которые мир должен оставаться спокойным после загрузки, прежде чем палы начнут набирать опыт; увеличьте, если загрузка вылетает.
