d:InstantHaul.DebugLogging=Записывает по строке на каждый предмет с указанием, куда он был отправлен; стоит включить при сообщении о проблеме.
d:InstantHaul.DetailPriority=Позволяет выбору по категориям переопределять правило «Всё остальное» для места хранения предметов.
d:InstantHaul.Enabled=Главный переключатель автоматической переноски; при выключении сбор предметов прекращается полностью.
d:InstantHaul.FacilityConvertPulls=В процентном режиме: на сколько заходов делится заказ на изготовление, где три забирают на каждой трети.
d:InstantHaul.FacilityFillPercent=В процентном режиме: насколько заполняется бесконечный производитель вроде карьера, прежде чем его опустошат.
d:InstantHaul.FacilityIntervalSec=Секунды между сборами готовой продукции на производственных точках вдали от вас.
d:InstantHaul.FacilityMinCount=В режиме количества: сколько предметов должно накопиться на производственной точке до их забора.
d:InstantHaul.FacilityNearSec=Секунды между сборами готовой продукции на производственных точках рядом с вами.
d:InstantHaul.FacilityTriggerMode=Когда забирается готовая продукция: по таймеру, по количеству предметов или по проценту заполнения.
d:InstantHaul.FarIntervalSec=Секунды между обходами выпавших предметов на базах за пределами ближнего радиуса.
d:InstantHaul.FoodRouting=Распределяет еду по настройкам приоритета хранения; при выключении еда считается обычным предметом.
d:InstantHaul.GuildChest=Также использует сундуки гильдии для хранения, а что в них помещается, решает собственный фильтр сундука.
d:InstantHaul.IntervalSec=Секунды между обходами выпавших предметов рядом с вами; действует со следующего обхода.
d:InstantHaul.Language=Язык собственного меню настроек мода; текст меню обновится при следующем открытии.
d:InstantHaul.MaxMovesPerTick=Наибольшее число предметов, перемещаемых за один обход; всё сверх этого переносится на следующий.
d:InstantHaul.NearRadius=Расстояние от вас, считающееся ближним, в игровых единицах, где 15000 это примерно 150 метров.
d:InstantHaul.NetIntervalSec=Секунды между полными обходами, подбирающими предметы, пропущенные мгновенными оповещениями; меньше значит больше нагрузки.
d:InstantHaul.PriorityDish=Куда в первую очередь попадают готовые блюда: в кормушку, в холодильник, в обычный сундук или в сундук гильдии.
d:InstantHaul.PriorityIngredient=Куда в первую очередь попадают сырая еда и ингредиенты: в кормушку, в холодильник, в обычный сундук или в сундук гильдии.
d:InstantHaul.PriorityOther=Куда в первую очередь попадает всё остальное: в сундук гильдии, в сундук с тем же предметом или категорией, либо в ближайший.
