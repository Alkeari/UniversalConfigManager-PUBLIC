d:PassivePals.defaultHumanProfile=โปรไฟล์ปฏิกิริยาที่ NPC มนุษย์ทุกคนใช้ ตั้งไว้ที่ vanilla เพื่อให้มนุษย์ที่เป็นศัตรูยังอันตรายและชาวบ้านทำตัวตามปกติ
d:PassivePals.defaultPalProfile=โปรไฟล์ปฏิกิริยาที่ Pal ทุกตัวนอกการควบคุมของคุณใช้ เว้นแต่พรีเซ็ต AI หรือกฎรายสายพันธุ์ด้านล่างจะแทนที่
d:PassivePals.friendlyPalProfile=โปรไฟล์ปฏิกิริยาที่หกสายพันธุ์ซึ่งเป็นมิตรใช้ เช่น Lamball, Chikipi และ Daedream
d:PassivePals.hostileHumanProfile=โปรไฟล์ปฏิกิริยาที่มนุษย์ซึ่งเข้าโจมตีคุณทันทีที่เห็นใช้ เช่น พวกโจรตามค่ายนักล่า
d:PassivePals.liveReloadSeconds=ม็อดนี้ตรวจไฟล์ของตัวเองเพื่อหาการแก้ไขของคุณบ่อยแค่ไหน หน่วยเป็นวินาที เพื่อให้การแก้ไขมีผลระหว่างเล่น ตั้งเป็น 0 เพื่อหยุดตรวจจนกว่าจะเปิดเกมใหม่
d:PassivePals.logging=ระดับที่ม็อดนี้เขียนลงล็อกของ UE4SS โดย quiet จะเหลือเพียงบรรทัดโหลด คำเตือน และปัญหา
d:PassivePals.nativePresetClassPath=ที่อยู่ภายในของชนิดพรีเซ็ตปฏิกิริยาที่ม็อดสร้างหนึ่งชุดต่อสายพันธุ์ที่ตั้งค่าไว้
d:PassivePals.neutralPalProfile=โปรไฟล์ปฏิกิริยาที่ Pal ซึ่งปกติไม่สนใจคุณจนกว่าจะถูกโจมตีจริง ๆ ใช้
d:PassivePals.pollLimit=จำนวนครั้งที่ม็อดพยายามก่อนจะเลิกในเซสชันนี้ และปล่อยปฏิกิริยาของ Pal ทุกตัวไว้ตามเดิม
d:PassivePals.pollSeconds=จำนวนวินาทีระหว่างการพยายาม ขณะที่ม็อดรอให้เกมโหลดพรีเซ็ต AI ที่มันจะเขียนทับ
d:PassivePals.preservePettingBehavior=คงพฤติกรรมเดินเข้ามาให้ลูบของสายพันธุ์ที่เชื่องไว้ แทนที่จะให้โปรไฟล์ที่คุณเลือกเขียนทับ
d:PassivePals.response.Battle=เลขของเกมเองสำหรับการสู้กลับเฉพาะเมื่อการตรวจความแข็งแกร่งบอกว่าชนะได้
d:PassivePals.response.Battle_Anyway=เลขของเกมเองสำหรับการสู้กลับเสมอ โดยไม่ตรวจความแข็งแกร่งเลย
d:PassivePals.response.Escape=เลขของเกมเองสำหรับปฏิกิริยาที่ทำให้ Pal วิ่งหนี
d:PassivePals.response.Ignore=เลขของเกมเองสำหรับปฏิกิริยาที่ไม่ทำอะไรเลย ไม่สู้และไม่หนี
d:PassivePals.response.Special=เลขของเกมเองสำหรับปฏิกิริยาตามสคริปต์ เช่น Pal ที่เชื่องเดินเข้ามาให้ลูบ
d:PassivePals.sensorSensePath=ที่อยู่ภายในของการตัดสินใจรับรู้ของเกมเอง ซึ่งกฎรายสายพันธุ์จะไปผูกไว้
d:PassivePals.skittishPalProfile=โปรไฟล์ปฏิกิริยาที่ Pal ซึ่งปกติจะวิ่งหนีเมื่อคุณเข้าใกล้ใช้ เช่น Cattiva และ Lifmunk
d:PassivePals.speciesRules.rule1Profile=โปรไฟล์ปฏิกิริยาของสายพันธุ์ที่ระบุในกฎข้อแรก ซึ่งจะแทนที่ทุกการตั้งค่าเหนือขึ้นไป
