d:PalBoxQoL.button.layout.padX=Khoảng đệm bên trái và bên phải của mỗi nút được thêm, tính bằng pixel, còn đệm trên và dưới để ở 0 để các nút lấp đầy hàng của chúng.
d:PalBoxQoL.button.layout.sizeRule=Cách các nút được thêm tự định kích thước trong hàng, trong đó 0 lấp đầy khoảng trống và cao bằng nút gốc của trò chơi.
