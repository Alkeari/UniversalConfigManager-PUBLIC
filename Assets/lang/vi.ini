d:InstantHaul.GuildChest=Dùng thêm rương guild để lưu trữ, với bộ lọc rương của chính trò chơi quyết định thứ gì vừa.
d:InstantHaul.IntervalSec=Số giây giữa các lượt quét vật phẩm rơi gần bạn, có hiệu lực từ lượt quét kế tiếp.
