d:NoBuildingLimits100.heightMax=Độ cao lớn nhất bản xem trước xây dựng có thể được nâng, theo đơn vị trò chơi so với độ cao ban đầu. (?)
d:NoBuildingLimits100.heightMin=Độ thấp nhất bản xem trước xây dựng có thể được hạ, theo đơn vị trò chơi dưới độ cao ban đầu. (?)
d:NoBuildingLimits100.heightStep=Số đơn vị trò chơi mà bản xem trước xây dựng dịch lên hoặc xuống mỗi lần nhấn. (?)
d:NoBuildingLimits100.perItemRules=Cho phép các mảnh chạm và chồng lên nhau bằng cách bỏ quy tắc đặt riêng của từng vật thể.
d:NoBuildingLimits100.previewControlsEnabledByDefault=Bắt đầu mỗi phiên với các điều khiển xem trước xây dựng đã bật sẵn thay vì kiểu xây gốc.
d:NoBuildingLimits100.previewControlsToggleHotkey=Phím bật hoặc tắt các điều khiển khoảng cách và độ cao của bản xem trước xây dựng.
d:NoBuildingLimits100.resourceRespawnTestHotkey=Phím chạy thử nghiệm hồi sinh quặng, chỉ khi Resource Respawn Test Enabled đang bật. (?)
d:NoBuildingLimits100.resourceRespawnTestRadius=Phạm vi quanh bạn mà thử nghiệm hồi sinh quặng kiểm tra, chỉ khi Resource Respawn Test Enabled đang bật. (?)
d:NoBuildingLimits100.statusDuration=Số giây các thông báo điều khiển xây dựng trên màn hình còn hiển thị, ít nhất là 0.5. (?)
d:NoBuildingLimits100.support=Bỏ yêu cầu về kết cấu chống đỡ để các mảnh nối vào nhau và treo được ở bất cứ đâu.
d:NoDecayFeedBag.InventoryType.Common=Số mà trò chơi dùng cho túi đồ chính của bạn, do trò chơi quy định chứ không phải một thiết lập để đổi. (?)
d:NoDecayFeedBag.InventoryType.DropSlot=Số mà trò chơi dùng cho ô thả đồ, do trò chơi quy định chứ không phải một thiết lập để đổi. (?)
d:NoDecayFeedBag.InventoryType.Essential=Số mà trò chơi dùng cho túi vật phẩm quan trọng, do trò chơi quy định chứ không phải một thiết lập để đổi. (?)
d:NoDecayFeedBag.InventoryType.FoodEquip=Số mà trò chơi dùng cho các ô túi thức ăn, chính là nơi chứa mà mod này giữ tươi. (?)
d:NoDecayFeedBag.InventoryType.PlayerEquipArmor=Số mà trò chơi dùng cho các ô giáp, do trò chơi quy định chứ không phải một thiết lập để đổi. (?)
d:NoDecayFeedBag.InventoryType.WeaponLoadout=Số mà trò chơi dùng cho các ô vũ khí, do trò chơi quy định chứ không phải một thiết lập để đổi. (?)
d:NoDecayFeedBag.debugLog=Ghi hoạt động chi tiết của mod vào nhật ký thay vì những dòng gọn nhẹ khi chạy thường.
d:NoDecayFeedBag.debugLogIntervalSeconds=Số giây giữa các dòng trạng thái chi tiết ghi vào nhật ký khi đang bật ghi nhật ký gỡ lỗi. (?)
d:NoDecayFeedBag.enabled=Bật hoặc tắt toàn bộ mod, khi tắt sẽ không đụng tới việc thức ăn hư hỏng. (?)
d:NoDecayFeedBag.freezeFeedBag=Ngăn thức ăn trong các ô túi thức ăn của bạn hư hỏng, tác dụng chính của mod.
d:NoDecayFeedBag.freezeIntervalSeconds=Số giây giữa các lượt làm mới túi thức ăn, thấp hơn thì phản hồi nhanh hơn và tốn hơn. (?)
