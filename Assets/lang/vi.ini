d:SmoothBossBattles.AutoConfirm_BossTower=Tự xác nhận lời nhắc bắt đầu trận thay bạn khi bước vào một trận boss tháp.
d:SmoothBossBattles.AutoConfirm_RaidBoss=Tự xác nhận lời nhắc bắt đầu trận thay bạn khi khởi động một boss raid tại Bàn thờ Triệu hồi.
d:SmoothBossBattles.AutoConfirm_WorldTree=Tự xác nhận lời nhắc bắt đầu trận thay bạn khi bước vào một trận boss Cây Thế Giới.
d:SmoothBossBattles.SkipIntroCutscene_BossTower=Bỏ qua đoạn phim cắt cảnh phát trên đường vào một trận boss tháp.
d:SmoothBossBattles.SkipVictoryWait_BossTower=Cho bạn rời khỏi boss tháp ngay sau chiến thắng thay vì phải chờ, chỉ khi chơi một mình.
d:SmoothBossBattles.SkipVictoryWait_WorldTree=Cho bạn rời đi ngay sau khi hạ một trong ba boss Cây Thế Giới ở giữa, chỉ khi chơi một mình.
d:SmoothBossBattles.SkipVictoryWait_WorldTreeFinal=Cho bạn rời đi ngay sau boss Cây Thế Giới cuối cùng, việc này cắt ngắn đoạn kết của trò chơi.
d:SmoothBossBattles.enabled=Bật phần ghi nhật ký phát triển của tác giả, vốn xuất xưởng ở trạng thái tắt và nên để tắt khi chơi bình thường.
d:TidyBaseInfo.cursorGraceTicks=Con trỏ tự do trụ được qua bao nhiêu lượt bảo trì sau khi bạn rời khỏi bảng, để việc đi sang menu không làm nó tắt.
d:TidyBaseInfo.emptyPortraitScale=Hệ số kích thước cho vòng tròn giữ chỗ được vẽ trong một ô thợ trống.
d:TidyBaseInfo.fallback.menu_assign=Cách diễn đạt tiếng Anh cho thao tác Giao việc, chỉ dùng khi không đọc được các tệp ngôn ngữ của mod.
d:TidyBaseInfo.fallback.menu_palbox=Cách diễn đạt tiếng Anh cho thao tác Gửi về Palbox, chỉ dùng khi không đọc được các tệp ngôn ngữ của mod.
d:TidyBaseInfo.fallback.menu_resummon=Cách diễn đạt tiếng Anh cho thao tác Gọi lại, chỉ dùng khi không đọc được các tệp ngôn ngữ của mod.
d:TidyBaseInfo.gridOffsetX=Vị trí theo chiều ngang của lưới pal bên trong bảng thông tin thợ căn cứ, theo đơn vị màn hình.
d:TidyBaseInfo.gridOffsetY=Dời lưới pal xuống, hoặc lên khi dùng giá trị âm, theo pixel.
d:TidyBaseInfo.gridWidth=Chiều rộng của lưới pal theo đơn vị màn hình, đủ rộng cho bốn chân dung mỗi hàng ở cỡ biểu tượng mặc định.
d:TidyBaseInfo.hoverPanelOffsetX=Dịch nhẹ theo chiều ngang của bảng chi tiết nằm dưới lưới pal, theo đơn vị màn hình.
d:TidyBaseInfo.hoverPanelOffsetY=Khoảng cách giữa mép dưới của lưới pal và hàng trạng thái hiện ra khi rê chuột bên dưới nó, theo pixel.
d:TidyBaseInfo.iconPadding=Khoảng cách chừa giữa các ô pal trong lưới, theo đơn vị màn hình, trên cả hai trục.
d:TidyBaseInfo.iconSize=Chiều dài cạnh của một ô pal trong lưới, theo đơn vị màn hình, vừa đủ xếp bốn ô theo chiều rộng lưới mặc định.
d:TidyBaseInfo.inspectHoldKey=Phím giữ để xem nhanh, giải phóng con trỏ chuột trên lưới cho tới khi bạn thả ra.
d:TidyBaseInfo.inspectKey=Phím bật con trỏ chuột tự do trên bảng và tắt lại khi nhấn lần nữa, hoặc để trống để tắt hẳn.
d:TidyBaseInfo.keybindModifier=Phím bổ trợ giữ cùng với các phím cuộn và xem nhanh; NONE cho phép dùng riêng các phím đó.
d:TidyBaseInfo.language=Ngôn ngữ mà mod này dùng cho nhãn của chính nó; auto theo thiết lập ngôn ngữ của trò chơi.
d:TidyBaseInfo.liveReloadSeconds=Bao lâu một lần mod này đọc lại tệp của nó để tìm thay đổi của bạn, tính bằng giây, để thay đổi có hiệu lực khi bạn đang chơi; đặt 0 sẽ dừng theo dõi cho tới lần khởi động sau.
d:TidyBaseInfo.maintenanceMs=Số mili giây giữa các lượt bảo trì giúp thu gọn lại các hàng thợ của chính trò chơi và theo dõi thứ con trỏ đang trỏ vào.
d:TidyBaseInfo.maxGridHeight=Chiều cao tối đa lưới pal có thể đạt tới, theo pixel, trước khi nó tự cuộn bên trong thay vì che thanh phím nhanh.
d:TidyBaseInfo.menuItemGap=Khoảng cách giữa các mục của menu thao tác chuột phải, tính bằng pixel.
d:TidyBaseInfo.menuItemPadding=Khoảng trống phía trên và phía dưới mỗi nhãn trong menu thao tác chuột phải, tính bằng pixel.
d:TidyBaseInfo.menuItemPaddingX=Khoảng trống bên trái và bên phải mỗi nhãn trong menu thao tác chuột phải, tính bằng pixel.
d:TidyBaseInfo.menuItemPaddingY=Khoảng trống phía trên và phía dưới mỗi nhãn trong menu thao tác chuột phải, tính bằng pixel.
d:TidyBaseInfo.menuOffsetX=Khoảng cách giữa lưới pal và menu thao tác chuột phải mở ra bên cạnh nó, theo pixel.
d:TidyBaseInfo.menuOffsetY=Dịch nhẹ theo chiều dọc của menu thao tác chuột phải so với mép trên của lưới pal, theo đơn vị màn hình.
d:TidyBaseInfo.menuWidth=Chiều rộng của menu thao tác chuột phải theo pixel, hãy tăng lên khi một nhãn đã dịch bị cắt.
d:TidyBaseInfo.openDetailsOnClick=Mở màn hình chi tiết pal đầy đủ của trò chơi khi bạn bấm vào một pal; khi tắt, tên và trạng thái của pal đó được ghim dưới lưới.
d:TidyBaseInfo.portraitOffsetX=Đẩy từng chân dung pal sang phải, hoặc sang trái khi dùng giá trị âm, bên trong ô của nó.
d:TidyBaseInfo.portraitOffsetY=Đẩy từng chân dung pal xuống, hoặc lên khi dùng giá trị âm, bên trong ô của nó.
d:TidyBaseInfo.portraitScale=Hệ số kích thước cho một chân dung pal bên trong ô lưới của nó, 1.0 là cỡ mà trò chơi vẽ ra.
d:TidyBaseInfo.resummonTimeoutMs=Resummon chờ bao lâu để một pal tới được Palbox trước khi bỏ cuộc và để nó lại đó một cách an toàn.
d:TidyBaseInfo.scrollDownKey=Phím nhấn cùng Alt để cuộn lưới pal xuống một bước.
d:TidyBaseInfo.scrollStepPx=Quãng đường lưới pal dịch đi cho mỗi bước cuộn bằng bàn phím, theo đơn vị màn hình.
d:TidyBaseInfo.scrollUpKey=Phím cuộn lưới pal lên một bước, nhấn cùng phím bổ trợ ở trên, hoặc để trống để tắt.
d:TidyBaseInfo.showEmptySlots=Hiện ô thợ trống dưới dạng vòng tròn giữ chỗ; khi tắt, lưới chỉ gồm những pal của bạn.
d:TidyBaseInfo.suspendInputOverPanel=Tạm ngưng đổi vũ khí, ngắm bắn, bắn và ra lệnh cho pal trong lúc con trỏ nằm trên bảng.
d:TidyBaseInfo.tokens.deepGraphite=Mã màu hex của nền phía sau menu thao tác chuột phải.
d:TidyBaseInfo.tokens.forgedGold=Mã màu hex của viền quanh mục menu thao tác mà chuột đang trỏ vào.
d:TidyBaseInfo.tokens.hairline=Mã màu hex của đường mảnh quanh nền menu và quanh từng mục của nó.
d:TidyBaseInfo.tokens.raised=Mã màu hex tô cho một mục của menu thao tác chuột phải.
