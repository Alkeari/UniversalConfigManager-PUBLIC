d:HUDLocator.globalSaveProgress.totalEffigies=Bộ theo dõi tính tới bao nhiêu tượng Lifmunk, tức cái đích mà phần trăm của nó đo theo. (?)
d:HUDLocator.globalSaveProgress.totalFastTravels=Bộ theo dõi tính tới bao nhiêu điểm dịch chuyển nhanh, tức cái đích mà phần trăm của nó đo theo. (?)
d:HUDLocator.globalSaveProgress.totalTowers=Bộ theo dõi tính tới bao nhiêu boss tháp, tức cái đích mà phần trăm của nó đo theo. (?)
d:HUDLocator.globalSaveProgress.unlockedFastTravels=Số điểm dịch chuyển nhanh đã tìm thấy, đếm lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.isOpen=Đánh dấu menu riêng của mod có đang mở hay không, chỉnh sửa không có tác dụng. (?)
