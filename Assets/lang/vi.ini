d:PerfProbe.grassd=Tỷ lệ mật độ cỏ tính theo phần trăm mà PerfProbe áp dụng, từ 0 đến 100, -1 giữ nguyên giá trị gốc của trò chơi. (?)
d:PerfProbe.h=Chiều cao đã lưu của bảng nổi mà tệp này thuộc về, giới hạn trong phạm vi bảng đó cho phép. (?)
