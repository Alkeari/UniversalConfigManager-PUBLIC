d:PalBoxQoL.pacing.importDelayMs=Số mili giây giữa các Pal được nhập, hãy tăng lên nếu bản tóm tắt báo có lần nhập bị từ chối.
d:PalBoxQoL.pairIndex=Vị trí trong danh sách biểu tượng mà các nhãn Tìm kiếm và Sắp xếp thay thế đang dùng. (?)
