d:DynamicPassives8.native_weight_1=Tỷ lệ tương đối để một Pal xuất hiện tự nhiên với 1 chỉ số bị động, so với các trọng số xuất hiện khác.
d:DynamicPassives8.native_weight_2=Tỷ lệ tương đối để một Pal xuất hiện tự nhiên với 2 chỉ số bị động, so với các trọng số xuất hiện khác.
d:DynamicPassives8.native_weight_3=Tỷ lệ tương đối để một Pal xuất hiện tự nhiên với 3 chỉ số bị động, so với các trọng số xuất hiện khác.
d:DynamicPassives8.native_weight_4=Tỷ lệ tương đối để một Pal xuất hiện tự nhiên với 4 chỉ số bị động, đây cũng là ngưỡng để có thêm từ 5 đến 8 chỉ số.
d:DynamicPassives8.natural_lottery_only=Giới hạn các chỉ số bị động thêm chỉ trong số những chỉ số có thể xuất hiện trong vòng quay chỉ số bị động gốc của trò chơi. (?)
d:DynamicPassives8.special_assignable_weight=Tỷ lệ tương đối để chọn một chỉ số bị động đặc biệt khi lấp đầy các ô từ 5 đến 8. (?)
d:DynamicPassives8.unknown_metadata_weight=Tỷ lệ tương đối để chọn một chỉ số bị động có metadata không đọc được khi lấp đầy các ô từ 5 đến 8. (?)
d:Elevator.ControllerFloorSelectionModifierKey=Nút tay cầm giữ trong khi tương tác để chọn số tầng thang máy sẽ di chuyển, mặc định là mũi tên xuống trên d-pad.
d:Elevator.ControllerInteractKey=Nút tay cầm để gọi thang máy và cho nó đi lên hoặc xuống.
d:Elevator.DefaultFloorCount=Số tầng mà một thang máy mới đặt được thiết lập để di chuyển. (?)
d:Elevator.FloorHeightMeters=Chiều cao một tầng tính bằng mét, dùng để tính thang máy di chuyển bao xa. (?)
d:Elevator.InteractionHalfWidthMeters=Bạn có thể đứng cách thang máy bao xa về mỗi bên, tính bằng mét, mà vẫn tương tác được. (?)
d:Elevator.InteractionVerticalMarginMeters=Bạn có thể đứng cách thang máy bao xa phía trên hoặc dưới, tính bằng mét, mà vẫn tương tác được. (?)
d:Elevator.KeyboardInteractKey=Phím bàn phím để gọi thang máy và cho nó đi lên hoặc xuống, mặc định là F.
d:Elevator.MaximumFloorCount=Số tầng tối đa mà thang máy có thể được thiết lập di chuyển, mặc định là 16 vì số lớn hơn gây lỗi.
d:Elevator.MaximumFloorSearchMeters=Thang máy tìm tầng để dừng trong phạm vi bao nhiêu mét khi được gọi. (?)
d:Elevator.MaximumSpeedMetersPerSecond=Tốc độ nhanh nhất mà sàn thang máy có thể di chuyển, tính bằng mét trên giây. (?)
d:Elevator.MinimumFloorCount=Số tầng nhỏ nhất mà thang máy có thể được thiết lập di chuyển. (?)
d:Elevator.MinimumTravelHeightMeters=Khoảng cách ngắn nhất tính bằng mét mà thang máy di chuyển khi được cho đi lên hoặc xuống. (?)
d:Elevator.PlatformHorizontalScale=Kích thước theo chiều ngang của sàn thang máy. (?)
d:Elevator.PlatformScale=Kích thước tổng thể của sàn thang máy. (?)
d:Elevator.TravelSeconds=Thời gian tính bằng giây để thang máy hoàn tất một lượt di chuyển. (?)
d:ExpandedWorldOptions.global_max=Giá trị cao nhất mà mọi thiết lập thế giới mở rộng có thể được nâng lên, trừ khi thiết lập đó có ghi đè riêng bên dưới.
d:ExpandedWorldOptions.mod.game_version=Phiên bản Palworld mà bản dựng này của mod được viết cho. (?)
d:ExpandedWorldOptions.mod.mod_version=Số phiên bản của chính mod. (?)
d:ExpandedWorldOptions.mod.name=Tên mà mod tự báo cáo trong các dòng log của nó. (?)
d:ExpandedWorldOptions.overrides.PalEggDefaultHatchingTime.max=Giá trị cao nhất mà thiết lập thế giới về thời gian nở trứng Pal có thể được đặt.
d:ExpandedWorldOptions.overrides.PalEggDefaultHatchingTime.min=Giá trị thấp nhất mà thiết lập thế giới về thời gian nở trứng Pal có thể được đặt.
d:ExpandedWorldOptions.overrides.SupplyDropSpan.max=Giá trị cao nhất mà thiết lập thế giới Supply Drop Span có thể được đặt.
d:ExpandedWorldOptions.overrides.SupplyDropSpan.min=Giá trị thấp nhất mà thiết lập thế giới Supply Drop Span có thể được đặt.
d:FToDrop.DropAll.Enabled=Bật phím tắt thả toàn bộ chồng vật phẩm dưới con trỏ.
d:FToDrop.DropAll.Key=Phím thả toàn bộ chồng vật phẩm dưới con trỏ, mặc định là F.
d:FToDrop.DropHalf.Enabled=Bật phím tắt thả một nửa chồng vật phẩm dưới con trỏ.
d:FToDrop.DropHalf.Key=Phím tắt thả một nửa chồng vật phẩm, làm tròn xuống, mặc định là Shift cộng F.
d:FToDrop.DropOne.Enabled=Bật phím tắt thả một vật phẩm duy nhất từ chồng dưới con trỏ.
d:FToDrop.DropOne.Key=Phím tắt thả một vật phẩm từ chồng dưới con trỏ, mặc định là Ctrl cộng F.
d:GhostWildCaptureHp.debug=Ghi thêm thông tin chẩn đoán về tỷ lệ bắt vào nhật ký để khắc phục sự cố. (?)
d:GhostWildCaptureHp.exempt_min_capture_item_level=Sức bắt mà từ đó một quả cầu được tính là cổ đại và bỏ qua hình phạt máu cho mọi Pal.
d:GhostWildCaptureHp.level_advantage_exempt=Mức cấp bạn vượt hơn một Pal để được miễn hình phạt máu khi bắt, với -1 sẽ tắt hẳn.
d:GhostWildCaptureHp.player_level_cache_sec=Số giây mod nhớ cấp độ của bạn trước khi đọc lại.
d:GhostWildCaptureHp.sphere_unlock_exempt=Bỏ qua hình phạt máu khi quả cầu được mở khóa ở cấp bằng hoặc cao hơn cấp của Pal mục tiêu.
d:GhostWildCaptureHp.wild_only=Giới hạn hình phạt máu khi bắt cho Pal hoang dã, khi tắt sẽ áp cả cho boss và boss tháp.
d:GoToBedTeleportEdition.Debug=Ghi nhật ký chi tiết vào UE4SS.log để khắc phục sự cố, tốt nhất nên tắt khi chơi bình thường.
d:HUDLocator.ConfigLoadedOnce=Đánh dấu rằng thiết lập đã được đọc một lần trong phiên này, chỉnh sửa không có tác dụng. (?)
d:HUDLocator.currentRegionName=Vùng mà bộ theo dõi đặt bạn vào lần gần nhất, ghi lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.globalSaveProgress.clearedBounties=Số lệnh truy nã đã hoàn thành, đếm lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.globalSaveProgress.collectedEffigies=Số tượng Lifmunk đã thu thập, đếm lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.globalSaveProgress.defeatedAlphas=Số Pal alpha đã hạ, đếm lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.globalSaveProgress.defeatedTowers=Số boss tháp đã hạ, đếm lại sau mỗi lần quét và không bị ảnh hưởng khi chỉnh sửa. (?)
d:HUDLocator.globalSaveProgress.overallPercent=Phần trăm hoàn thành tổng thể mà bộ theo dõi tính ra, tính lại sau mỗi lần quét. (?)
d:HUDLocator.globalSaveProgress.totalAlphas=Bộ theo dõi tính tới bao nhiêu Pal alpha, tức cái đích mà phần trăm của nó đo theo. (?)
