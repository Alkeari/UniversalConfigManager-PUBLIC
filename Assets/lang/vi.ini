d:PerfProbe.primary=Phím hoặc nút để đổi bộ trang bị phụ kiện của bạn, viết dưới dạng id phím riêng của PerfProbe. (?)
d:PerfProbe.recon.BABY_HALF=Hệ số kích thước mà chế độ baby nhắm tới khi thu nhỏ Pal của bạn, trước khi các giới hạn sàn và trần được áp dụng. (?)
d:PerfProbe.recon.BABY_MAX_CM=Chiều cao lớn nhất tính bằng centimet mà một Pal bị thu nhỏ bởi chế độ baby được phép đạt tới, kéo các loài khổng lồ xuống thấp hơn nữa. (?)
d:PerfProbe.recon.BABY_MIN_CM=Chiều cao nhỏ nhất tính bằng centimet mà một Pal bị thu nhỏ bởi chế độ baby được phép đạt tới. (?)
d:PerfProbe.recon.MESH_PROBE_CAP=Số mesh mà một lượt dò mesh dành cho nhà phát triển duyệt qua trước khi dừng, để một lượt quét không làm treo trò chơi. (?)
d:PerfProbe.recon.SMC_MAT_CAP=Số vật liệu mà một lượt quét static mesh dành cho nhà phát triển đọc trước khi dừng, để một lượt quét không làm treo trò chơi. (?)
