d:PerfProbe.schema=Phiên bản định dạng của tệp này, do PerfProbe ghi để phiên bản sau có thể chuyển đổi tệp cũ thay vì xóa trắng. (?)
d:PerfProbe.settings.txt:mode=Phương pháp nâng cấp hình ảnh mà PerfProbe áp dụng, chọn trong số những phương pháp phần cứng của bạn hỗ trợ. (?)
d:PerfProbe.settings.txt:schema=Phiên bản định dạng của tệp thiết lập, để phiên bản PerfProbe sau này có thể chuyển đổi thay vì xóa trắng. (?)
