d:PerfectPlacement.ui.gamepad_enabled_property=Tên nội bộ của trường trong bảng hướng dẫn mang thông tin tay cầm có được bật hay không. (?)
d:PerfectPlacement.ui.hide_function=Tên nội bộ của lệnh gọi đi kèm để ẩn bảng hướng dẫn đặt vật, chỉnh sửa không có tác dụng gì. (?)
d:PerfectPlacement.ui.hide_toast_function=Tên nội bộ của lệnh gọi đi kèm để xóa thông báo khóa và thả. (?)
d:PerfectPlacement.ui.host_class_name=Tên của widget đi kèm mà bảng hướng dẫn đặt vật gắn vào, chỉnh sửa không có tác dụng gì. (?)
d:PerfectPlacement.ui.move_step_property=Tên nội bộ của trường trong bảng hướng dẫn mang bước di chuyển hiện tại tính bằng xentimét. (?)
d:PerfectPlacement.ui.refresh_function=Tên nội bộ của lệnh gọi đi kèm để vẽ lại bảng hướng dẫn đặt vật sau một thay đổi. (?)
d:PerfectPlacement.ui.show_frozen_guide_function=Tên nội bộ của lệnh gọi đi kèm để hiện bảng hướng dẫn khi một bản xem trước đang bị khóa. (?)
d:PerfectPlacement.ui.show_frozen_toast_function=Tên nội bộ của lệnh gọi đi kèm để hiện thông báo khi một bản xem trước bị khóa. (?)
d:PerfectPlacement.ui.show_unfrozen_guide_function=Tên nội bộ của lệnh gọi đi kèm để hiện bảng hướng dẫn khi một bản xem trước không bị khóa. (?)
d:PerfectPlacement.ui.show_unfrozen_toast_function=Tên nội bộ của lệnh gọi đi kèm để hiện thông báo khi một bản xem trước được thả ra. (?)
d:PerfectPlacement.ui.use_palworld_keycaps=Vẽ các điều khiển đặt vật bằng biểu tượng phím kiểu Palworld trong bảng hướng dẫn xây dựng. (?)
d:PingMod.bypass_guild_marker_limit=Đặt được ping ngay cả khi đã chạm giới hạn dấu guild, bằng cách tạm gỡ một dấu khác đi.
d:Plasma Multicutter Damage.damage_per_hit=Mỗi đòn đánh từ Plasma Multicutter gây bao nhiêu sát thương lên kẻ địch. (?)
d:Plasma Multicutter Damage.debug_logging=Ghi thêm dòng chẩn đoán của Plasma Multicutter Damage vào log UE4SS. (?)
d:Plasma Multicutter Damage.target_cooldown_seconds=Cùng một mục tiêu phải chờ bao lâu, tính bằng giây, trước khi Plasma Multicutter có thể gây sát thương lên nó lần nữa. (?)
d:RecoverPalSpheres.debug=Ghi hoạt động thu hồi quả cầu chi tiết vào nhật ký để phục vụ báo lỗi.
d:RecoverPalSpheres.enabled=Bản sao của công tắc ghi nhật ký gỡ lỗi mà mod giữ khi đang chạy, lấy từ thiết lập chính. (?)
d:RecoverPalSpheres.max_pickup_lifetime=Số giây một vật rơi thu hồi được chờ trong thế giới, -1 giữ nó mãi mãi và 0 bỏ qua vật rơi.
d:RecoverPalSpheres.notify_inventory_return=Hiện thông báo nhận vật phẩm thông thường cho những quả cầu được trả thẳng vào túi đồ của bạn.
d:RecoverPalSpheres.return_sphere_min_distance_x=Khoảng cách ngang tối đa tính bằng mét mà tại đó một quả cầu ném trượt được để lại thành vật rơi.
d:RecoverPalSpheres.return_sphere_min_distance_y=Khoảng cách dọc tối đa tính bằng mét mà tại đó một quả cầu ném trượt được để lại thành vật rơi.
d:RecoverPalSpheres.sphere_launcher_pickups=Cho phép những phát bắn trượt của súng phóng trở thành vật rơi trong thế giới với người chơi đơn và chủ phòng co-op.
d:RecoverPalSpheres.sphere_recovery_percentage=Tỷ lệ phần trăm một Pal Sphere ném trượt được thu hồi thay vì mất đi, từ 0 đến 100.
d:ScanEffigiesBLP.base_suppress_radius=Bán kính căn cứ của bạn dùng để ẩn các cột sáng bị chặn gần căn cứ, như của Mimog.
