d:NoPalDeposit.CMD_QUERY=Tên thông điệp mạng nội bộ dùng để hỏi máy chủ về trạng thái rương, nên để nguyên. (?)
d:NoPalDeposit.CMD_STATE=Tên thông điệp mạng nội bộ mà máy chủ dùng để trả lời trạng thái rương, nên để nguyên. (?)
