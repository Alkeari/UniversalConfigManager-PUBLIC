d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.is_mobile=Coi Mimog là mục tiêu di chuyển, nên cột sáng của nó được kiểm tra lại thay vì chỉ đặt một lần. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.list_refresh_ms=Tần suất tính bằng mili giây mà danh sách ứng viên Mimog được dựng lại. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.reveal_radius=Mimog phải ở gần bao nhiêu thì cột sáng của nó mới hiện ra. (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.suppress_near_base=Ẩn cột sáng của Mimog khi bạn ở trong căn cứ, dùng bán kính ẩn gần căn cứ. (?)
d:ScanEffigiesBLP.effigy_list_refresh_ms=Tần suất tính bằng mili giây mà danh sách vật thể theo dõi được dựng lại, giá trị càng cao càng tốn ít hiệu năng nhưng phát hiện vật thể chậm hơn.
d:ScanEffigiesBLP.enable_beam_color=Tô màu mỗi cột sáng theo màu đặt cho loại của nó thay vì để mọi cột sáng cùng một màu. (?)
d:ScanEffigiesBLP.enable_beam_scale=Áp dụng hệ số chiều cao riêng của từng loại thay vì cho mọi cột sáng chiều cao mặc định. (?)
d:ScanEffigiesBLP.hotkeys.info_dump=Phím in thông tin theo dõi hiện tại của mod ra log UE4SS. (?)
d:ScanEffigiesBLP.hotkeys.rescan=Phím bắt buộc quét lại vật thể, dùng khi một cột sáng đã biến mất.
d:ScanEffigiesBLP.hotkeys.toggle_all=Phím bật tắt mọi cột sáng, chỉ ảnh hưởng tới các loại đang bật trong cấu hình.
d:ScanEffigiesBLP.max_spawns_per_frame=Số cột sáng tối đa có thể được tạo trong một khung hình, giới hạn chi phí khi có nhiều vật thể mới cùng lúc. (?)
d:ScanEffigiesBLP.mobile_check_interval_ms=Tần suất tính bằng mili giây mà các mục tiêu di chuyển như Mimog được kiểm tra lại. (?)
d:ScanEffigiesBLP.pc_check_interval=Tần suất mà mod tìm lại nhân vật người chơi. (?)
d:ScanEffigiesBLP.proximity_check_interval_ms=Tần suất tính bằng mili giây mà mod kiểm tra những gì gần bạn, giá trị càng cao càng tốn ít CPU nhưng tìm thấy chiến lợi phẩm chậm hơn một chút.
d:ScanEffigiesBLP.prune_check_interval_ms=Tần suất tính bằng mili giây mà mod tìm các cột sáng cần được loại bỏ. (?)
d:ScanEffigiesBLP.refresh_budget_per_tick=Số vật thể theo dõi mà mod làm mới mỗi tick, tác giả khuyên nên giữ trong khoảng từ 5 đến 10.
d:ScanEffigiesBLP.spawn_drain_per_tick=Số cột sáng đang chờ được tạo ra từ hàng đợi tạo mỗi tick. (?)
d:ScanEffigiesBLP.startup_delay_ms=Thời gian mà mod chờ sau khi trò chơi khởi động, tính bằng mili giây, trước khi bắt đầu quét. (?)
d:SharedXP.technology_points_per_level=Số điểm công nghệ được trao cho mỗi cấp mà một người chơi bỏ qua khi đuổi kịp kinh nghiệm chia sẻ.
d:SharedXP.verbose_logging=Ghi thông báo chi tiết về kinh nghiệm chia sẻ vào nhật ký, hữu ích khi thử nghiệm nhiều người chơi.
d:SmartPalFeeding.Feeding.AbsoluteStartEatingThreshold=Phần trăm no cố định mà tại đó một Pal căn cứ đi ăn khi dùng ngưỡng tuyệt đối. (?)
d:SmartPalFeeding.Feeding.EnableDebugLogging=Ghi từng quyết định cho ăn vào nhật ký, chỉ hữu ích khi báo cáo sự cố. (?)
d:SmartPalFeeding.Feeding.EnableMod=Bật hành vi cho ăn thông minh hơn, khi tắt sẽ giữ nguyên các ngưỡng đói của chính trò chơi. (?)
d:SmartPalFeeding.Feeding.FallbackHungerDebuffThreshold=Phần trăm đói dùng làm mức debuff khi không đọc được giá trị của chính trò chơi. (?)
d:SmartPalFeeding.Feeding.LogDecisionCooldownSeconds=Số giây giữa các dòng nhật ký cho ăn lặp lại, từ 0.1 đến 3600, để nhật ký còn dễ đọc. (?)
d:SmartPalFeeding.Feeding.StartEatingThresholdOffsetAboveHungerDebuff=Số điểm phần trăm cộng thêm trên mức debuff đói của chính trò chơi để quyết định khi nào một Pal căn cứ đi ăn.
d:SmartPalFeeding.Feeding.StopEatingThreshold=Phần trăm no mà một Pal căn cứ ăn tới trước khi quay lại làm việc, mặc định 95.
d:SmartPalFeeding.Feeding.UseAbsoluteStartEatingThreshold=Dùng một phần trăm đói bắt đầu cố định thay vì mức chênh trên mức debuff đói của trò chơi. (?)
d:SmartPalFeeding.author=Tên của người làm ra mod, giữ lại để tham khảo và chỉnh sửa không có tác dụng gì. (?)
