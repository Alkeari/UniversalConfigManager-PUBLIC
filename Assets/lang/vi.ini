d:PalInsight.badIVColor.g=Lượng xanh lục trong màu dùng cho giá trị tiềm năng thấp, từ 0 đến 1. (?)
d:PalInsight.badIVColor.r=Lượng đỏ trong màu dùng cho giá trị tiềm năng thấp, từ 0 đến 1. (?)
