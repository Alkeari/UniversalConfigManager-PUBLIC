d:BaseRenamingUtility.BASE_ATTACH_PROBE=Công cụ chẩn đoán của nhà phát triển theo dõi việc căn cứ gắn vào biểu tượng bản đồ, dùng để tìm lỗi chứ không phải để chơi. (?)
d:BaseRenamingUtility.BASE_COLOR_AUDIT=Công cụ chẩn đoán của nhà phát triển kiểm tra màu căn cứ đã lưu của bạn, dùng để tìm lỗi chứ không phải để chơi bình thường. (?)
d:BaseRenamingUtility.BASE_LOAD_PROBE=Công cụ chẩn đoán của nhà phát triển theo dõi việc căn cứ nạp lên bản đồ, dùng để tìm lỗi chứ không phải để chơi. (?)
d:BaseRenamingUtility.COLOR_PALETTE_PROBE=Công cụ chẩn đoán của nhà phát triển kết xuất bảng màu bản đồ, dùng để tìm lỗi chứ không phải để chơi bình thường. (?)
d:BaseRenamingUtility.GUILD_MARKER_PROBE=Công cụ chẩn đoán của nhà phát triển theo dõi dấu guild, dùng để tìm lỗi chứ không phải để chơi bình thường. (?)
d:BaseRenamingUtility.MAP_PANEL=Hiện bảng Vị trí đã lưu trên bản đồ, liệt kê các căn cứ và dấu đã đặt tên của bạn.
d:BaseRenamingUtility.MAP_PANEL_LIVE_SYNC=Cập nhật bảng Vị trí đã lưu ngay khi bạn đổi tên hoặc thêm một vị trí thay vì chờ lần mở bản đồ sau. (?)
d:BaseRenamingUtility.MAP_PARENT_PROBE=Công cụ chẩn đoán của nhà phát triển theo dõi bố cục màn hình bản đồ, dùng để tìm lỗi chứ không phải để chơi bình thường. (?)
d:BaseRenamingUtility.MARKER_LAYOUT_DIAGNOSTICS=Công cụ chẩn đoán của nhà phát triển ghi lại cách đặt nhãn dấu, dùng để tìm lỗi chứ không phải để chơi. (?)
d:BaseRenamingUtility.MARKER_PROBE=Công cụ chẩn đoán của nhà phát triển theo dõi dấu trên bản đồ, dùng để tìm lỗi chứ không phải để chơi bình thường. (?)
d:BaseRenamingUtility.MARKER_VISUALS=Vẽ tên bạn đã lưu lên các dấu bản đồ thay vì để chúng không có nhãn. (?)
d:BaseRenamingUtility.MODULES.MarkerImportExport=Thêm nút Xuất và Nhập để chuyển tên, màu và dấu giữa các bản lưu.
d:BaseRenamingUtility.MOD_NAME=Cái tên mà mod đóng lên các dòng nhật ký của chính nó, không ảnh hưởng đến cách nó hoạt động. (?)
d:BaseRenamingUtility.NAME_WIDGET_PROPERTY=Tên nội bộ của nhãn bản đồ mà mod ghi vào, giá trị sai sẽ khiến tên không hiện ra. (?)
d:BaseRenamingUtility.SET_CAMP_INFO=Hàm nội bộ của trò chơi mà mod lắng nghe khi bản đồ vẽ một căn cứ, tốt nhất nên để nguyên. (?)
d:BaseRenamingUtility.VERSION=Phiên bản mà mod đóng lên các dòng nhật ký của chính nó, không ảnh hưởng đến cách nó hoạt động. (?)
d:BaseRenamingUtility.g_bound_from_live_map=Ghi chú nội bộ về phím tắt đổi tên, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.h_bound_from_live_map=Ghi chú nội bộ về phím tắt đổi màu, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.hover_context_ready=Ghi chú nội bộ về việc một vị trí đang rê chuột đã sẵn sàng để thao tác hay chưa, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.key_registered=Ghi chú nội bộ về việc phím đổi tên và đổi màu đã được gán hay chưa, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.marker_hover_token=Bộ đếm nội bộ cho cái dấu bạn đang rê chuột lên ngay lúc này, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.registered=Ghi chú nội bộ về việc các hook bản đồ đã được thiết lập hay chưa, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.sequence=Bộ đếm nội bộ mà mod tăng dần khi hoạt động, chỉnh sửa không có tác dụng gì. (?)
d:BaseRenamingUtility.world_generation=Bộ đếm nội bộ theo dõi số lần thế giới được nạp lại, chỉnh sửa không có tác dụng gì. (?)
d:BaseTrimmer.BATCH_SIZE=Số công trình được dọn mỗi lượt, giá trị thấp sẽ trải đều công việc và giảm giật lag.
d:BaseTrimmer.BUILD_COMPLETE_FN=Hành động nội bộ của trò chơi mà mod lắng nghe để cây cỏ biến đi ngay khi một công trình hoàn thành. (?)
d:BaseTrimmer.BUILD_PATH_MATCH=Mảnh tên nội bộ mà mod dò khớp để phân biệt công trình do người chơi xây với phần còn lại của thế giới. (?)
d:BaseTrimmer.DEBUG=Ghi các sự kiện dọn dẹp chính và lỗi vào nhật ký để phục vụ báo lỗi.
d:BaseTrimmer.DEBUG_SCAN_LANDSCAPE_RADIUS=Tầm quét theo đơn vị trò chơi mà lần quét gỡ lỗi F7 vươn tới khi liệt kê các mesh địa hình gần đó.
d:BaseTrimmer.DISMANTLE_MODEL_FN=Hành động nội bộ của trò chơi mà mod lắng nghe để cỏ bị ẩn quay lại khi bạn tháo dỡ thứ gì đó. (?)
d:BaseTrimmer.NOTIFY_CLASS=Kiểu nội bộ mà mod theo dõi để nhận ra các công trình đứng gần bạn. (?)
d:BaseTrimmer.PERIODIC_SWEEP_MOVE_DIST=Quãng đường theo đơn vị trò chơi bạn phải đi trước khi một lượt dọn nền chạy lại, 12800 là 128 mét. (?)
d:BaseTrimmer.PERIODIC_SWEEP_MS=Số mili giây giữa các lần kiểm tra nền để dọn lại cây cỏ khi bạn di chuyển quanh một căn cứ. (?)
d:BaseTrimmer.RT_BRUSH_PATH=Địa chỉ nội bộ của hình cọ được đóng vào mặt nạ cỏ dưới mỗi công trình. (?)
d:BaseTrimmer.RT_PATH=Địa chỉ nội bộ của mặt nạ cỏ mà mod tô lên để ẩn cây cỏ dưới các công trình của bạn. (?)
d:BaseTrimmer.RT_STAMP_ROT_SIGN=Hướng xoay của dấu mặt nạ, hãy đảo nó nếu các mảng cỏ bị ẩn nằm lệch dưới công trình. (?)
d:BaseTrimmer.TELEPORT_DELAY_MS=Số mili giây chờ sau một lần dịch chuyển nhanh trước khi dọn cây cỏ ở vị trí mới. (?)
d:BaseTrimmer.USE_OVERLAP_QUERY=Xóa cây cỏ nằm trong bán kính dọn của từng công trình, lượt dọn chính của mod. (?)
d:BondalotLoadingScreen.createDesktopShortcut=Đặt một lối tắt tới trình chọn màn hình tải lên màn hình nền trong lần chạy đầu tiên.
d:BondalotLoadingScreen.customImage=Đường dẫn đầy đủ tới ảnh màn hình tải của riêng bạn, để trống sẽ dùng ảnh có sẵn.
d:BondalotLoadingScreen.showOnAnyServer=Hiện màn hình tải tùy chỉnh trên mọi máy chủ bạn tham gia, không chỉ BondAlot Island.
d:CarryWeightIncrease.vuxCheckAcknowledge=Cờ nội bộ mà mod lật khi đã áp dụng các thay đổi về trọng lượng trong phiên này. (?)
d:CarryWeightIncrease.vuxGameVersion=Phiên bản trò chơi mà mod được dựng theo, in ra lúc khởi động, không ảnh hưởng đến việc chơi. (?)
d:CarryWeightIncrease.vuxModVersion=Nhãn phiên bản của mod, in ra lúc khởi động, chỉnh sửa không có tác dụng gì. (?)
