d:SmartPalFeeding.tested_game_build_id=Bản dựng trò chơi mà tác giả thử nghiệm lần gần nhất, giữ lại để tham khảo và chỉnh sửa không có tác dụng gì. (?)
d:SmartPalFeeding.tested_game_release=Bản phát hành trò chơi mà tác giả thử nghiệm lần gần nhất, giữ lại để tham khảo và chỉnh sửa không có tác dụng gì. (?)
