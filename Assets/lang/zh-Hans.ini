d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.beam_height_scale=乘以仿声犬上方光柱的默认高度。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.detection_radius=仿声犬显示光柱的距离，用于替代默认检测距离。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.enabled=在仿声犬上方绘制光柱。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.group=仿声犬所属的切换分组，同一个快捷键可切换整组。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.is_mobile=把仿声犬当作移动目标处理，因此其光柱会被反复检测，而不是只放置一次。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.list_refresh_ms=重新生成仿声犬候选列表的频率，单位为毫秒。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.reveal_radius=仿声犬要靠近到多近，其光柱才会显示出来。 (?)
d:ScanEffigiesBLP.effigy_configs.BP_MimicDog_C.suppress_near_base=在你身处基地内时隐藏仿声犬的光柱，使用基地抑制半径判定。 (?)
d:ScanEffigiesBLP.effigy_list_refresh_ms=重新生成被追踪对象列表的频率，单位为毫秒，数值越高性能开销越低，但发现新对象也越晚。
d:ScanEffigiesBLP.enable_beam_color=按各类型设定的颜色为光柱染色，而不是所有光柱使用同一种颜色。 (?)
d:ScanEffigiesBLP.enable_beam_scale=应用各类型自身的光柱高度比例，而不是所有光柱使用默认高度。 (?)
d:ScanEffigiesBLP.hotkeys.info_dump=把模组当前的追踪信息打印到 UE4SS 日志的按键。 (?)
d:ScanEffigiesBLP.hotkeys.rescan=强制重新扫描对象的按键，用于光柱消失时使用。
d:ScanEffigiesBLP.hotkeys.toggle_all=开关全部光柱的按键，只影响配置中已启用的类型。
d:ScanEffigiesBLP.max_spawns_per_frame=单帧内最多可创建的光柱数量，用于限制一批新对象带来的开销。 (?)
d:ScanEffigiesBLP.mobile_check_interval_ms=仿声犬等移动目标被重新检测的频率，单位为毫秒。 (?)
d:ScanEffigiesBLP.pc_check_interval=模组重新查找玩家角色的频率。 (?)
d:ScanEffigiesBLP.proximity_check_interval_ms=模组检查你附近有什么的频率，单位为毫秒，数值越高越省 CPU，但发现战利品也会稍晚一些。
d:ScanEffigiesBLP.prune_check_interval_ms=模组查找应被移除的光柱的频率，单位为毫秒。 (?)
d:ScanEffigiesBLP.refresh_budget_per_tick=模组每个 tick 刷新的被追踪对象数量，作者建议保持在 5 到 10 之间。
d:ScanEffigiesBLP.spawn_drain_per_tick=每个 tick 从生成队列中创建的排队光柱数量。 (?)
d:ScanEffigiesBLP.startup_delay_ms=游戏启动后，模组开始扫描前等待的时间，单位为毫秒。 (?)
d:SharedXP.technology_points_per_level=玩家借共享经验追赶等级时，每跳过一级获得的科技点数。
d:SharedXP.verbose_logging=把详细的共享经验消息写入日志，测试多人游戏时很有用。
d:SmartPalFeeding.Feeding.AbsoluteStartEatingThreshold=使用绝对阈值时，据点帕鲁前去进食的固定饱食度百分比。 (?)
d:SmartPalFeeding.Feeding.EnableDebugLogging=把每一次进食决策写入日志，仅在报告问题时有用。 (?)
d:SmartPalFeeding.Feeding.EnableMod=启用更聪明的进食行为，关闭时保留游戏自身的饥饿阈值。 (?)
d:SmartPalFeeding.Feeding.FallbackHungerDebuffThreshold=无法读取游戏自身数值时，用作减益等级的饥饿百分比。 (?)
d:SmartPalFeeding.Feeding.LogDecisionCooldownSeconds=重复的进食日志行之间的秒数，范围 0.1 到 3600，用于保持日志可读。 (?)
d:SmartPalFeeding.Feeding.StartEatingThresholdOffsetAboveHungerDebuff=在游戏自身饥饿减益等级之上增加的百分点，用于决定据点帕鲁何时前去进食。
d:SmartPalFeeding.Feeding.StopEatingThreshold=据点帕鲁吃到多少饱食度百分比后回去工作，默认 95。
d:SmartPalFeeding.Feeding.UseAbsoluteStartEatingThreshold=使用固定的起始饥饿百分比，而不是相对游戏饥饿减益等级的偏移量。 (?)
d:SmartPalFeeding.author=制作该模组的人的名字，仅作参考，编辑它没有任何作用。 (?)
d:SmartPalFeeding.name=模组为自己记录的显示名称，仅作参考，编辑它没有任何作用。 (?)
d:SmartPalFeeding.package_name=模组安装所用的文件夹名称，仅作参考，编辑它没有任何作用。 (?)
d:SmartPalFeeding.tested_game_build_id=作者最后测试所用的游戏版本号，仅作参考，编辑它没有任何作用。 (?)
d:SmartPalFeeding.tested_game_release=作者最后测试所用的游戏发行版本，仅作参考，编辑它没有任何作用。 (?)
d:SmartPalFeeding.version=模组为自己记录的版本号，仅作参考，编辑它没有任何作用。 (?)
d:SmoothBossBattles.AutoConfirm_BossTower=进入高塔 BOSS 战时替你确认战斗开始提示。
d:SmoothBossBattles.AutoConfirm_RaidBoss=在召唤祭坛发起突袭 BOSS 战时替你确认战斗开始提示。
d:SmoothBossBattles.AutoConfirm_WorldTree=进入世界树 BOSS 战时替你确认战斗开始提示。
d:SmoothBossBattles.SkipIntroCutscene_BossTower=跳过进入高塔 BOSS 战途中播放的过场动画。
d:SmoothBossBattles.SkipVictoryWait_BossTower=让你在战胜高塔 BOSS 后立即离开而无需等待，仅限单人。
d:SmoothBossBattles.SkipVictoryWait_WorldTree=让你在击败三个中段世界树 BOSS 之一后立即离开，仅限单人。
d:SmoothBossBattles.SkipVictoryWait_WorldTreeFinal=让你在击败最终世界树 BOSS 后立即离开，这会中断游戏的结局演出。
d:SmoothBossBattles.enabled=启用作者的开发用日志功能，它默认关闭，正常游玩也应保持关闭。
d:TidyBaseInfo.cursorGraceTicks=你移开面板后自由光标还能挺过多少次维护轮询，好让你移到菜单的途中它不会中断。
d:TidyBaseInfo.emptyPortraitScale=空工作格中绘制的占位圆圈的大小倍率。
d:TidyBaseInfo.fallback.menu_assign=分配这项操作的英文措辞，只有在读不到模组的语言文件时才会用到。
d:TidyBaseInfo.fallback.menu_palbox=送入帕鲁盒子这项操作的英文措辞，只有在读不到模组的语言文件时才会用到。
d:TidyBaseInfo.fallback.menu_resummon=重新召唤这项操作的英文措辞，只有在读不到模组的语言文件时才会用到。
d:TidyBaseInfo.gridOffsetX=帕鲁网格在据点工作信息面板内的水平位置，单位为屏幕单位。
d:TidyBaseInfo.gridOffsetY=把帕鲁网格向下移动，负值则向上，单位为像素。
d:TidyBaseInfo.gridWidth=帕鲁网格的宽度，单位为屏幕单位，在默认图标大小下每行足够放下四个头像。
d:TidyBaseInfo.hoverPanelOffsetX=位于帕鲁网格下方的详情面板的水平微调，单位为屏幕单位。
d:TidyBaseInfo.hoverPanelOffsetY=帕鲁网格底部与其下方悬停状态行之间的间距，单位为像素。
d:TidyBaseInfo.iconPadding=网格中帕鲁格子之间留出的间距，单位为屏幕单位，横竖两个方向都适用。
d:TidyBaseInfo.iconSize=网格中单个帕鲁格子的边长，单位为屏幕单位，默认网格宽度正好放得下四个。
d:TidyBaseInfo.inspectHoldKey=按住即可快速查看的按键，在松开之前让鼠标光标在网格上自由移动。
d:TidyBaseInfo.inspectKey=在面板上开启自由鼠标光标的按键，再次按下即关闭，留空则停用。
d:TidyBaseInfo.keybindModifier=与滚动键和查看键一起按住的修饰键；填 NONE 则单独使用这些按键。
d:TidyBaseInfo.language=这个模组显示自身标签所用的语言；填 auto 则跟随游戏自己的语言设置。
d:TidyBaseInfo.liveReloadSeconds=这个模组每隔多少秒重新读取一次自己的文件，看你有没有改动，这样改动在游戏中就会生效；设为 0 会停止监视，直到下次启动。
d:TidyBaseInfo.maintenanceMs=重新折叠游戏自身工作行并跟踪光标所指内容的维护轮询间隔，单位为毫秒。
d:TidyBaseInfo.maxGridHeight=帕鲁网格可以增长到的最大高度，单位为像素，超过后网格会在自身内部滚动，而不是遮挡快捷栏。
d:TidyBaseInfo.menuItemGap=右键操作菜单各条目之间的间距，单位为像素。
d:TidyBaseInfo.menuItemPadding=右键操作菜单中每个标签上下两侧的留白，单位为像素。
d:TidyBaseInfo.menuItemPaddingX=右键操作菜单中每个标签左右两侧的留白，单位为像素。
d:TidyBaseInfo.menuItemPaddingY=右键操作菜单中每个标签上下两侧的留白，单位为像素。
d:TidyBaseInfo.menuOffsetX=帕鲁网格与在其旁边打开的右键操作菜单之间的间距，单位为像素。
d:TidyBaseInfo.menuOffsetY=右键操作菜单相对帕鲁网格顶部的垂直微调，单位为屏幕单位。
d:TidyBaseInfo.menuWidth=右键操作菜单的宽度，单位为像素，当翻译后的标签被截断时调大。
d:TidyBaseInfo.openDetailsOnClick=点击帕鲁时打开游戏完整的帕鲁详情界面；关闭则改为把该帕鲁的名字和状态钉在网格下方。
d:TidyBaseInfo.portraitOffsetX=在各自的单元格内把每个帕鲁头像向右推移，负值则向左。
d:TidyBaseInfo.portraitOffsetY=在各自的单元格内把每个帕鲁头像向下推移，负值则向上。
d:TidyBaseInfo.portraitScale=帕鲁头像在其网格单元内的大小倍率，1.0 为游戏绘制的原始大小。
d:TidyBaseInfo.resummonTimeoutMs=Resummon 等待帕鲁抵达帕鲁盒子的时长，超时后就放弃并安全地把它留在原地。
d:TidyBaseInfo.scrollDownKey=与 Alt 一同按下的按键，用于把帕鲁网格向下滚动一步。
d:TidyBaseInfo.scrollStepPx=用键盘滚动一步时帕鲁网格移动的距离，单位为屏幕单位。
d:TidyBaseInfo.scrollUpKey=与上方修饰键一起按下、把帕鲁网格向上滚动一步的按键，留空则停用。
d:TidyBaseInfo.showEmptySlots=把空的工作格显示为占位圆圈；关闭则网格中只有你自己的帕鲁。
d:TidyBaseInfo.suspendInputOverPanel=当光标位于面板上方时，暂停切换武器、瞄准、射击和帕鲁指令。
d:TidyBaseInfo.tokens.deepGraphite=右键操作菜单背后底板的十六进制颜色。
d:TidyBaseInfo.tokens.forgedGold=鼠标所指的操作菜单条目边框的十六进制颜色。
d:TidyBaseInfo.tokens.hairline=菜单底板及其每个条目周围细线的十六进制颜色。
d:TidyBaseInfo.tokens.raised=填充右键操作菜单单个条目的十六进制颜色。
d:TidyBaseInfo.tokens.raisedHover=填充鼠标所指的操作菜单条目的十六进制颜色。
d:UMJItemFilter.CaptureGameInput=过滤器窗口打开时屏蔽游戏自身的键盘快捷键，以便你能在其中输入。
d:UMJItemFilter.ChestFilter=把未勾选的宝箱奖励归还到开箱玩家脚下的地面上。
d:UMJItemFilter.EnableMouse=让你可以用鼠标操作过滤器窗口。 (?)
d:UMJItemFilter.EnforceFilter=自动拾取时把未勾选的物品留在地上，等待你手动拾取。
d:UMJItemFilter.LeftMargin=设置过滤器窗口左边缘保留的间距。 (?)
d:UMJItemFilter.OpenKey=打开和关闭物品过滤器窗口的按键，默认是反斜杠。
d:UMJItemFilter.PanelScale=缩放过滤器窗口在屏幕上的大小。 (?)
d:UMJItemFilter.RecentItemLimit=过滤器窗口列出的最近唯一拾取物品数量，供你更改其状态，默认是十个。
d:UMJItemFilter.RememberSelection=重新打开过滤器窗口时，定位到上次选中的物品。 (?)
d:UltraGraphics.State.ChangelogShownFor=模组上次显示更新日志所对应的版本，由模组而非你写入。 (?)
d:UltraGraphics.State.PerformanceMode=当前是否开启性能模式，由模组而非你写入。 (?)
d:UnsheathedKatanaMercy.ENABLE_LOGGING=把模组自身的信息写入 UE4SS 日志，便于排查问题。 (?)
d:UnsheathedKatanaMercy.RESET_LIMIT=拔刀太刀任务链可被重置的次数，0 表示关闭任务重置。
d:vuxRemoveFlyingStamina.vuxCheckAcknowledge=模组在本次会话应用飞行改动后翻转的内部标记。 (?)
d:vuxRemoveFlyingStamina.vuxFlyHorizon_Dash_SP=骑乘飞行坐骑向前加速时每秒消耗的耐力，0 表示不消耗。 (?)
d:vuxRemoveFlyingStamina.vuxFlyHover_SP=骑乘飞行坐骑原地悬停时每秒消耗的耐力，0 表示不消耗。 (?)
d:vuxRemoveFlyingStamina.vuxFlyMaxHeight=飞行坐骑可达到的最大高度，单位为世界单位。 (?)
d:vuxRemoveFlyingStamina.vuxFlyVertical_SP=垂直上升或下降飞行时每秒消耗的耐力，0 表示不消耗。 (?)
d:vuxRemoveFlyingStamina.vuxGameVersion=模组所针对的游戏版本，启动时打印，不影响游玩。 (?)
d:vuxRemoveFlyingStamina.vuxModVersion=模组的版本标签，启动时打印，编辑它没有任何作用。 (?)
