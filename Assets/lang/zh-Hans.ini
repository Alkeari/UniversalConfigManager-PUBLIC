d:AntiPhatPalResizing.Party.Scales.M=队伍中中型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Party.Scales.S=队伍中小型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Party.Scales.XL=队伍中超大型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Party.Scales.XS=队伍中超小型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Party.SizeThreshold=队伍中参与缩放的最小体型等级，从 XS 到 XL，设为 M 时 XS 和 S 帕鲁保持原样。
d:AntiPhatPalResizing.PersistentScale=在抚摸、喂食或表情动作重置体型后重新应用，这主要在角色模式下有意义。
d:AntiPhatPalResizing.ReloadHotkey=启用一个按键，可在游戏中重新载入设置并重新检查每只帕鲁的体型。
d:AntiPhatPalResizing.ResizeBossAndShiny=允许头目与闪光帕鲁按下方比例缩放，而不是保持它们自己的体型。
d:AntiPhatPalResizing.ResizeHumanPals=让被捕获的人类 NPC，例如辛迪加成员和商人，与你的帕鲁一起缩小。
d:AntiPhatPalResizing.ResizePals=缩放总开关，关闭后只保留头目与闪光的体型标准化。
d:AntiPhatPalResizing.SizeMode=选择网格缩放（只缩小可见模型）或角色缩放（同时缩小碰撞体积）。
d:AntiPhatPalResizing.Wild.BossScale=开启头目与闪光独立缩放时，野外头目帕鲁使用的缩放比例。
d:AntiPhatPalResizing.Wild.CustomScales.G1=野外自定义分组 1 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G10=野外自定义分组 10 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G2=野外自定义分组 2 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G3=野外自定义分组 3 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G4=野外自定义分组 4 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G5=野外自定义分组 5 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G6=野外自定义分组 6 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G7=野外自定义分组 7 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G8=野外自定义分组 8 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.CustomScales.G9=野外自定义分组 9 内帕鲁种类使用的缩放比例，该分组不受体型阈值限制。
d:AntiPhatPalResizing.Wild.Enabled=为在世界中漫游的野生帕鲁开启缩放，使用本组设定的比例。
d:AntiPhatPalResizing.Wild.LuckyScale=开启头目与闪光独立缩放时，野外闪光幸运帕鲁使用的缩放比例。
d:AntiPhatPalResizing.Wild.NPCScale=开启人类独立缩放时，野外被捕获 NPC 使用的缩放比例。
d:AntiPhatPalResizing.Wild.Scales.L=野外大型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Wild.Scales.M=野外中型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Wild.Scales.S=野外小型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Wild.Scales.XL=野外超大型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Wild.Scales.XS=野外超小型帕鲁的缩放比例，1.0 为原始大小，0.5 为一半大小。
d:AntiPhatPalResizing.Wild.SizeThreshold=野外参与缩放的最小体型等级，从 XS 到 XL，设为 M 时 XS 和 S 帕鲁保持原样。
d:AntiWasteDisassembleItems.COLLAPSED=界面用来表示某个部件被隐藏且不占空间的数字，由游戏固定。 (?)
d:AntiWasteDisassembleItems.DestroyRemainder=销毁整叠拆解无法拆分的零头，而不是留在格子里，且不返还材料。
d:AntiWasteDisassembleItems.HIDDEN=界面用来表示某个部件不可见但仍占据空间的数字。 (?)
d:AntiWasteDisassembleItems.HIT_TEST_INVISIBLE=界面用来表示某个部件可见但不响应点击的数字，由游戏固定。 (?)
d:AntiWasteDisassembleItems.Language=模组按钮与消息使用的语言，auto 表示跟随游戏自身的语言设置。
d:AntiWasteDisassembleItems.MaterialRecoveryRate=拆解时返还材料的比例，0 表示按剩余耐久度折算返还。
d:AntiWasteDisassembleItems.UseSubTypes=用细分子类型列表而不是宽泛的分类列表来限定可拆解的物品。
d:AntiWasteDisassembleItems.VERB_ITEM=模组给单件物品拆解按钮加上的短标签，以便之后识别点击。 (?)
d:AntiWasteDisassembleItems.VERB_STACK=模组给整叠物品拆解按钮加上的短标签，以便之后识别点击。 (?)
d:AntiWasteDisassembleItems.VISIBLE=界面用来表示某个部件可见的数字，由游戏固定，并非一项设置。 (?)
d:AutoHealWorkers.DiagnosticKey=把模组当前动作写入 UE4SS 日志的按键。 (?)
d:AutoHealWorkers.Enabled=让游戏启动时自动开启基地工作帕鲁的自动治疗。 (?)
d:AutoHealWorkers.MaxPalsPerScan=模组单次扫描处理的帕鲁数量，避免大型基地出现卡顿。 (?)
d:AutoHealWorkers.ScanIntervalMs=模组检查基地工作帕鲁受伤情况的频率，单位为毫秒。 (?)
d:AutoHealWorkers.ToggleKey=游玩时开关基地工作帕鲁自动治疗的按键。 (?)
d:AutoSanityCare.DiagnosticKey=把模组当前动作写入 UE4SS 日志的按键。 (?)
d:AutoSanityCare.Enabled=让游戏启动时自动开启基地工作帕鲁的自动安定护理。 (?)
d:AutoSanityCare.MaxPalsPerScan=模组单次扫描处理的帕鲁数量，避免大型基地出现卡顿。 (?)
d:AutoSanityCare.SanityFloor=工作帕鲁的安定值需要降到该值以下，模组才会介入。 (?)
d:AutoSanityCare.ScanIntervalMs=模组检查基地工作帕鲁安定值过低的频率，单位为毫秒。 (?)
d:AutoSanityCare.ToggleKey=游玩时开关自动安定护理的按键。 (?)
d:BaseCampEggBonus.AlphaEnabled=让分配到基地的红樱萝莉将你在那里拾取的蛋变为阿尔法蛋。
d:BaseCampEggBonus.Enabled=开启或关闭整个模组。 (?)
d:BaseCampEggBonus.ExtraEggEnabled=让分配到基地的青蛙将在那里拾取帕鲁蛋时额外多给一颗蛋。
d:BaseCampEggBonus.Language=设置模组自身消息使用的语言。
d:BaseCampEggBonus.ToggleAlphaKey=开关阿尔法蛋转换效果的快捷键，默认是 Ctrl 加 L。
d:BaseCampEggBonus.ToggleBothKey=同时开关额外蛋和阿尔法转换效果的快捷键。 (?)
d:BaseCampEggBonus.ToggleExtraKey=开关额外蛋效果的快捷键，默认是 Ctrl 加 K。
d:BaseCampEggBonus.Verbose=把额外的模组信息写入 UE4SS 日志，便于排查问题。 (?)
d:BasePalSpawnImprovements.Batching.BatchDelayMs=据点载入时，每批据点帕鲁生成之间等待的毫秒数。
d:BasePalSpawnImprovements.Batching.BatchSize=据点载入时，每一批生成的据点帕鲁数量。
d:BasePalSpawnImprovements.General.Enabled=把据点帕鲁的生成分批进行，关闭则恢复一次性全部生成。
