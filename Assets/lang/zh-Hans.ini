d:BaseRenamingUtility.BASE_ATTACH_PROBE=开发者诊断功能，追踪据点附加到地图图标的过程，用于查错而非游玩。 (?)
d:BaseRenamingUtility.BASE_COLOR_AUDIT=开发者诊断功能，检查你保存的据点颜色，用于查错而非正常游玩。 (?)
d:BaseRenamingUtility.BASE_LOAD_PROBE=开发者诊断功能，追踪据点载入到地图的过程，用于查错而非游玩。 (?)
d:BaseRenamingUtility.COLOR_PALETTE_PROBE=开发者诊断功能，导出地图调色板，用于查错而非正常游玩。 (?)
d:BaseRenamingUtility.GUILD_MARKER_PROBE=开发者诊断功能，追踪公会标记，用于查错而非正常游玩。 (?)
d:BaseRenamingUtility.MAP_PANEL=在地图上显示「已保存地点」面板，列出你命名的据点与标记。
d:BaseRenamingUtility.MAP_PANEL_LIVE_SYNC=在你重命名或添加地点时即时更新「已保存地点」面板，而不是等到下次打开地图。 (?)
d:BaseRenamingUtility.MAP_PARENT_PROBE=开发者诊断功能，追踪地图界面布局，用于查错而非正常游玩。 (?)
d:BaseRenamingUtility.MARKER_LAYOUT_DIAGNOSTICS=开发者诊断功能，记录标记标签的摆放方式，用于查错而非游玩。 (?)
d:BaseRenamingUtility.MARKER_PROBE=开发者诊断功能，追踪地图标记，用于查错而非正常游玩。 (?)
d:BaseRenamingUtility.MARKER_VISUALS=把你保存的名称绘制到地图标记上，而不是让它们没有标签。 (?)
d:BaseRenamingUtility.MODULES.MarkerImportExport=添加导出与导入按钮，用于在存档之间迁移名称、颜色和标记。
d:BaseRenamingUtility.MOD_NAME=模组打在自己日志行上的名称，不影响它的行为。 (?)
d:BaseRenamingUtility.NAME_WIDGET_PROPERTY=模组写入的地图标签的内部名称，填错会导致名称不显示。 (?)
d:BaseRenamingUtility.SET_CAMP_INFO=地图绘制据点时模组监听的游戏内部函数，最好保持原样。 (?)
d:BaseRenamingUtility.VERSION=模组打在自己日志行上的版本号，不影响它的行为。 (?)
d:BaseRenamingUtility.g_bound_from_live_map=记录重命名按键绑定的内部信息，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.h_bound_from_live_map=记录颜色按键绑定的内部信息，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.hover_context_ready=记录悬停位置是否已可操作的内部信息，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.key_registered=记录重命名与颜色按键是否已绑定的内部信息，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.marker_hover_token=记录你当前悬停标记的内部计数器，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.registered=记录地图挂钩是否已设置的内部信息，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.sequence=模组运行过程中递增的内部计数器，编辑它没有任何作用。 (?)
d:BaseRenamingUtility.world_generation=记录世界重新载入次数的内部计数器，编辑它没有任何作用。 (?)
d:BaseTrimmer.BATCH_SIZE=每一轮处理的建筑数量，调低可分摊工作量、减轻卡顿。
d:BaseTrimmer.BUILD_COMPLETE_FN=模组监听的游戏内部动作，使建筑完成的瞬间清除植被。 (?)
d:BaseTrimmer.BUILD_PATH_MATCH=模组用于把玩家建造物与世界其余部分区分开的内部名称片段。 (?)
d:BaseTrimmer.DEBUG=把关键的清理事件与错误写入日志，以便提交错误报告。
d:BaseTrimmer.DEBUG_SCAN_LANDSCAPE_RADIUS=F7 调试扫描列出附近地形网格时的范围，单位为游戏单位。
d:BaseTrimmer.DISMANTLE_MODEL_FN=模组监听的游戏内部动作，使你拆除建筑时被隐藏的草恢复。 (?)
d:BaseTrimmer.NOTIFY_CLASS=模组监视的内部类型，用于察觉你附近的建筑。 (?)
d:BaseTrimmer.PERIODIC_SWEEP_MOVE_DIST=触发后台重新清理前你必须移动的距离，单位为游戏单位，12800 约合 128 米。 (?)
d:BaseTrimmer.PERIODIC_SWEEP_MS=你在据点周围移动时，后台检查并重新清理植被的间隔毫秒数。 (?)
d:BaseTrimmer.RT_BRUSH_PATH=印在每座建筑下方草地遮罩中的笔刷形状的内部地址。 (?)
