d:PalBoxQoL.DEV_DEBUG_MODE_ENABLED=启用作者的开发用按键绑定与探测工具，正常游玩时应关闭。
d:PalBoxQoL.LOCAL_MARKER=模组用来找到本地帕鲁盒子列表而非全局列表的内部名称。
d:PalBoxQoL.alphaIndex=工具栏当前所处的底板明暗列表位置，每次游玩都会重置。 (?)
d:PalBoxQoL.button.label.A=本模组所加按钮上文字的不透明度，0 为全透明，1 为实心。 (?)
d:PalBoxQoL.button.label.B=本模组所加按钮上文字颜色中的蓝色分量，范围 0 到 1。 (?)
d:PalBoxQoL.button.label.G=本模组所加按钮上文字颜色中的绿色分量，范围 0 到 1。 (?)
d:PalBoxQoL.button.label.R=本模组所加按钮上文字颜色中的红色分量，范围 0 到 1。 (?)
d:PalBoxQoL.button.layout.hAlign=新增按钮在水平方向上的对齐方式，作者要求设为 1（左对齐），因为填充会把按钮拉满整行并吞掉游戏自带的文字。
d:PalBoxQoL.button.layout.padX=每个新增按钮左右两侧的内边距，以像素计，上下内边距保持为 0，以便按钮填满整行。
d:PalBoxQoL.button.layout.sizeRule=新增按钮在行内确定自身大小的方式，设为 0 会填满空间并与游戏自带按钮等高。
d:PalBoxQoL.button.layout.vAlign=新增按钮在垂直方向上的对齐方式，0 会填满并与游戏自带按钮等高，2 会居中而让按钮偏矮。
d:PalBoxQoL.button.layout.weight=当大小规则设为填充时，每个新增按钮占用行内剩余宽度的比重。 (?)
d:PalBoxQoL.glyphIndex=清除按钮图标当前所处的符号列表位置，每次游玩都会重置。 (?)
d:PalBoxQoL.pacing.batchSize=批量运行时每批发送的收藏切换数量，调低对游戏更温和。
d:PalBoxQoL.pacing.delayMs=每批收藏切换之间的毫秒数，若批量运行卡顿可调高。
d:PalBoxQoL.pacing.importBatch=每一步导入的帕鲁数量，必须保持为 1，因为调高正是导入出问题的原因。
d:PalBoxQoL.pacing.importDelayMs=导入帕鲁之间的毫秒数，若运行摘要报告有导入被拒可调高。
d:PalBoxQoL.pairIndex=被替换的搜索与排序标题当前所处的图标列表位置。 (?)
d:PalBoxQoL.transfer.export.bForceExport=即使游戏通常会拒绝，也照样导出帕鲁。
d:PalBoxQoL.transfer.export.bRemoveOldData=导出时替换已保存的原有条目，而不是在旁边另加一条，这层含义连模组作者自己也只记为推测而非确定。 (?)
d:PalBoxQoL.transfer.import.bOverwriteData=导入时覆盖游戏中已有的条目，而不是保留它。
d:PalEggInfo.EnableMod=在不卸载模组的情况下关闭蛋的信息显示。 (?)
d:PalInsight.activationMode=通过快捷键打开检视面板，或改为跟随你当前的瞄准。
d:PalInsight.activeAbilitiesThreshold=主动技能的遗留捕获要求，保持为零，由渐进揭示数值决定。 (?)
d:PalInsight.aimTriggerMode=选择哪种瞄准会显示面板：武器、投掷帕鲁球，或两者皆可。
d:PalInsight.analyzeHumans=允许像检视帕鲁一样检视人类。 (?)
d:PalInsight.badIVColor.a=低潜力值所用颜色的不透明度，0 为全透明，1 为不透明。 (?)
d:PalInsight.badIVColor.b=低潜力值所用颜色中的蓝色分量，范围 0 到 1。 (?)
d:PalInsight.badIVColor.g=低潜力值所用颜色中的绿色分量，范围 0 到 1。 (?)
d:PalInsight.badIVColor.r=低潜力值所用颜色中的红色分量，范围 0 到 1。 (?)
d:PalInsight.badIVThreshold=潜力值不高于该数字时使用低值颜色，范围 0 到 100。
d:PalInsight.colorCodeIVs=按每项潜力值的高低为其着色。
d:PalInsight.countAlphasSeparate=在同种族帕鲁盒子统计中把头目帕鲁算作独立种族。 (?)
d:PalInsight.displayStyle=按住快捷键时显示面板、按一下切换显示，或始终显示。
d:PalInsight.distance=最大检视距离，单位为厘米，范围 1000 到 500000，30000 约合 300 米。
d:PalInsight.followOffsetX=面板相对于其跟随帕鲁的水平像素偏移，正值向右。 (?)
d:PalInsight.followOffsetY=面板相对于其跟随帕鲁的垂直像素偏移，负值向上。 (?)
d:PalInsight.followPal=遗留的跟随开关，会被面板位置选项覆盖，因此编辑它不会有任何变化。
d:PalInsight.goodIVColor.a=高潜力值所用颜色的不透明度，0 为全透明，1 为不透明。 (?)
d:PalInsight.goodIVColor.b=高潜力值所用颜色中的蓝色分量，范围 0 到 1。 (?)
d:PalInsight.goodIVColor.g=高潜力值所用颜色中的绿色分量，范围 0 到 1。 (?)
d:PalInsight.goodIVColor.r=高潜力值所用颜色中的红色分量，范围 0 到 1。 (?)
d:PalInsight.goodIVThreshold=潜力值不低于该数字时使用高值颜色，范围 0 到 100。
d:PalInsight.highPotentialAttackThreshold=帕鲁需要达到的攻击潜力，范围 0 到 100，达到后才显示绿色高潜力光柱。
d:PalInsight.highPotentialDefenseThreshold=帕鲁需要达到的防御潜力，范围 0 到 100，达到后才显示绿色高潜力光柱。
d:PalInsight.highPotentialHpThreshold=帕鲁需要达到的生命值潜力，范围 0 到 100，达到后才显示绿色高潜力光柱。
d:PalInsight.iVFontSizeDelta=在默认基础上上调或下调潜力值的字号。 (?)
d:PalInsight.iVSeparator=检视面板中用于分隔各项潜力值的字符。 (?)
d:PalInsight.iVTypeFace=检视面板中潜力值使用的字重。 (?)
d:PalInsight.iVsThreshold=潜力的遗留捕获要求，保持为零，由渐进揭示数值决定。 (?)
d:PalInsight.inspectAlt=检视准星下帕鲁的按键需要同时按住 Alt。 (?)
d:PalInsight.inspectCtrl=检视准星下帕鲁的按键需要同时按住 Ctrl。 (?)
d:PalInsight.inspectGamepadKey=检视准星下帕鲁的手柄按键，None 表示不绑定。
d:PalInsight.inspectKey=检视准星下帕鲁的键盘或鼠标按键。
d:PalInsight.inspectShift=检视准星下帕鲁的按键需要同时按住 Shift。 (?)
d:PalInsight.nativePotentialPalbox=不佩戴帕鲁驯养师护目镜也能在帕鲁盒子中显示潜力。
d:PalInsight.nativePotentialVision=不佩戴帕鲁驯养师护目镜也能显示潜力，适用于下方启用的界面。
d:PalInsight.nativePotentialWorld=不佩戴帕鲁驯养师护目镜也能在世界中的生命值条上显示潜力。
d:PalInsight.neutralIVColor.a=中等潜力值所用颜色的不透明度，0 为全透明，1 为不透明。 (?)
d:PalInsight.neutralIVColor.b=中等潜力值所用颜色中的蓝色分量，范围 0 到 1。 (?)
d:PalInsight.neutralIVColor.g=中等潜力值所用颜色中的绿色分量，范围 0 到 1。 (?)
d:PalInsight.neutralIVColor.r=中等潜力值所用颜色中的红色分量，范围 0 到 1。 (?)
d:PalInsight.opacity=检视面板的不透明度，从 0.4 的浅淡到 1.0 的实心。
d:PalInsight.palboxSearchAlt=在搜索输入与帕鲁浏览之间切换的按键需要同时按住 Alt。 (?)
d:PalInsight.palboxSearchCondenserEnabled=在帕鲁凝聚器界面加入搜索行。
d:PalInsight.palboxSearchCtrl=在搜索输入与帕鲁浏览之间切换的按键需要同时按住 Ctrl。 (?)
d:PalInsight.palboxSearchDisassemblyEnabled=在帕鲁解体传送带界面加入搜索行。
d:PalInsight.palboxSearchExpeditionEnabled=在帕鲁远征队据点界面加入搜索行。
d:PalInsight.palboxSearchShift=在搜索输入与帕鲁浏览之间切换的按键需要同时按住 Shift。 (?)
d:PalInsight.panelScale=检视面板的大小百分比，范围 40 到 100。
d:PalInsight.passiveAbilitiesThreshold=被动技能的遗留捕获要求，保持为零，由渐进揭示数值决定。 (?)
d:PalInsight.potentialDisplayRule=通过模组开关显示潜力，或仅在佩戴帕鲁驯养师护目镜时显示。
d:PalInsight.potentialVisionAlt=未装备护目镜时显示潜力的按键需要同时按住 Alt。 (?)
d:PalInsight.potentialVisionCtrl=未装备护目镜时显示潜力的按键需要同时按住 Ctrl。 (?)
d:PalInsight.potentialVisionShift=未装备护目镜时显示潜力的按键需要同时按住 Shift。 (?)
d:PalInsight.progressiveActiveThreshold=需要捕获某种族多少只后才揭示它的主动技能，范围 0 到 999。
d:PalInsight.progressiveDropsThreshold=需要捕获某种族多少只后才揭示它的掉落物，范围 0 到 999。
d:PalInsight.progressiveMovementThreshold=需要捕获某种族多少只后才揭示它的移动速度，范围 0 到 999。
d:PalInsight.progressivePartnerThreshold=需要捕获某种族多少只后才揭示它的伙伴技能，范围 0 到 999。
d:PalInsight.progressivePassiveThreshold=需要捕获某种族多少只后才揭示它的被动技能，范围 0 到 999。
d:PalInsight.progressivePotentialThreshold=需要捕获某种族多少只后才揭示它的潜力，范围 0 到 999。
d:PalInsight.progressiveWorkThreshold=需要捕获某种族多少只后才揭示它的工作适性，范围 0 到 999。
d:PalInsight.rampagingPalBeaconEnabled=用红色光柱标记附近的狂暴帕鲁。
d:PalInsight.rarePalBeaconEnabled=用金色光柱标记附近的幸运帕鲁。
d:PalInsight.realtimeSpeedOffsetY=正值时把实时速度读数下移，安全范围为 -300 到 20。
d:PalInsight.settingsAlt=打开 Pal Insight 窗口的设置按键需要同时按住 Alt。 (?)
d:PalInsight.settingsCtrl=打开 Pal Insight 窗口的设置按键需要同时按住 Ctrl。 (?)
d:PalInsight.settingsGamepadKey1=打开 Pal Insight 设置窗口的手柄按键组合中的第一个按键。
d:PalInsight.settingsGamepadKey2=打开 Pal Insight 设置窗口的手柄按键组合中的第二个按键。
d:PalInsight.settingsSchemaVersion=已保存设置结构的版本戳，用于升级旧文件，编辑它没有任何作用。 (?)
d:PalInsight.settingsShift=打开 Pal Insight 窗口的设置按键需要同时按住 Shift。 (?)
d:PalInsight.showActive=在检视面板中显示主动技能。
d:PalInsight.showCaptureCount=游戏自身分析功能需要保持开启的内部开关，因此不适合改动。
d:PalInsight.showDrops=在检视面板中显示帕鲁的掉落物。
d:PalInsight.showIVBonus=在检视面板中显示潜力为每项核心属性带来的加成。 (?)
d:PalInsight.showMovementSpeed=在检视面板中显示坐骑的移动速度。
d:PalInsight.showPalsInBox=浏览帕鲁盒子时显示你已经拥有多少只同种族帕鲁。
d:PalInsight.showPartnerSkill=在检视面板中显示伙伴技能。
d:PalInsight.showPassive=在检视面板中显示被动技能。
d:PalInsight.showPotential=在检视面板中显示三项潜力值。
d:PalInsight.showRealtimeSpeed=在 HUD 左下角显示你的实时角色或坐骑速度。
d:PalInsight.showWork=在检视面板中显示工作适性。
d:PalInsight.staticOffsetX=面板处于固定屏幕位置时的水平像素偏移。 (?)
d:PalInsight.staticOffsetY=面板处于固定屏幕位置时的垂直像素偏移。 (?)
d:PalInsight.statsThreshold=游戏自身分析功能中属性的遗留捕获要求，保持为零。 (?)
d:PalInsight.timeToHold=检视快捷键需按住多少秒后面板才会出现。 (?)
d:PalInsightQuickStack.Alt=要求配合快速堆叠快捷键同时按住 Alt。 (?)
d:PalInsightQuickStack.Ctrl=要求配合快速堆叠快捷键同时按住 Ctrl。 (?)
d:PalInsightQuickStack.Shift=要求配合快速堆叠快捷键同时按住 Shift。 (?)
d:PalInsightQuickStack.statuses.down=你已给模组投反对票时使用的状态代码。 (?)
d:PalInsightQuickStack.statuses.noVote=你尚未对模组投票时使用的状态代码。 (?)
d:PalInsightQuickStack.statuses.querying=正在请求创意工坊投票状态时使用的状态代码。 (?)
d:PalInsightQuickStack.statuses.settingUp=正在提交赞成票时使用的状态代码。 (?)
d:PalInsightQuickStack.statuses.unavailable=无法读取创意工坊投票状态时使用的状态代码。 (?)
d:PalInsightQuickStack.statuses.up=你已给模组投赞成票时使用的状态代码。 (?)
d:PalLevelScaling.configAutoReloadEnabled=游戏运行时重新检查设置，使改动无需重启即可影响此后的生成。
d:PalLevelScaling.configAutoReloadIntervalSeconds=重新检查设置有无改动的间隔秒数，默认 300。
d:PalLevelScaling.decisionLogRetentionCount=删除较旧的生成决策日志文件时保留的数量。
d:PalLevelScaling.decisionLogRetentionEnabled=删除较旧的生成决策日志文件，只保留最新的几份。
d:PalLevelScaling.despawnDistanceLarge=所有玩家必须离开多少世界单位之外，大型生成点的帕鲁才可被移除。
d:PalLevelScaling.despawnDistanceMedium=所有玩家必须离开多少世界单位之外，中型生成点的帕鲁才可被移除。
d:PalLevelScaling.despawnDistanceNPC=所有玩家必须离开多少世界单位之外，人类 NPC 生成点的角色才可被移除。
d:PalLevelScaling.despawnDistanceSmall=所有玩家必须离开多少世界单位之外，小型生成点的帕鲁才可被移除。
d:PalLevelScaling.levelsAboveSelectedPlayer=新生成的野生帕鲁最多可高于所选附近玩家多少级。
d:PalLevelScaling.levelsBelowSelectedPlayer=新生成的野生帕鲁最多可低于所选附近玩家多少级。
d:PalLevelScaling.playerDetectionRangeBuffer=寻找作为缩放参照的附近玩家时，在生成点半径上额外增加的世界单位。
d:PalLevelScaling.playerLevelSelectionMode=生成时向哪位附近玩家看齐：最近、最高、最低、平均、中位数或随机。
d:PalLevelScaling.scalingDirection=生成等级可向哪个方向调整：仅向上提升较弱生成、仅向下压低较强生成，或两者皆可。
d:PalLevelScaling.spawnRadiusLarge=大型野生帕鲁生成点可被激活的距离，单位为世界单位，约每米 100。
d:PalLevelScaling.spawnRadiusMedium=中型野生帕鲁生成点可被激活的距离，单位为世界单位，约每米 100。
d:PalLevelScaling.spawnRadiusNPC=人类 NPC 生成点可被激活的距离，单位为世界单位，约每米 100。
d:PalLevelScaling.spawnRadiusSmall=小型野生帕鲁生成点可被激活的距离，单位为世界单位，约每米 100。
d:PalMiniMap.autohideInBase=你在基地营地内时隐藏小地图。
d:PalMiniMap.autozoom=移动速度越快，小地图视野自动放宽。
d:PalMiniMap.autozoomFly=开启自动缩放时，飞行状态下应用的缩放倍率。 (?)
d:PalMiniMap.autozoomRun=开启自动缩放时，奔跑状态下应用的缩放倍率。 (?)
d:PalMiniMap.autozoomWalk=开启自动缩放时，步行状态下应用的缩放倍率。 (?)
d:PalMiniMap.baseCampRadius=当游戏自身的判定无法读取时，用于判断你是否处于基地营地内的备用半径。 (?)
d:PalMiniMap.captureHeight=实时渲染摄像机位于你上方的高度，范围为 200 到 20000 世界单位。
d:PalMiniMap.captureIntervalMs=实时地形重新渲染的频率，单位为毫秒，范围为 100 到 2000。
d:PalMiniMap.captureStyle=优先尝试的实时渲染来源：0 为带光照的世界，1 为无光照的纯色平面，后者可能回退为带光照。
d:PalMiniMap.circular=把小地图绘制为圆形而不是方形。
d:PalMiniMap.elevationIndicatorSize=标记上高度箭头的大小，范围为 5 到 18 像素。
d:PalMiniMap.elevationThreshold=标记要高于或低于你多远（单位为厘米）才会显示高度箭头。
d:PalMiniMap.enabled=显示或隐藏小地图。
d:PalMiniMap.hideBehindGameUi=游戏自身菜单打开时隐藏小地图。
d:PalMiniMap.hideCollected=隐藏你已经收集过的箱子、蛋、笔记和雕像。
d:PalMiniMap.iconSize=小地图标记图标的大小，范围为 10 到 40 像素。
d:PalMiniMap.keys.corner=把小地图移到屏幕下一个角落的按键。
d:PalMiniMap.keys.down=仅在编辑模式下，把小地图下移的按键。
d:PalMiniMap.keys.edit=进入编辑模式的按键，此时方向键可移动小地图，缩放键可调整其大小。
d:PalMiniMap.keys.left=仅在编辑模式下，把小地图左移的按键。
d:PalMiniMap.keys.megazoom=切换超级缩放（显示整个区域的视图）的按键。
d:PalMiniMap.keys.menu=打开和关闭 PalMiniMap 设置菜单的按键。
d:PalMiniMap.keys.right=仅在编辑模式下，把小地图右移的按键。
d:PalMiniMap.keys.up=仅在编辑模式下，把小地图上移的按键。
d:PalMiniMap.keys.visible=显示或隐藏小地图的按键。
d:PalMiniMap.keys.zoomIn=放大小地图的按键，编辑模式开启时会放大小地图本身。
d:PalMiniMap.keys.zoomOut=缩小小地图的按键，编辑模式开启时会缩小小地图本身。
d:PalMiniMap.liveTerrain=从上方实时渲染地形，而不是绘制游戏自身的世界地图贴图。
d:PalMiniMap.liveZoomMax=超过此缩放级别时，小地图会从实时渲染回退到世界地图贴图。
d:PalMiniMap.lockIconsNorth=小地图旋转时保持图标朝向不变。
d:PalMiniMap.mapQuality=小地图地形的清晰度，从 0（最低）到 3（最清晰）。
d:PalMiniMap.maxNpcIcons=小地图一次最多显示多少个 NPC 图标，范围为 0 到 64。
d:PalMiniMap.maxPalIcons=小地图一次最多显示多少个帕鲁图标，范围为 8 到 128。
d:PalMiniMap.maxPlayerIcons=小地图一次最多显示多少个其他玩家图标，范围为 0 到 64。
d:PalMiniMap.maxPoiIcons=小地图一次最多显示多少个兴趣点图标，范围为 8 到 128。
d:PalMiniMap.megazoom=超级缩放视图显示的世界范围，单位为世界单位，范围为 60000 到 500000。
d:PalMiniMap.megazoomActive=超级缩放区域视图当前是否开启。 (?)
d:PalMiniMap.menuLanguage=设置菜单使用的语言，留空则跟随游戏设定的语言。 (?)
d:PalMiniMap.moveIntervalMs=图标重新定位的频率，单位为毫秒，数值越低越流畅但开销越大。
d:PalMiniMap.onlyShinyPals=只在小地图上显示闪光帕鲁，隐藏普通帕鲁。
d:PalMiniMap.opacity=小地图的不透明度，取值为 0 到 1 之间的小数。
d:PalMiniMap.palsWhileMegazoom=超级缩放区域视图开启时仍显示帕鲁图标。
d:PalMiniMap.playerIconSize=你自己玩家标记的大小，范围为 10 到 48 像素。
d:PalMiniMap.rotateWithCamera=让小地图随摄像机旋转，而不是始终保持北方朝上。
d:PalMiniMap.scanIntervalMs=重新扫描世界以查找新物体的频率，单位为毫秒，范围为 1000 到 20000。
d:PalMiniMap.showBaseCamps=在小地图上显示玩家基地营地。
d:PalMiniMap.showChests=在小地图上显示宝箱。
d:PalMiniMap.showDeaths=在小地图上显示你死亡的地点。
d:PalMiniMap.showDungeons=在小地图上显示地下城。
d:PalMiniMap.showEffigies=在小地图上显示利姆能雕像。
d:PalMiniMap.showEggs=在小地图上显示帕鲁蛋。
d:PalMiniMap.showElevationIndicators=在明显高于或低于你的标记上绘制箭头。
d:PalMiniMap.showEnemyCamps=在小地图上显示敌方营地。
d:PalMiniMap.showFastTravel=在小地图上显示快速传送点。
d:PalMiniMap.showFishing=在小地图上显示钓鱼点。
d:PalMiniMap.showNPCs=在小地图上显示人类 NPC。
d:PalMiniMap.showNotes=在小地图上显示笔记。
d:PalMiniMap.showPals=在小地图上显示帕鲁。
d:PalMiniMap.showPlayers=在小地图上显示其他玩家。
d:PalMiniMap.showResources=在小地图上显示矿石、莲花和废品等采集点。
d:PalMiniMap.showSkillFruit=在小地图上显示技能果实树。
d:PalMiniMap.showTowers=在小地图上显示塔。
d:PalMiniMap.showTreasureMaps=在小地图上显示藏宝图对应的埋藏宝藏。
d:PalMiniMap.showViewCone=在小地图上绘制显示摄像机朝向的扇形区域。
d:PalMiniMap.size=小地图的大小，单位为像素，范围为 120 到 480。
d:PalMiniMap.terrainTexture=小地图绘制使用的地图贴图，留空则使用游戏自身的世界地图。 (?)
d:PalMiniMap.viewConeOpacity=摄像机视野扇形区域的不透明度，取值为 0 到 1 之间的小数。
d:PalMiniMap.viewConeSize=摄像机视野扇形区域的长度，以小地图半径的比例表示。
d:PalMiniMap.x=小地图在屏幕上的水平位置（像素），负值表示与右边缘的距离。 (?)
d:PalMiniMap.y=小地图在屏幕上的垂直位置（像素），负值表示与下边缘的距离。 (?)
d:PalMiniMap.zoom=小地图显示的世界范围，单位为世界单位，范围为 4000 到 120000。
d:PalMiniMap.zoomFactor=每按一次缩放键使视野放大或缩小的倍数，让每一步在任意缩放级别下感觉一致。 (?)
d:PalMiniMap.zoomMax=小地图可显示的最大世界范围，单位为世界单位，也就是缩小的上限。 (?)
d:PalMiniMap.zoomMin=小地图可显示的最小世界范围，单位为世界单位，也就是放大的上限。 (?)
d:PalSchema.enableAutoReload=当 PalSchema 内容模组的文件发生变化时，在游戏运行中重新应用它们。 (?)
d:PalSchema.enableDebugLogging=把更多细节写入日志，报告内容模组问题时很有用。 (?)
d:PalSchema.languageOverride=强制 PalSchema 内容模组使用指定语言显示文本，而不跟随游戏。 (?)
d:PalSizeSurgery.charge_gold=每次在帕鲁手术台上更改帕鲁体型时收取金币。
d:PalSizeSurgery.default_size_permille=更改体型页打开时的起始体型，单位为正常体型的千分之一。 (?)
d:PalSizeSurgery.diagnostic_logging=把额外的 Pal Size Surgery 信息写入 UE4SS 日志，便于排查问题。
d:PalSizeSurgery.gold_cost=在帕鲁手术台上更改一次体型所收取的金币数量。 (?)
d:PalSizeSurgery.max_size_permille=可选的最大体型，单位为正常体型的千分之一，2000 即表示 2.00 倍。 (?)
d:PalSizeSurgery.maximum_size=更改体型页允许设定的最大体型，默认是 2.00 倍。
d:PalSizeSurgery.min_size_permille=可选的最小体型，单位为正常体型的千分之一，200 即表示 0.20 倍。 (?)
d:PalSizeSurgery.minimum_gold_cost=单次体型更改最少收取的金币数量。 (?)
d:PalSizeSurgery.minimum_size=更改体型页允许设定的最小体型，默认是 0.20 倍。
d:PalSizeSurgery.mounted_camera_distance=调整骑乘已调整体型帕鲁时摄像机与其的距离。 (?)
d:PalSizeSurgery.mounted_minimum_size=可骑乘帕鲁仍能被骑乘的最小体型，默认是 0.80 倍。
d:PalSizeSurgery.step_size_permille=体型选择器每一步调整的幅度，单位为正常体型的千分之一。 (?)
d:PalWorkPriority.CONTAINER_BASE_CLASS=模组读取基地仓库容器时使用的内部游戏类。 (?)
d:PalWorkPriority.FRESH_SECONDS=设置已存储读数在被重新读取前保持有效的秒数。 (?)
d:PalWorkPriority.MAX_CEILING=设置生产限制规则可设定的最高库存上限。 (?)
d:PalWorkPriority.MAX_ID_LEN=设置模组在生产限制规则中接受的最长物品 id。 (?)
d:PalWorkPriority.MAX_RULES=设置模组同时保留的生产限制规则数量上限。 (?)
d:PalWorkPriority.STATION_SUIT.BlastFurnace_0=模组匹配鼓风炉工作站所使用的内部工作适性。 (?)
d:PalWorkPriority.STATION_SUIT.CampFire_0=模组匹配营火工作站所使用的内部工作适性。 (?)
d:PalWorkPriority.WORK_IGNORE.Idle=让模组分配工作时不包含空闲这一工作类型。 (?)
d:PalWorkPriority._suitability_warned=记录工作适性警告是否已经显示过的内部记录，编辑它没有任何作用。 (?)
d:PalWorkPriority.assignment_mode=选择帕鲁是分散到各项工作，还是先填满一项工作再分配下一项。
d:PalWorkPriority.enum_offset=模组用来让自身工作类型列表与游戏本身对齐的内部偏移量。 (?)
d:PalWorkPriority.find_ms=模组图标查找耗时的内部计时（毫秒），编辑它没有任何作用。 (?)
d:PalWorkPriority.finds=模组已进行图标查找次数的内部计数，编辑它没有任何作用。 (?)
d:PalWorkPriority.game_ui_active=记录游戏自身某个菜单是否处于打开状态的内部记录，编辑它没有任何作用。 (?)
d:PalWorkPriority.hooked=记录模组的需求挂钩是否已就位的内部记录，编辑它没有任何作用。 (?)
d:PalWorkPriority.interval_seconds=设置模组每次分配之间相隔的秒数。
d:PalWorkPriority.learned_warned=记录图标警告是否已经显示过的内部记录，编辑它没有任何作用。 (?)
d:PalWorkPriority.load_ms=模组加载图标耗时的内部计时（毫秒），编辑它没有任何作用。 (?)
d:PalWorkPriority.loads=模组已加载图标次数的内部计数，编辑它没有任何作用。 (?)
d:PalWorkPriority.pc_fallbacks=记录模组回退使用其他方式获取玩家控制器次数的内部计数，编辑它没有任何作用。 (?)
d:PalWorkPriority.perf=开启模组的性能日志。 (?)
d:PalWorkPriority.storage_scope=选择生产限制是按每个基地单独计算，还是把所有基地合并计算。
d:PalWorkPriority.worst_find=记录模组已进行过的最慢一次图标查找的内部记录，编辑它没有任何作用。 (?)
d:PalboxPageLock.InfoKeybind=弹出你的完整已锁定页面列表和当前按键绑定的按键。
d:PalboxPageLock.Lang.AllUnlocked=所有已锁定页面都解锁后显示的文字。 (?)
d:PalboxPageLock.Lang.ButtonAlreadyLocked=锁定一个已锁定页面时显示的文字。 (?)
d:PalboxPageLock.Lang.ButtonAlreadyUnlocked=解锁一个未锁定页面时显示的文字。 (?)
d:PalboxPageLock.Lang.ButtonList=列出你已锁定页面的按钮上的文字。
d:PalboxPageLock.Lang.ButtonLock=锁定你正在查看的帕鲁盒页面的按钮上的文字。
d:PalboxPageLock.Lang.ButtonLockedFlash=页面刚被锁定后按钮闪烁显示的文字。 (?)
d:PalboxPageLock.Lang.ButtonUnlock=解锁你正在查看的帕鲁盒页面的按钮上的文字。
d:PalboxPageLock.Lang.ButtonUnlockedFlash=页面刚被解锁后按钮闪烁显示的文字。 (?)
d:PalboxPageLock.Lang.LockedListPrefix=放在你已锁定页面列表前面的文字。 (?)
d:PalboxPageLock.Lang.NoPagesLocked=当你的帕鲁盒页面都没有锁定时显示的文字。 (?)
d:PalboxPageLock.Lang.Unlocked=模组用来表示页面未锁定的用词。 (?)
d:PalboxPageLock.ListKeybind=显示并刷新你的哪些帕鲁盒页面已锁定的按键。
d:PalboxPageLock.Message=模组显示的更新提示的内部文本。 (?)
d:PalboxPageLock.NoticeVersion=记录更新提示所属模组版本的内部记录。 (?)
d:PalboxPageLock.PruneAfterDays=设置玩家离线多少天后，主机会清除其已保存的锁定页面。
d:PalboxPageLock.UnlockAllKeybind=一次性解锁你全部已锁定帕鲁盒页面的按键。
d:PalboxSearchPlus.autocomplete_limit=你输入时自动补全列表提供的被动技能名称建议数量。 (?)
d:PalboxSearchPlus.condenser_click_searches=在凝聚器点击队伍中的帕鲁时，把同种族的其余帕鲁集中到你面前。
d:PalboxSearchPlus.container_swaps_per_tick=搜索重排你的盒子时每游戏帧发送的帕鲁移动数，若服务器把你踢下线可调低。
d:PalboxSearchPlus.count=内置繁殖表覆盖的种族数量，属于生成数据而非一项设置。 (?)
d:PalboxSearchPlus.diagnostic_logging=写出详细日志以便提交错误报告，重现问题前值得开启。
d:PalboxSearchPlus.enable_client_view_sort=在不移动帕鲁的前提下重排帕鲁盒子视图，并在排序菜单中加入额外的属性与个体值按钮。 (?)
d:PalboxSearchPlus.filter_debounce_ms=你停止输入多少毫秒后盒子才重新筛选，以免每次按键都重建列表。 (?)
d:PalboxSearchPlus.focus_search_on_open=界面打开的瞬间把键盘焦点交给搜索栏，这会暂停 Q 和 E 翻页直到你确认输入。
d:PalboxSearchPlus.poll_interval_ms=检查搜索框的间隔毫秒数，默认 50，越高越省性能但反应越慢。 (?)
d:PalboxSearchPlus.restore_order_after_search=当你清除搜索或离开界面时，把凝聚器与商人处的盒子恢复原样。
d:PalboxSearchPlus.save_parameter_reads=读取已保存的帕鲁数据，使幸运、收藏、凝聚和个体值搜索可用，默认关闭是因为它会让部分环境崩溃。
d:PalboxSearchPlus.search_host_asset=模组自己的搜索框框架，它会截获退格键，使其用于编辑而不是关闭盒子。
d:PalboxSearchPlus.search_host_class=模组搜索框框架的内部类名，填错会导致搜索栏不显示。 (?)
d:PalboxSearchPlus.search_host_inner=模组搜索框架内文本框的内部名称，最好完全保持原样。 (?)
d:PalboxSearchPlus.show_focus_toggle=在搜索栏上方显示「自动聚焦」按钮。
d:PalboxSearchPlus.show_status_line=在搜索栏上方显示状态行，繁殖与凝聚规划器通过它汇报信息。
d:PalboxSearchPlus.sorted_slots_per_search=一次排序在凝聚器和商人处实际重排的格子数，120 相当于四页。
d:PalboxSearchPlus.source=说明内置繁殖配对数据来自 PalCalc，它从游戏文件中提取这些数据。
d:PalboxSearchPlus.store_bar_nudge_x=把仓库搜索栏从模组放置的位置左右移动，正值向右。
d:PalboxSearchPlus.store_bar_nudge_y=把仓库搜索栏从模组放置的位置上下移动，正值向下。
d:PalboxSearchPlus.store_bar_x_offset=仓库侧搜索栏位于 Box 1 搜索栏右侧多远，单位为画布单位。
d:PalboxSearchPlus.store_bar_y_offset=仓库侧搜索栏位于 Box 1 搜索栏下方多远，单位为画布单位。
d:PalboxSearchPlus.version=内置繁殖表基于哪个 PalCalc 版本生成，属于数据而非一项设置。
d:PalboxStatCompare.DebugLogging=把额外的诊断消息写入日志以便排查问题。
d:PalpediaEnhancer.ClearAllKey=把所有筛选、排序和搜索目标恢复为下方所设默认值的快捷键，填 None 则不绑定。
d:PalpediaEnhancer.DefaultSearchTargets=打开帕鲁图鉴时搜索框会在哪些内容里查找，多个目标之间用逗号分隔。
d:PalpediaEnhancer.DefaultSort=帕鲁图鉴列表打开时的排序，也是清除全部快捷键会还原到的排序。
d:PalpediaEnhancer.DefaultSortDescending=打开帕鲁图鉴时把该排序反转，让最后一条或数值最高的条目排在最前。
d:PalpediaEnhancer.DefaultUnreadOnly=打开帕鲁图鉴时直接只显示你还没打开过的条目。
d:PalpediaEnhancer.MarkAllSeenKey=把所有未读的帕鲁图鉴条目标记为已打开的快捷键，效果与全部标为已看按钮相同。
d:PalpediaEnhancer.RememberState=在同一次会话中关闭再打开帕鲁图鉴时，保留你的筛选、排序、搜索目标和上次的搜索词。
d:PalpediaEnhancer.ShowMarkAllSeenButton=在 Stats 标签旁显示全部标为已看按钮；即使隐藏该按钮，它的快捷键依然有效。
d:PalpediaEnhancer.ToggleUnreadKey=只显示你还没打开过的帕鲁图鉴条目的快捷键，无需滚动即可清除新条目的圆点。
d:PalpediaEnhancer.VerboseLogging=把额外的帕鲁图鉴诊断信息写入日志，报告错误时很有用。
d:PalsLearnOverTime.__version=模组已保存进度账本的格式标记，不适合手动编辑。 (?)
d:PalsLearnOverTime.applyEnabled=让积累的工作经验真正提升帕鲁的适性，关闭则只记录进度而不改动存档。
d:PalsLearnOverTime.count=记录游戏共有多少种工作适性的内部数据，编辑它没有任何作用。 (?)
d:PalsLearnOverTime.enabled=模组为自身诊断设置的内部开关，编辑它没有任何作用。 (?)
d:PalsLearnOverTime.first=记录第一种工作适性编号的内部数据，编辑它没有任何作用。 (?)
d:PalsLearnOverTime.firstId=模组遍历的第一种工作适性，属于高级区块，请勿改动。 (?)
d:PalsLearnOverTime.last=记录最后一种工作适性编号的内部数据，编辑它没有任何作用。 (?)
d:PalsLearnOverTime.lastId=模组遍历的最后一种工作适性，属于高级区块，请勿改动。 (?)
d:PalsLearnOverTime.logging=把进度与升级记录写入模组自己的日志文件。
d:PalsLearnOverTime.numWorkTypes=模组追踪的工作适性种类数量，属于高级区块，请勿改动。 (?)
d:PalsLearnOverTime.probeSpawnQueues=世界载入期间每隔几秒记录游戏自身生成队列的深度，用于排查问题。
d:PalsLearnOverTime.seq=为模组诊断行编号的内部计数器，编辑它没有任何作用。 (?)
d:PalsLearnOverTime.snapshotEvery=重写进度状态文件的间隔毫秒数，默认 30000。
d:PalsLearnOverTime.unlockTotalCost=为帕鲁解锁其不具备的工作类型所需的花费，仅作参考，解锁功能关闭时不使用。
d:PalsLearnOverTime.worldQuietSec=世界载入后须保持静止多少秒帕鲁才开始积累经验，若载入时崩溃可调高。
d:PalworldEasyCheats.GodModeFlagName=模组用来追踪无敌模式的内部标记名称。 (?)
d:PalworldEasyCheats.HungerFlagName=模组用来追踪禁止饥饿的内部标记名称。 (?)
d:PalworldEasyCheats.JumpFlagName=模组用来追踪高跳作弊的内部标记名称。 (?)
d:PalworldEasyCheats.SavedSpeedMultiplier=记录你上次设定的速度倍率，下次启动时恢复。 (?)
d:PalworldEasyCheats.SpeedFlagName=模组用来追踪角色速度作弊的内部标记名称。 (?)
d:PalworldEasyCheats.building.buildingMaxZ=设置离地建造的最大高度。
d:PalworldEasyCheats.building.buildingObjectMaxNum=设置一个基地可容纳的建筑物数量。
d:PalworldEasyCheats.building.foundationFloatingAllowance=设置地基悬空离地后仍可放置的最大距离。
d:PalworldEasyCheats.building.leanAngleMax=设置建筑仍可放置的最大倾斜角度。
d:PalworldEasyCheats.building.spawnableIfOverlapped=允许放置与其他物体重叠的建筑。
d:PalworldEasyCheats.capture.perfectCaptureRate=让每次捕获帕鲁都必定成功。
d:PalworldEasyCheats.capture.perfectFishCapture=让每次钓鱼都必定成功。
d:PalworldEasyCheats.combat.godModeEnabled=让你的角色不受到任何伤害。
d:PalworldEasyCheats.combat.includePalsGodMode=把无敌模式同时应用到你的帕鲁身上，而不仅是角色本身。
d:PalworldEasyCheats.extras.infiniteAmmo=射击时不消耗弹药。
d:PalworldEasyCheats.extras.instantPalRevive=立即复活倒下的帕鲁。
d:PalworldEasyCheats.extras.instantPalSkillCooldown=移除帕鲁技能的冷却时间。
d:PalworldEasyCheats.extras.noFallDamage=让你摔落时不受到伤害。
d:PalworldEasyCheats.fuel.infiniteFuel=让燃料不被消耗，任何靠燃料驱动的东西都不会耗尽。
d:PalworldEasyCheats.hotkeys.fuel=开关无限燃料的按键（默认 Alt+F）。
d:PalworldEasyCheats.hotkeys.god=开关无敌模式的按键（默认 Alt+G）。
d:PalworldEasyCheats.hotkeys.hunger=开关禁止饥饿的按键（默认 Alt+H）。
d:PalworldEasyCheats.hotkeys.jump=开关高跳的按键（默认 Alt+J）。
d:PalworldEasyCheats.hotkeys.speedDown=降低角色速度倍率的按键（默认 -）。
d:PalworldEasyCheats.hotkeys.speedReset=重置角色速度倍率的按键（默认 Alt+0）。
d:PalworldEasyCheats.hotkeys.speedUp=提高角色速度倍率的按键（默认 =）。
d:PalworldEasyCheats.hotkeys.stamina=开关无限体力的按键（默认 Alt+S）。
d:PalworldEasyCheats.hunger.disableHunger=让你的角色不会感到饥饿。
d:PalworldEasyCheats.hunger.includePalsHunger=把禁止饥饿同时应用到你的帕鲁身上，而不仅是角色本身。
d:PalworldEasyCheats.jump.highJumpEnabled=开启高跳，让你的角色跳得比平常更高。
d:PalworldEasyCheats.jump.jumpHeightMultiplier=设置高跳开启时，角色跳得更高的倍率。
d:PalworldEasyCheats.map.levelOnLoadEnabled=让存档加载完成后，角色变为指定等级。
d:PalworldEasyCheats.map.levelOnLoadTarget=设置存档加载完成后应用的角色等级。
d:PalworldEasyCheats.map.revealMap=揭示整个世界地图。
d:PalworldEasyCheats.map.revealMapClearSize=设置揭示地图时清除迷雾的区域大小。 (?)
d:PalworldEasyCheats.map.unlockAllFastTravelPoints=解锁地图上的每个快速传送点。
d:PalworldEasyCheats.map.unlockAllNotes=解锁地图上的每个世界笔记。
d:PalworldEasyCheats.map.unlockAllNotesNoXp=解锁每个世界笔记，但不给予其通常提供的经验值。
d:PalworldEasyCheats.map.unlockAllPalEffigies=解锁地图上的每座帕鲁雕像。
d:PalworldEasyCheats.map.unlockAllPalEffigiesNoXp=解锁每座帕鲁雕像，但不给予其通常提供的经验值。
d:PalworldEasyCheats.movement.defaultSpeedMultiplier=设置重置速度快捷键恢复到的速度倍率。 (?)
d:PalworldEasyCheats.movement.matchSwimSpeed=把你的速度倍率同时应用到游泳，而不仅是陆地移动。 (?)
d:PalworldEasyCheats.movement.maxSpeedMultiplier=设置速度快捷键可达到的最高速度倍率。 (?)
d:PalworldEasyCheats.movement.minSpeedMultiplier=设置速度快捷键可达到的最低速度倍率。 (?)
d:PalworldEasyCheats.movement.speedMultiplier=设置你的角色比正常移动快多少倍。
d:PalworldEasyCheats.movement.speedStep=设置速度快捷键每按一次调整速度倍率的幅度。 (?)
d:PalworldEasyCheats.multipliers.characterMaxLevel=设置角色可达到的最高等级。
d:PalworldEasyCheats.multipliers.techPointMultiplier=让你获得的科技点数倍增。
d:PalworldEasyCheats.stamina.infiniteStamina=让你的体力不再消耗。
d:PalworldEasyCheats.system.applyOnLoadDelayMs=设置存档加载完成后，模组等待多久（毫秒）才应用设置。
d:PalworldEasyCheats.system.disablePermanentConfirmAlerts=关闭应用永久性选项前弹出的确认提示。 (?)
d:PalworldEasyCheats.system.maintainIntervalMs=设置模组重新应用你已启用作弊的频率，单位为毫秒。 (?)
d:PalworldEasyCheats.system.persistModifications=让你选择的作弊持续生效，而不是每次游玩都重置。 (?)
d:PalworldEasyCheats.system.skipModDisclaimer=跳过游戏启动时显示的检测到模组免责声明。
d:PalworldEasyCheats.travel.fastTravelAnyMapIcon=让你可以从地图上的任意图标快速传送。
d:PalworldEasyCheats.work.fasterWorkSpeed=让你的帕鲁工作更快。
d:PalworldEasyCheats.work.noBuildingCosts=让你放置建筑时不消耗材料。
d:PalworldEasyCheats.work.noCraftingCosts=让你合成物品时不消耗材料。
d:PalworldEasyCheats.work.workSpeedMultiplier=设置更快工作速度开启时，帕鲁工作加快的倍率。
d:PartySlotExtender.PartySlotCount=设置队伍中携带的帕鲁数量，范围为 6 到 10，默认是 8。
d:PassivePals.aggressivePalProfile=通常一看见你就穷追不舍的帕鲁所使用的反应配置；填 default 则沿用上面的设置。
d:PassivePals.alphaAndBossProfile=游戏中的头目帕鲁和 Boss 所使用的反应配置；填 default 则沿用所有帕鲁的设置。
d:PassivePals.behaviorProfiles.custom.AttackedByEqual=当强弱相当的 NPC 打中它时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.AttackedByPlayer=当你亲自打中该角色时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.AttackedByStronger=当更强的 NPC 打中它时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.AttackedByWeaker=当更弱的 NPC 打中它时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.SeeEqual=当某个角色注意到强弱相当的 NPC 时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.SeePlayer=当某个角色注意到你、而此前什么都还没发生时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.SeeStronger=当某个角色注意到更强的 NPC 时，custom 配置给出的反应。
d:PassivePals.behaviorProfiles.custom.SeeWeaker=当某个角色注意到更弱的 NPC 时，custom 配置给出的反应。
d:PassivePals.defaultHumanProfile=每个人类 NPC 使用的反应配置，保持为 vanilla，让敌对人类依旧危险、村民照常行事。
d:PassivePals.defaultPalProfile=你控制之外的每只帕鲁使用的反应配置，除非下面的 AI 预设或种族规则将其覆盖。
d:PassivePals.friendlyPalProfile=包括 Lamball、Chikipi 和 Daedream 在内的六种友好帕鲁所使用的反应配置。
d:PassivePals.hostileHumanProfile=一看见你就发起攻击的人类所使用的反应配置，例如猎人营地里的劫掠者。
d:PassivePals.liveReloadSeconds=这个模组每隔多少秒检查一次自己的文件，看你有没有改动，这样改动在游戏中就会生效；设为 0 会停止检查，直到下次启动。
d:PassivePals.logging=这个模组往 UE4SS 日志里写多少内容；quiet 只保留载入行、警告和问题。
d:PassivePals.nativePresetClassPath=反应预设类型的内部地址，模组会为每个配置的种族各创建一个。
d:PassivePals.neutralPalProfile=通常不理会你、直到真的挨打才反应的帕鲁所使用的反应配置。
d:PassivePals.pollLimit=模组放弃本次会话、把所有帕鲁的反应保持原样之前的尝试次数。
d:PassivePals.pollSeconds=模组等待游戏载入它要改写的 AI 预设期间，两次尝试之间的间隔秒数。
d:PassivePals.preservePettingBehavior=保留温顺物种走上前来讨摸的行为，而不是让你选的配置把它覆盖掉。
d:PassivePals.response.Battle=游戏自身的编号，表示仅在强弱判定认为能赢时才反击。
d:PassivePals.response.Battle_Anyway=游戏自身的编号，表示始终反击，完全不做强弱判定。
d:PassivePals.response.Escape=游戏自身的编号，表示让帕鲁逃跑的反应。
d:PassivePals.response.Ignore=游戏自身的编号，表示什么都不做的反应，既不战也不逃。
d:PassivePals.response.Special=游戏自身的编号，表示脚本化的反应，例如温顺的帕鲁走上前来讨摸。
d:PassivePals.sensorSensePath=各种族规则所挂接的、游戏自身感知判定的内部地址。
d:PassivePals.skittishPalProfile=你一靠近就撒腿跑开的帕鲁所使用的反应配置，例如 Cattiva 和 Lifmunk。
d:PassivePals.speciesRules.rule1Profile=第一条规则中指定的物种所使用的反应配置，它会覆盖上面的所有设置。
d:PassivePals.speciesRules.rule1Species=第一条规则适用的物种，可写英文名称、内部 id 或 Blueprint 名称。
d:PassivePals.speciesRules.rule2Profile=第二条规则中指定的物种所使用的反应配置，它会覆盖上面的所有设置。
d:PassivePals.speciesRules.rule2Species=第二条规则适用的物种，可写英文名称、内部 id 或 Blueprint 名称。
d:PassivePals.speciesRules.rule3Profile=第三条规则中指定的物种所使用的反应配置，它会覆盖上面的所有设置。
d:PassivePals.speciesRules.rule3Species=第三条规则适用的物种，可写英文名称、内部 id 或 Blueprint 名称。
d:PassivePals.villagerProfile=村民、商人和警察所使用的反应配置；填 default 则沿用所有人类的设置。
