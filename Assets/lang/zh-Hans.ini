d:PerfectPlacement.gamepad.enabled=通过配套输入桥接启用手柄支持，需要重启游戏。
d:PerfectPlacement.gamepad.invert_forward_back=交换让冻结预览前后移动的手柄按键。
d:PerfectPlacement.gamepad.invert_height=交换让冻结预览上下移动的手柄按键。
d:PerfectPlacement.gamepad.swap_rotate_buttons=交换让冻结预览左右旋转的手柄按键。
d:PerfectPlacement.hold_locked_transform=持续重新应用冻结位置，使预览不会弹回准星处，代价是额外的帧开销。
d:PerfectPlacement.movement.coarse=遗留的一百厘米粗调移动步幅，模组已不再读取。 (?)
d:PerfectPlacement.movement.fine=遗留的一厘米微调移动步幅，模组已不在任何地方读取。 (?)
d:PerfectPlacement.movement.maximum=增大步幅按键可达到的最大移动步幅，单位为厘米，范围 0.1 到 1000。
d:PerfectPlacement.movement.maximum_above_initial_cm=冻结预览可高出冻结时高度的厘米数，默认 650。
d:PerfectPlacement.movement.maximum_below_initial_cm=冻结预览可低于冻结时高度的厘米数，默认 25。
d:PerfectPlacement.movement.minimum=减小步幅按键可达到的最小移动步幅，单位为厘米，范围 0.1 到 1000。
d:PerfectPlacement.movement.normal=冻结预览起始的移动步幅，单位为厘米，范围 0.1 到 1000。
d:PerfectPlacement.movement.step_scale=每次按下增大或减小步幅时应用于移动步幅的倍数，可为 2、5 或 10。
d:PerfectPlacement.rotation.coarse=旋转步幅档位中的粗调步幅，单位为度，默认 15 度。
d:PerfectPlacement.rotation.fine=旋转步幅档位中的微调步幅，单位为度，默认 1 度。
d:PerfectPlacement.rotation.normal=旋转步幅档位中的中间步幅，单位为度，默认 5 度。
d:PerfectPlacement.rotation.precision=旋转步幅档位中的最小步幅，单位为度，默认为十分之一度。 (?)
d:PerfectPlacement.rotation.snap=旋转步幅档位中的最大步幅，单位为度，默认 45 度。
d:PerfectPlacement.transform_refresh_ms=开启位置保持时，重新应用冻结位置的间隔毫秒数。 (?)
d:PerfectPlacement.ui.gamepad_enabled_property=标示手柄输入是否开启的引导界面字段的内部名称。 (?)
d:PerfectPlacement.ui.hide_function=隐藏放置引导的配套调用的内部名称，编辑它没有任何作用。 (?)
d:PerfectPlacement.ui.hide_toast_function=清除冻结与解除提示消息的配套调用的内部名称。 (?)
d:PerfectPlacement.ui.host_class_name=放置引导所附着的配套控件名称，编辑它没有任何作用。 (?)
d:PerfectPlacement.ui.move_step_property=携带当前移动步幅（厘米）的引导界面字段的内部名称。 (?)
d:PerfectPlacement.ui.refresh_function=改动后重绘放置引导的配套调用的内部名称。 (?)
d:PerfectPlacement.ui.show_frozen_guide_function=预览处于冻结状态时显示引导的配套调用的内部名称。 (?)
